<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Watch Party P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080a0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    background:#252b34;
    color:#fff;
    cursor:pointer;
    font-size:13px;
}

button:hover{background:#343c48}
button:disabled{opacity:.4;cursor:not-allowed}

input{
    border:1px solid #343a44;
    background:#171a20;
    color:#fff;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.app{
    width:100%;
    height:100%;
    display:flex;
}

/* ================= STAGE ================= */

.stage{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
    background:#000;
    overflow:hidden;
}

#screenVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.no-screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8b929c;
    font-size:18px;
    pointer-events:none;
}

.no-screen.hidden{display:none}

/* ================= STAGE BUTTON ================= */

.stage-controls{
    position:absolute;
    top:12px;
    left:12px;
    z-index:100;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.stage-btn{
    background:rgba(20,24,30,.85);
    backdrop-filter:blur(10px);
}

.screen-status{
    position:absolute;
    top:12px;
    right:12px;
    z-index:100;
    padding:8px 11px;
    border-radius:8px;
    background:rgba(20,24,30,.85);
    backdrop-filter:blur(10px);
    color:#c3c9d1;
    font-size:11px;
}

/* ================= BUBBLES ================= */

.bubbles{
    position:absolute;
    inset:0;
    z-index:80;
    pointer-events:none;
}

.bubble{
    position:absolute;
    left:15px;
    bottom:15px;
    width:145px;
    height:105px;
    background:#11151b;
    border:2px solid #424a56;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 6px 25px rgba(0,0,0,.55);
    pointer-events:auto;
    touch-action:none;
    user-select:none;
}

.bubble video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#101216;
}

.bubble-name{
    position:absolute;
    left:5px;
    bottom:5px;
    max-width:85%;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    background:rgba(0,0,0,.65);
    border-radius:5px;
    padding:4px 6px;
    font-size:10px;
}

.bubble-mic{
    position:absolute;
    right:5px;
    top:5px;
    background:rgba(0,0,0,.7);
    border-radius:5px;
    padding:4px 5px;
    font-size:10px;
}

.bubble-off{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#14171c;
    font-size:27px;
}

.bubble-size{
    position:absolute;
    right:0;
    bottom:0;
    width:22px;
    height:22px;
    cursor:nwse-resize;
    background:rgba(255,255,255,.18);
    border-radius:8px 0 0 0;
    z-index:5;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:360px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#15181e;
    border-left:1px solid #2b3038;
}

.header{
    padding:13px;
    border-bottom:1px solid #292e36;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.connection{
    margin-top:4px;
    font-size:11px;
    color:#89919d;
}

/* ================= CHAT ================= */

.chat{
    order:1;
    height:37%;
    min-height:220px;
    display:flex;
    flex-direction:column;
    border-bottom:1px solid #292e36;
}

.section-title{
    padding:9px 12px;
    font-size:12px;
    font-weight:bold;
    color:#adb4be;
    border-bottom:1px solid #292e36;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px;
}

.message{
    margin-bottom:8px;
}

.message-name{
    color:#858e9b;
    font-size:10px;
    margin-bottom:3px;
}

.message-text{
    display:inline-block;
    max-width:92%;
    padding:7px 9px;
    background:#252a33;
    border-radius:8px;
    font-size:12px;
    word-break:break-word;
}

.chat-input{
    display:flex;
    gap:6px;
    padding:8px;
    border-top:1px solid #292e36;
}

.chat-input input{
    flex:1;
    min-width:0;
}

/* ================= OTHER PANELS ================= */

.scroll-area{
    flex:1;
    min-height:0;
    overflow-y:auto;
}

.panel{
    padding:11px 12px;
    border-bottom:1px solid #292e36;
}

.panel-title{
    color:#adb4be;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

.name-row{
    display:flex;
    gap:6px;
}

.name-row input{
    flex:1;
    min-width:0;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.room-row{
    display:flex;
    gap:5px;
}

.room-row input{
    flex:1;
    min-width:0;
    font-size:10px;
}

/* ================= HOST ================= */

.host-user{
    background:#1e2229;
    border-radius:8px;
    padding:8px;
    margin-bottom:6px;
}

.host-user-top{
    display:flex;
    align-items:center;
    gap:7px;
}

.host-user-info{
    flex:1;
    min-width:0;
}

.host-user-name{
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.host-user-state{
    margin-top:3px;
    font-size:10px;
    color:#858e9b;
}

.host-actions{
    display:flex;
    gap:4px;
    margin-top:6px;
    flex-wrap:wrap;
}

.host-actions button{
    padding:5px 7px;
    font-size:10px;
}

.kick{
    background:#7d2730;
}

.kick:hover{
    background:#a5313c;
}

/* ================= FULLSCREEN ================= */

.stage.fullscreen{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:999999;
}

.stage.fullscreen .bubble{
    width:130px;
    height:92px;
}

.stage.fullscreen .stage-controls{
    top:15px;
    left:15px;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .app{
        display:block;
        overflow:auto;
    }

    .stage{
        height:58vh;
    }

    .sidebar{
        width:100%;
        height:42vh;
        border-left:0;
        border-top:1px solid #292e36;
    }

    .chat{
        height:42%;
        min-height:180px;
    }

    .bubble{
        width:115px;
        height:84px;
    }
}
</style>
</head>

<body>

<div class="app">

<main class="stage" id="stage">

    <video
        id="screenVideo"
        autoplay
        playsinline>
    </video>

    <div class="no-screen" id="noScreen">
        <div>
            <div style="font-size:40px">🎬</div>
            <div>Belum ada yang membagikan layar</div>
        </div>
    </div>

    <div class="stage-controls">

        <button class="stage-btn" id="fullscreenBtn">
            ⛶ Fullscreen
        </button>

        <button class="stage-btn" id="shareBtn">
            🖥️ Share Screen
        </button>

        <button class="stage-btn" id="stopShareBtn" style="display:none">
            ⛔ Stop Share
        </button>

    </div>

    <div class="screen-status" id="screenStatus">
        Tidak ada screen share
    </div>

    <div class="bubbles" id="bubbles"></div>

</main>


<aside class="sidebar">

    <div class="header">
        <div class="title">🎬 Watch Party</div>
        <div class="connection" id="connectionStatus">
            Menghubungkan...
        </div>
    </div>


    <!-- CHAT DI ATAS -->

    <div class="chat">

        <div class="section-title">
            💬 Chat
        </div>

        <div class="messages" id="messages"></div>

        <div class="chat-input">
            <input
                id="chatInput"
                maxlength="300"
                placeholder="Tulis pesan...">

            <button id="sendBtn">
                Kirim
            </button>
        </div>

    </div>


    <div class="scroll-area">

        <!-- IDENTITAS -->

        <div class="panel">

            <div class="panel-title">
                👤 Identitas
            </div>

            <div class="name-row">

                <input
                    id="nameInput"
                    maxlength="25"
                    placeholder="Nama kamu">

                <button id="saveNameBtn">
                    Simpan
                </button>

            </div>

        </div>


        <!-- CAMERA MIC -->

        <div class="panel">

            <div class="panel-title">
                🎤 Kamera & Mic
            </div>

            <div class="controls">

                <button id="cameraBtn">
                    📷 Kamera ON
                </button>

                <button id="micBtn">
                    🎤 Mic ON
                </button>

                <button id="switchCameraBtn">
                    🔄 Kamera
                </button>

                <button id="leaveBtn">
                    🚪 Keluar
                </button>

            </div>

        </div>


        <!-- ROOM -->

        <div class="panel">

            <div class="panel-title">
                🔗 Link Room
            </div>

            <div class="room-row">

                <input
                    id="roomUrl"
                    readonly>

                <button id="copyRoomBtn">
                    Salin
                </button>

            </div>

        </div>


        <!-- HOST -->

        <div
            class="panel"
            id="hostPanel"
            style="display:none">

            <div class="panel-title">
                👑 Kontrol Host
            </div>

            <div style="
                color:#858e9b;
                font-size:10px;
                margin-bottom:8px">
                Kelola mic, kamera, izin share screen dan peserta.
            </div>

            <div id="hostUsers"></div>

        </div>

    </div>

</aside>

</div>


<script>

/* =====================================================
   BASIC
===================================================== */

const params =
    new URLSearchParams(location.search);

let roomId =
    params.get("room");

let isHost = false;

if(!roomId){

    roomId =
        "room-" +
        Math.random()
        .toString(36)
        .substring(2,9);

    isHost = true;

    history.replaceState(
        {},
        "",
        location.pathname +
        "?room=" +
        encodeURIComponent(roomId)
    );

}else{

    isHost = false;
}


/* =====================================================
   PEER
===================================================== */

let peer;

if(isHost){

    peer = new Peer(roomId);

}else{

    peer = new Peer();

}


/* =====================================================
   STATE
===================================================== */

let myName =
    localStorage.getItem("watchparty_name") ||
    "User-" +
    Math.floor(Math.random()*9999);

let cameraEnabled = false;
let micEnabled = false;

let cameraFacing = "user";

let localCameraStream = null;
let localScreenStream = null;

let screenOwner = null;
let screenPermission = null;

const participants = {};
const connections = {};
const cameraCalls = {};
const screenCalls = {};

let kicked = false;


/* =====================================================
   ELEMENTS
===================================================== */

const stage =
    document.getElementById("stage");

const screenVideo =
    document.getElementById("screenVideo");

const noScreen =
    document.getElementById("noScreen");

const bubbles =
    document.getElementById("bubbles");

const messages =
    document.getElementById("messages");

const chatInput =
    document.getElementById("chatInput");

const nameInput =
    document.getElementById("nameInput");

const roomUrl =
    document.getElementById("roomUrl");

const hostPanel =
    document.getElementById("hostPanel");

const hostUsers =
    document.getElementById("hostUsers");

const shareBtn =
    document.getElementById("shareBtn");

const stopShareBtn =
    document.getElementById("stopShareBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const micBtn =
    document.getElementById("micBtn");

const switchCameraBtn =
    document.getElementById("switchCameraBtn");

const connectionStatus =
    document.getElementById("connectionStatus");


nameInput.value = myName;
roomUrl.value = location.href;


/* =====================================================
   PARTICIPANT SELF
===================================================== */

function updateSelf(){

    if(!peer || !peer.id) return;

    participants[peer.id] = {
        name:myName,
        camera:cameraEnabled,
        mic:micEnabled,
        cameraLocked:
            participants[peer.id]?.cameraLocked || false,
        micLocked:
            participants[peer.id]?.micLocked || false,
        connected:true,
        self:true
    };

    cameraBtn.textContent =
        cameraEnabled
        ? "📷 Kamera OFF"
        : "📷 Kamera ON";

    micBtn.textContent =
        micEnabled
        ? "🎤 Mic OFF"
        : "🔇 Mic ON";

    renderBubbles();
    updateHostUsers();
}


/* =====================================================
   PEER OPEN
===================================================== */

peer.on("open", id => {

    connectionStatus.textContent =
        isHost
        ? "👑 Host • Online"
        : "🟢 Online";

    updateSelf();

    if(isHost){

        hostPanel.style.display =
            "block";

        screenPermission =
            id;

    }else{

        connectToPeer(roomId);

    }

});


/* =====================================================
   PEER ERROR
===================================================== */

peer.on("error", error => {

    console.error(error);

    if(error.type === "unavailable-id"){

        alert(
            "Room sedang digunakan. Refresh halaman untuk membuat room baru."
        );

    }else{

        connectionStatus.textContent =
            "⚠️ " + error.type;

    }

});


/* =====================================================
   CONNECTION
===================================================== */

function connectToPeer(id){

    if(!peer || id === peer.id) return;

    if(connections[id]) return;

    const conn =
        peer.connect(id,{
            reliable:true
        });

    setupConnection(conn);
}


function setupConnection(conn){

    if(connections[conn.peer]){
        return;
    }

    connections[conn.peer] =
        conn;

    conn.on("open",() => {

        sendTo(conn,{
            type:"hello",
            name:myName,
            camera:cameraEnabled,
            mic:micEnabled
        });

        if(isHost){

            sendTo(conn,{
                type:"permission",
                permission:screenPermission,
                owner:screenOwner
            });

        }

        /*
           Jika kamera kita sudah aktif,
           kirim ke peserta baru.
        */

        if(cameraEnabled &&
           localCameraStream){

            startCameraCall(conn.peer);

        }

    });


    conn.on("data",data => {

        handleData(
            conn.peer,
            data
        );

    });


    conn.on("close",() => {

        removeParticipant(
            conn.peer
        );

    });


    conn.on("error",error => {

        console.warn(error);

    });

}


/* =====================================================
   INCOMING CONNECTION
===================================================== */

peer.on("connection",conn => {

    setupConnection(conn);

});


/* =====================================================
   DATA
===================================================== */

function handleData(from,data){

    if(!data || !data.type)
        return;


    /* HELLO */

    if(data.type === "hello"){

        participants[from] = {
            ...(participants[from] || {}),
            name:data.name || "User",
            camera:!!data.camera,
            mic:!!data.mic,
            connected:true
        };

        renderBubbles();
        updateHostUsers();

        /*
           Host membalas status permission.
        */

        if(isHost){

            sendTo(
                connections[from],
                {
                    type:"permission",
                    permission:screenPermission,
                    owner:screenOwner
                }
            );

        }

        return;
    }


    /* NAME */

    if(data.type === "name"){

        if(participants[from]){

            participants[from].name =
                data.name;

        }

        renderBubbles();
        updateHostUsers();

        return;
    }


    /* CAMERA */

    if(data.type === "cameraState"){

        if(!participants[from])
            participants[from] = {};

        participants[from].camera =
            !!data.enabled;

        renderBubbles();
        updateHostUsers();

        return;
    }


    /* MIC */

    if(data.type === "micState"){

        if(!participants[from])
            participants[from] = {};

        participants[from].mic =
            !!data.enabled;

        renderBubbles();
        updateHostUsers();

        return;
    }


    /* CHAT */

    if(data.type === "chat"){

        addMessage(
            data.name,
            data.text
        );

        /*
           Forward supaya chat tersebar.
        */

        broadcast(
            data,
            from
        );

        return;
    }


    /* PERMISSION */

    if(data.type === "permission"){

        screenPermission =
            data.permission;

        screenOwner =
            data.owner || null;

        updateScreenUI();

        return;
    }


    /* SCREEN START */

    if(data.type === "screenStarted"){

        screenOwner =
            data.owner;

        updateScreenUI();

        return;
    }


    /* SCREEN STOP */

    if(data.type === "screenStopped"){

        if(screenOwner === data.owner){

            screenOwner = null;

            screenVideo.srcObject =
                null;

            noScreen.classList.remove(
                "hidden"
            );

            document.getElementById(
                "screenStatus"
            ).textContent =
                "Tidak ada screen share";

            updateScreenUI();
        }

        return;
    }


    /* HOST COMMAND */

    if(data.type === "hostCommand"){

        handleHostCommand(
            data.command
        );

        return;
    }


    /* KICK */

    if(data.type === "kick"){

        if(data.target === peer.id){

            kicked = true;

            if(localCameraStream){

                localCameraStream
                .getTracks()
                .forEach(t=>t.stop());

            }

            if(localScreenStream){

                localScreenStream
                .getTracks()
                .forEach(t=>t.stop());

            }

            alert(
                "Kamu telah dikeluarkan oleh host."
            );

            try{
                peer.destroy();
            }catch(e){}

            document.body.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#0b0d10;
                    color:white;
                    font-family:Arial;
                    text-align:center">
                    <div>
                        <div style="font-size:50px">🚫</div>
                        <h2>Kamu dikeluarkan dari room</h2>
                        <p style="color:#888">
                        Hubungi host jika ingin bergabung kembali.
                        </p>
                    </div>
                </div>
            `;

            return;
        }

        /*
           Peserta lain mendapat update.
        */

        removeParticipant(
            data.target
        );

        return;
    }

}


/* =====================================================
   SEND
===================================================== */

function sendTo(conn,data){

    try{

        if(conn && conn.open){

            conn.send(data);

        }

    }catch(e){

        console.warn(e);

    }
}


function broadcast(
    data,
    exclude=null
){

    Object.keys(connections)
    .forEach(id => {

        if(id === exclude)
            return;

        sendTo(
            connections[id],
            data
        );

    });

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    if(!isHost &&
       participants[peer.id]?.cameraLocked){

        alert(
            "Host sedang memblokir kamera kamu."
        );

        return;
    }


    if(cameraEnabled)
        return;


    try{

        /*
           Jika mic sedang aktif,
           ambil audio juga.
        */

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:cameraFacing,
                    width:{ideal:1280},
                    height:{ideal:720},
                    frameRate:{ideal:30}
                },

                audio:micEnabled

            });


        localCameraStream =
            stream;

        cameraEnabled = true;


        stream.getVideoTracks()
        .forEach(track => {

            track.contentHint =
                "motion";

        });


        stream.getAudioTracks()
        .forEach(track => {

            track.enabled =
                micEnabled;

        });


        updateSelf();

        broadcast({
            type:"cameraState",
            enabled:true
        });


        Object.keys(connections)
        .forEach(id => {

            startCameraCall(id);

        });

    }catch(error){

        console.error(error);

        alert(
            "Tidak bisa mengakses kamera. Pastikan izin kamera diberikan."
        );

    }

}


function stopCamera(){

    if(!localCameraStream)
        return;


    /*
       Jangan matikan audio kalau mic masih
       ingin digunakan.
    */

    localCameraStream
    .getVideoTracks()
    .forEach(track => {

        track.stop();

    });


    localCameraStream =
        null;

    cameraEnabled = false;


    updateSelf();

    broadcast({
        type:"cameraState",
        enabled:false
    });

}


/* =====================================================
   CAMERA CALL
===================================================== */

function startCameraCall(id){

    if(!localCameraStream)
        return;

    if(!connections[id])
        return;


    if(cameraCalls[id]){

        try{
            cameraCalls[id].close();
        }catch(e){}

    }


    try{

        const call =
            peer.call(
                id,
                localCameraStream,
                {
                    metadata:{
                        kind:"camera",
                        name:myName
                    }
                }
            );


        cameraCalls[id] =
            call;


        call.on("stream",stream => {

            attachRemoteCamera(
                id,
                stream
            );

        });


        call.on("error",e => {

            console.warn(
                "Camera:",
                e
            );

        });

    }catch(e){

        console.warn(e);

    }

}


/* =====================================================
   INCOMING CALL
===================================================== */

peer.on("call",call => {

    const kind =
        call.metadata?.kind;


    /* CAMERA */

    if(kind === "camera"){

        call.answer(
            localCameraStream || undefined
        );


        cameraCalls[call.peer] =
            call;


        call.on("stream",stream => {

            attachRemoteCamera(
                call.peer,
                stream
            );

        });

        return;
    }


    /* SCREEN */

    if(kind === "screen"){

        /*
           Hanya terima screen dari
           permission holder.
        */

        if(
            screenPermission &&
            call.peer !== screenPermission &&
            !isHost
        ){

            call.close();
            return;

        }


        call.answer();


        screenCalls[call.peer] =
            call;


        call.on("stream",stream => {

            screenOwner =
                call.peer;

            screenVideo.srcObject =
                stream;

            noScreen.classList.add(
                "hidden"
            );


            const name =
                participants[call.peer]?.name ||
                "Peserta";


            document.getElementById(
                "screenStatus"
            ).textContent =
                "🖥️ " +
                name +
                " sedang share screen";


            updateScreenUI();

        });


        call.on("close",() => {

            if(screenOwner === call.peer){

                screenOwner = null;

                screenVideo.srcObject =
                    null;

                noScreen.classList.remove(
                    "hidden"
                );

                document.getElementById(
                    "screenStatus"
                ).textContent =
                    "Tidak ada screen share";

            }

        });

    }

});

/* =====================================================
   DRAG BUBBLE
===================================================== */

function enableBubbleDrag(bubble){

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startLeft = 0;
    let startTop = 0;


    bubble.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.classList.contains(
                    "bubble-size"
                )
            ){
                return;
            }


            dragging = true;

            bubble.setPointerCapture(
                e.pointerId
            );


            const rect =
                bubble.getBoundingClientRect();

            const stageRect =
                stage.getBoundingClientRect();


            startX = e.clientX;
            startY = e.clientY;

            startLeft =
                rect.left -
                stageRect.left;

            startTop =
                rect.top -
                stageRect.top;


            bubble.style.bottom =
                "auto";

        }
    );


    bubble.addEventListener(
        "pointermove",
        e => {

            if(!dragging)
                return;


            const stageRect =
                stage.getBoundingClientRect();

            const width =
                bubble.offsetWidth;

            const height =
                bubble.offsetHeight;


            let left =
                startLeft +
                (e.clientX-startX);

            let top =
                startTop +
                (e.clientY-startY);


            /*
               Batas stage
            */

            left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        stageRect.width-width
                    )
                );


            top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        stageRect.height-height
                    )
                );


            bubble.style.left =
                left + "px";

            bubble.style.top =
                top + "px";

        }
    );


    bubble.addEventListener(
        "pointerup",
        () => {

            dragging = false;

        }
    );

}


/* =====================================================
   RESIZE BUBBLE
===================================================== */

function enableBubbleResize(bubble){

    const handle =
        bubble.querySelector(
            ".bubble-size"
        );

    let resizing = false;

    let startX;
    let startY;

    let startW;
    let startH;


    handle.addEventListener(
        "pointerdown",
        e => {

            e.stopPropagation();

            resizing = true;

            handle.setPointerCapture(
                e.pointerId
            );


            startX =
                e.clientX;

            startY =
                e.clientY;

            startW =
                bubble.offsetWidth;

            startH =
                bubble.offsetHeight;

        }
    );


    handle.addEventListener(
        "pointermove",
        e => {

            if(!resizing)
                return;


            const diff =
                e.clientX-startX;


            let width =
                startW + diff;


            /*
               Aspect ratio kira-kira 16:9
            */

            let height =
                width * .72;


            width =
                Math.max(
                    80,
                    Math.min(
                        width,
                        400
                    )
                );


            height =
                Math.max(
                    60,
                    Math.min(
                        height,
                        300
                    )
                );


            bubble.style.width =
                width + "px";

            bubble.style.height =
                height + "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        () => {

            resizing = false;

        }
    );

}


/* =====================================================
   MIC
===================================================== */

async function toggleMic(){

    if(!isHost &&
       participants[peer.id]?.micLocked){

        alert(
            "Host sedang memblokir microphone kamu."
        );

        return;

    }


    /*
       Jika belum ada stream,
       ambil audio saja.
    */

    if(!localCameraStream){

        try{

            localCameraStream =
                await navigator.mediaDevices
                .getUserMedia({
                    video:false,
                    audio:true
                });

            micEnabled = true;

            updateSelf();

            broadcast({
                type:"micState",
                enabled:true
            });

            /*
               Kirim audio melalui camera call.
            */

            Object.keys(connections)
            .forEach(id => {

                startCameraCall(id);

            });

            return;

        }catch(e){

            alert(
                "Tidak bisa mengakses microphone."
            );

            return;
        }

    }


    const tracks =
        localCameraStream
        .getAudioTracks();


    if(!tracks.length){

        /*
           Tambahkan audio track jika
           stream awal hanya video.
        */

        try{

            const audioStream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


            const track =
                audioStream.getAudioTracks()[0];


            localCameraStream.addTrack(
                track
            );


            micEnabled = true;


            updateSelf();

            broadcast({
                type:"micState",
                enabled:true
            });


            Object.keys(connections)
            .forEach(id => {

                startCameraCall(id);

            });


            return;

        }catch(e){

            alert(
                "Microphone tidak tersedia."
            );

            return;
        }

    }


    micEnabled =
        !micEnabled;


    tracks.forEach(track => {

        track.enabled =
            micEnabled;

    });


    updateSelf();

    broadcast({
        type:"micState",
        enabled:micEnabled
    });

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(!cameraEnabled ||
       !localCameraStream){

        return;

    }


    cameraFacing =
        cameraFacing === "user"
        ? "environment"
        : "user";


    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:cameraFacing,
                    width:{ideal:1280},
                    height:{ideal:720}
                },

                audio:false

            });


        const newTrack =
            stream.getVideoTracks()[0];

        const oldTrack =
            localCameraStream
            .getVideoTracks()[0];


        if(oldTrack){

            oldTrack.stop();

            localCameraStream.removeTrack(
                oldTrack
            );

        }


        localCameraStream.addTrack(
            newTrack
        );


        newTrack.contentHint =
            "motion";


        Object.keys(connections)
        .forEach(id => {

            startCameraCall(id);

        });


        renderBubbles();


    }catch(e){

        alert(
            "Kamera depan/belakang tidak tersedia."
        );

    }

}


/* =====================================================
   SCREEN SHARE
===================================================== */

async function startScreenShare(){

    /*
       Cek permission.
    */

    if(!isHost &&
       screenPermission !== peer.id){

        alert(
            "Host belum memberikan izin screen share."
        );

        return;

    }


    /*
       Satu screen share saja.
    */

    if(
        screenOwner &&
        screenOwner !== peer.id
    ){

        alert(
            "Saat ini peserta lain sedang share screen."
        );

        return;

    }


    if(localScreenStream)
        return;


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        alert(
            "Perangkat/browser ini tidak mendukung screen sharing.\n\n" +
            "Coba Chrome atau Edge di laptop/PC."
        );

        return;

    }


    try{

        /*
           Meminta kualitas tinggi.
           Browser dapat mengabaikan sebagian
           constraint jika perangkat tidak mampu.
        */

        const stream =
            await navigator.mediaDevices
            .getDisplayMedia({

                video:{
                    frameRate:{
                        ideal:60,
                        max:60
                    },

                    width:{
                        ideal:1920,
                        max:1920
                    },

                    height:{
                        ideal:1080,
                        max:1080
                    }
                },

                audio:{
                    echoCancellation:false,
                    noiseSuppression:false,
                    autoGainControl:false
                }
            });


        localScreenStream =
            stream;


        const videoTrack =
            stream.getVideoTracks()[0];


        /*
           Sangat penting untuk konten bergerak
           seperti video/game/transisi cepat.
        */

        try{

            videoTrack.contentHint =
                "motion";

        }catch(e){}


        /*
           Coba set 60 FPS.
        */

        try{

            await videoTrack.applyConstraints({
                frameRate:{
                    ideal:60,
                    max:60
                }
            });

        }catch(e){}


        screenOwner =
            peer.id;


        screenVideo.srcObject =
            stream;

        noScreen.classList.add(
            "hidden"
        );


        document.getElementById(
            "screenStatus"
        ).textContent =
            "🖥️ Kamu sedang share screen";


        shareBtn.style.display =
            "none";

        stopShareBtn.style.display =
            "inline-block";


        /*
           Kirim ke semua peserta.
        */

        Object.keys(connections)
        .forEach(id => {

            startScreenCall(id);

        });


        broadcast({
            type:"screenStarted",
            owner:peer.id
        });


        /*
           Deteksi user menekan
           "Stop sharing" dari browser.
        */

        videoTrack.onended =
            () => {

                stopScreenShare();

            };


    }catch(e){

        console.error(e);

        alert(
            "Screen share dibatalkan atau browser tidak mendukung fitur ini."
        );

    }

}


/* =====================================================
   SCREEN CALL
===================================================== */

function startScreenCall(id){

    if(!localScreenStream)
        return;

    if(!connections[id])
        return;


    if(screenCalls[id]){

        try{
            screenCalls[id].close();
        }catch(e){}

    }


    try{

        const call =
            peer.call(
                id,
                localScreenStream,
                {
                    metadata:{
                        kind:"screen",
                        name:myName
                    }
                }
            );


        screenCalls[id] =
            call;


        /*
           PeerJS menggunakan RTCPeerConnection
           di balik call.

           Kita coba menaikkan bitrate dan FPS.
        */

        setTimeout(
            () => optimizeCall(call),
            1000
        );


    }catch(e){

        console.warn(e);

    }

}


/* =====================================================
   OPTIMIZE WEBRTC CALL
===================================================== */

async function optimizeCall(call){

    try{

        const pc =
            call.peerConnection ||
            call._pc;


        if(!pc)
            return;


        const senders =
            pc.getSenders();


        for(const sender of senders){

            if(
                sender.track &&
                sender.track.kind === "video"
            ){

                const params =
                    sender.getParameters();


                if(!params.encodings)
                    params.encodings = [{}];


                /*
                   Bitrate 8 Mbps.
                   Browser bisa menurunkannya sendiri
                   jika koneksi tidak mampu.
                */

                params.encodings[0].maxBitrate =
                    8000000;


                params.encodings[0].maxFramerate =
                    60;


                try{

                    await sender.setParameters(
                        params
                    );

                }catch(e){

                    console.warn(
                        "setParameters:",
                        e
                    );

                }

            }

        }

    }catch(e){

        console.warn(
            "WebRTC optimization:",
            e
        );

    }

}


/* =====================================================
   STOP SCREEN
===================================================== */

function stopScreenShare(){

    if(!localScreenStream)
        return;


    localScreenStream
    .getTracks()
    .forEach(track => {

        track.stop();

    });


    localScreenStream =
        null;

    screenOwner =
        null;


    screenVideo.srcObject =
        null;

    noScreen.classList.remove(
        "hidden"
    );


    document.getElementById(
        "screenStatus"
    ).textContent =
        "Tidak ada screen share";


    shareBtn.style.display =
        "inline-block";

    stopShareBtn.style.display =
        "none";


    Object.keys(screenCalls)
    .forEach(id => {

        try{

            screenCalls[id].close();

        }catch(e){}

    });


    broadcast({
        type:"screenStopped",
        owner:peer.id
    });


    updateScreenUI();

}

   SCREEN UI

function updateScreenUI(){

    if(isHost){

    }else{

            );

    }else{

    }

}


/* =====================================================
   HOST COMMAND
===================================================== */

function sendHostCommand(
    id,
    command
){

    if(!connections[id])
        return;


    sendTo(
        connections[id],
        {
            type:"hostCommand",
            command:command
        }
    );

}


function handleHostCommand(command){

    /*
       MIC OFF
    */

    if(command === "micOff"){

        if(localCameraStream){

            localCameraStream
            .getAudioTracks()
            .forEach(track => {

                track.enabled =
                    false;

            });

        }

        micEnabled = false;

        if(participants[peer.id]){

            participants[peer.id].micLocked =
                true;

        }

        updateSelf();

        broadcast({
            type:"micState",
            enabled:false
        });

        return;
    }


    /*
       MIC UNLOCK
    */

    if(command === "micUnlock"){

        if(participants[peer.id]){

            participants[peer.id].micLocked =
                false;

        }

        return;
    }


    /*
       CAMERA OFF
    */

    if(command === "cameraOff"){

        if(localCameraStream){

            localCameraStream
            .getVideoTracks()
            .forEach(track => {

                track.enabled =
                    false;

            });

        }

        cameraEnabled = false;

        if(participants[peer.id]){

            participants[peer.id].cameraLocked =
                true;

        }

        updateSelf();

        broadcast({
            type:"cameraState",
            enabled:false
        });

        return;
    }


    /*
       CAMERA UNLOCK
    */

    if(command === "cameraUnlock"){

        if(participants[peer.id]){

            participants[peer.id].cameraLocked =
                false;

        }

        return;
    }

}

    if(
        !isHost &&
        participants[peer.id]?.cameraLocked
    ){

        alert(
            "Host sedang memblokir kamera kamu."
        );

        return;

    }


    if(cameraEnabled){

        stopCamera();

    }else{

        await startCamera();

    }

};


/* =====================================================
   MIC BUTTON
===================================================== */

micBtn.onclick =
async () => {

    await toggleMic();

};


/* =====================================================
   CAMERA SWITCH
===================================================== */

switchCameraBtn.onclick =
switchCamera;


/* =====================================================
   SCREEN BUTTONS
===================================================== */

shareBtn.onclick =
startScreenShare;

stopShareBtn.onclick =
stopScreenShare;


/* =====================================================
   FULLSCREEN
===================================================== */

document
.getElementById("fullscreenBtn")
.onclick =
async () => {

    try{

        if(!document.fullscreenElement){

            if(stage.requestFullscreen){

                await stage.requestFullscreen();

            }else{

                stage.classList.add(
                    "fullscreen"
                );

            }

        }else{

            await document.exitFullscreen();

        }

    }catch(e){

        stage.classList.toggle(
            "fullscreen"
        );

    }

};


document.addEventListener(
    "fullscreenchange",
    () => {

        if(document.fullscreenElement){

            stage.classList.add(
                "fullscreen"
            );

        }else{

            stage.classList.remove(
                "fullscreen"
            );

        }

    }
);


/* =====================================================
   COPY ROOM
===================================================== */

document
.getElementById("copyRoomBtn")
.onclick =
async () => {

    try{

        await navigator.clipboard.writeText(
            location.href
        );

        alert(
            "Link room berhasil disalin."
        );

    }catch(e){

        roomUrl.select();

        document.execCommand(
            "copy"
        );

        alert(
            "Link room berhasil disalin."
        );

    }

};


/* =====================================================
   LEAVE
===================================================== */

document
.getElementById("leaveBtn")
.onclick =
() => {

    if(
        !confirm(
            "Keluar dari room?"
        )
    )
        return;


    if(localCameraStream){

        localCameraStream
        .getTracks()
        .forEach(t=>t.stop());

    }


    if(localScreenStream){

        localScreenStream
        .getTracks()
        .forEach(t=>t.stop());

    }


    try{
        peer.destroy();
    }catch(e){}


    location.href =
        location.pathname;

};


/* =====================================================
   REMOVE PARTICIPANT
===================================================== */

function removeParticipant(id){

    delete participants[id];


    if(cameraCalls[id]){

        try{
            cameraCalls[id].close();
        }catch(e){}

        delete cameraCalls[id];

    }


    if(screenCalls[id]){

        try{
            screenCalls[id].close();
        }catch(e){}

        delete screenCalls[id];

    }


    if(connections[id]){

        try{
            connections[id].close();
        }catch(e){}

        delete connections[id];

    }


    const bubble =
        document.getElementById(
            "bubble-" + id
        );


    if(bubble)
        bubble.remove();


    /*
       Jika peserta yang share screen
       keluar.
    */

    if(
        isHost &&
        screenOwner === id
    ){

        screenOwner =
            null;

        screenPermission =
            peer.id;


        broadcast({
            type:"screenStopped",
            owner:id
        });


        broadcast({
            type:"permission",
            permission:peer.id,
            owner:null
        });

    }


    renderBubbles();
    updateHostUsers();
    updateScreenUI();

}


/* =====================================================
   BEFORE UNLOAD
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if(localCameraStream){

            localCameraStream
            .getTracks()
            .forEach(t=>t.stop());

        }


        if(localScreenStream){

            localScreenStream
            .getTracks()
            .forEach(t=>t.stop());

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

updateScreenUI();
updateSelf();

</script>
