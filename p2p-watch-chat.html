<!DOCTYPE html>
<html lang="id">

<title>Watch Party P2P</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#fff;font:14px Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:9px 11px;background:#27313c;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}a
input,select{background:#1b2027;color:#fff;border:1px solid #343b44;border-radius:7px;padding:9px;min-width:0}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;background:#15191f;border-bottom:1px solid #303640}
header strong{font-size:16px}
#status{font-size:12px;color:#aeb8c4}
main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;min-height:0;position:relative;background:#050607;overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050607}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#9aa4b1;pointer-events:none;padding:20px}

.bubble{position:absolute;width:160px;height:110px;min-width:90px;min-height:65px;background:#15191f;border:1px solid #647080;border-radius:10px;overflow:hidden;box-shadow:0 5px 20px #0008;pointer-events:auto;touch-action:none}
.bubble video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.bubble label{position:absolute;left:5px;bottom:5px;background:#000a;padding:4px;border-radius:4px;font-size:11px;pointer-events:none}
.resize{position:absolute;right:1px;bottom:1px;z-index:5;width:32px;height:32px;cursor:nwse-resize;touch-action:none;pointer-events:auto;opacity:.42;background:linear-gradient(135deg,transparent 49%,#ffffff 50%,#ffffff 53%,transparent 56%);transition:opacity .15s ease}
.bubble:active .resize,.resize:active{opacity:.85}
#controls{transition:opacity .3s ease,transform .3s ease}
#controls.fullscreen-controls-hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
#chatToggle{position:absolute;z-index:12;right:12px;top:12px;background:#202833dd;border:1px solid #ffffff35;border-radius:999px;padding:10px 13px;box-shadow:0 3px 14px #0008}
#chat.chat-fullscreen-panel{position:absolute;z-index:11;right:12px;top:62px;bottom:12px;width:min(340px,32%);height:auto;min-height:0;background:#111923ed;border:1px solid #ffffff2b;border-radius:12px;box-shadow:0 8px 28px #0009;padding:10px;backdrop-filter:blur(10px)}
#chat.chat-fullscreen-panel .heading{display:flex;align-items:center;justify-content:space-between}
#chat.chat-fullscreen-panel #messages{overscroll-behavior:contain}
#chat.chat-fullscreen-panel #chatInput{min-width:0}
#chat.chat-fullscreen-panel #chatForm{padding-bottom:env(safe-area-inset-bottom)}
#chat.chat-fullscreen-panel.chat-hidden{display:none!important}
@media (orientation:portrait) {
  #chat.chat-fullscreen-panel{left:10px;right:10px;top:auto;bottom:12px;width:auto;height:min(44%,360px)}
}
@media (max-width:700px) {
  #chat.chat-fullscreen-panel{width:min(34%,340px)}
}

#controls{position:absolute;z-index:5;bottom:10px;left:8px;right:8px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
#controls button,#controls select{box-shadow:0 2px 8px #0008}
.blue{background:#1769e0}
.red{background:#9c3030}
#sound{display:none;position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);background:#1769e0}
aside{width:300px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;background:#111419;border-left:1px solid #303640}
.section{padding:11px;border-bottom:1px solid #303640}
.heading{font-size:11px;color:#9ca7b4;text-transform:uppercase;font-weight:bold;margin-bottom:8px}
.roomrow{display:flex;gap:5px}
#roomCode{flex:1;text-align:center;font-weight:bold;letter-spacing:1px}
#chat{flex:1;min-height:80px;display:flex;flex-direction:column;padding:11px}
#messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:7px}
.msg{background:#202630;border-radius:7px;padding:8px;font-size:12px;overflow-wrap:anywhere}
.msg.mine{background:#173b69}
.msg b{display:block;color:#8eb9ff;margin-bottom:3px;font-size:11px}
#chatForm{display:flex;gap:5px;margin-top:8px}
#chatInput{flex:1;width:50px}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;font-size:12px}
#hostPanel{display:none}
#hostPanel.show{display:block}
#hostPanel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#hostPanel button{font-size:11px;padding:8px}
#participant{font-size:12px;color:#aeb8c4}
#toast{position:fixed;z-index:99;bottom:20px;left:50%;transform:translateX(-50%);background:#303944;padding:10px 15px;border-radius:8px;display:none;max-width:90%;text-align:center}
@media(max-width:700px){
 main{flex-direction:column}
 #stage{flex:1;min-height:40vh}
 aside{width:100%;height:45vh;border-left:0;border-top:1px solid #303640}
 .bubble{width:125px;height:85px}
 header{padding:0 7px}
 #status{font-size:10px}
}
</style>

<body>
<div id="app">
<header>
  <strong>🎬 Watch Party</strong>
  <span id="status">Menghubungkan...</span>
  <button id="copyHostLink" style="display:none">Salin Link Host</button><button id="copyLink">Salin Link Peserta</button>
</header>

<main>
<section id="stage">
  <video id="screen" autoplay playsinline></video>
  <div id="empty"><div><div style="font-size:42px">📺</div><h2>Belum ada screen share</h2><p>Mulai berbagi layar untuk menonton bersama.</p></div></div>
  <div id="bubbles"></div>
  <button id="chatToggle" type="button" aria-label="Tampilkan chat" style="display:none">💬 Chat</button>
  <div id="controls">
    <label id="qualityWrap" style="font-size:12px">Kualitas
      <select id="quality">
        <option value="auto">Auto</option>
        <option value="720p">720p 30 FPS</option>
        <option value="1080p">1080p 30 FPS</option>
        <option value="1080p60">1080p 60 FPS</option>
      </select>
    </label>
    <button id="share" class="blue">🖥 Share Screen</button>
    <button id="stop" class="red" style="display:none">⏹ Stop Share</button>
    <button id="full">⛶ Fullscreen</button>
  </div>
  <button id="sound">🔊 Aktifkan Suara</button>
</section>

<aside>
  <div class="section">
    <div class="heading">Room</div>
    <div class="roomrow">
      <input id="roomCode" readonly>
      <button id="copyCode">Salin Kode</button>
    </div>
  </div>

  <section id="chat">
    <div class="heading"><span>Chat</span><button id="chatClose" type="button" aria-label="Sembunyikan chat" style="display:none;padding:3px 8px">✕</button></div>
    <div id="messages"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="Tulis pesan..." maxlength="1000" autocomplete="off">
      <button class="blue" type="submit">➤</button>
    </form>
  </section>

  <div class="section">
    <div class="heading">Identitas</div>
    <div id="myName">Guest</div>
    <div class="row">
      <button id="rename">✏ Ganti Nama</button>
      <button id="mic">🎤 Mic ON</button>
      <button id="camera">📷 Kamera ON</button>
    </div>
  </div>

  <div class="section" id="hostPanel">
    <div class="heading">Kontrol Host</div>
    <div id="participant">Menunggu peserta...</div>
    <div class="grid" style="margin-top:8px">
      <button id="muteGuest" class="red">Matikan Mic</button>
      <button id="lockMic">Kunci Mic</button>
      <button id="camGuest" class="red">Matikan Kamera</button>
      <button id="lockCam">Kunci Kamera</button>
      <button id="grant" class="blue">Izinkan Screen</button>
      <button id="revoke">Cabut Izin Screen</button>
      <button id="kick" class="red" style="grid-column:1/3">Keluarkan Peserta</button>
    </div>
  </div>
</aside>
</main>
</div>
<div id="toast"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

let room = params.get("room");
let isHost = params.get("host") === "1";
const HOST_ROOM_KEY = "wp_host_room_v3";

function randomRoom(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
}

if(!room){
  room = localStorage.getItem(HOST_ROOM_KEY) || randomRoom();
  isHost = true;
}
room = room.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,24);
if(!room) room = randomRoom();
if(isHost){
  localStorage.setItem(HOST_ROOM_KEY,room);
  history.replaceState({}, "", "?room="+encodeURIComponent(room)+"&host=1");
}

const hostId = "wp-"+room.toLowerCase();

$("roomCode").value = room;
$("myName").textContent =
  localStorage.getItem("wp_name") || (isHost ? "Host" : "Guest");

let name = $("myName").textContent;
let peer = null;
let conn = null;
let guestId = null;
let localMedia = null;
let screenStream = null;
let screenCall = null;
let mediaCall = null;
let remoteScreenCall = null;
let permission = isHost;
let micLocked = false;
let camLocked = false;
let micOn = false;
let camOn = false;
let remoteName = "Peserta";
let reconnectTimer = null;
let toastTimer = null;
const bubbles = new Map();

function toast(text){
  $("toast").textContent = text;
  $("toast").style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$("toast").style.display="none",2800);
}
function status(text){ $("status").textContent = text; }
function safeText(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function send(data){
  if(conn && conn.open){
    try{ conn.send(data); return true; }catch(e){}
  }
  return false;
}
function addMessage(who,text,mine=false){
  const div = document.createElement("div");
  div.className = "msg"+(mine?" mine":"");
  div.innerHTML = "<b>"+safeText(who)+"</b><div>"+safeText(text)+"</div>";
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function sendHello(){
  send({type:"hello",name,id:peer.id,mic:micOn,camera:camOn});
}
function setMediaButtons(){
  $("mic").textContent = micOn ? "🎤 Mic ON" : "🔇 Mic OFF";
  $("camera").textContent = camOn ? "📷 Kamera ON" : "📷 Kamera OFF";
  $("mic").disabled = micLocked;
  $("camera").disabled = camLocked;
}
function updatePermissionUI(){
  $("share").disabled = !isHost && permission !== true;
  $("share").title = $("share").disabled ? "Tunggu izin Host" : "";
}
function updateHostUI(){
  $("hostPanel").classList.toggle("show",isHost);
  $("participant").textContent = guestId ? remoteName+" terhubung" : "Menunggu peserta...";
}
function getQuality(){
  const q = $("quality").value;
  if(q==="720p") return {w:1280,h:720,fps:30,bitrate:5000000};
  if(q==="1080p") return {w:1920,h:1080,fps:30,bitrate:9000000};
  if(q==="1080p60") return {w:1920,h:1080,fps:60,bitrate:12000000};
  return {w:1920,h:1080,fps:60,bitrate:14000000};
}

/* Each browser must have its own Peer ID.
   Only the Host uses the stable room-based ID. */
function createPeer(){
  status(isHost ? "Membuka room..." : "Mencari Host...");
  peer = isHost ? new Peer(hostId,{debug:1}) : new Peer({debug:1});

  peer.on("open",()=>{
    status(isHost ? "Room siap" : "Mencari Host...");
    if(isHost){
      $("hostPanel").classList.add("show");
      $("copyHostLink").style.display="inline-block";
      updateHostUI();
    }else{
      connectHost();
    }
    ensureMedia().then(()=>{
      if(conn && conn.open) sendHello();
    });
  });

  peer.on("connection",incoming=>{
    if(!isHost) return;
    if(guestId && incoming.peer!==guestId){
      incoming.on("open",()=>{
        incoming.send({type:"kick",reason:"Room ini hanya untuk satu peserta."});
        setTimeout(()=>incoming.close(),300);
      });
      return;
    }
    conn = incoming;
    guestId = incoming.peer;
    setupDataConnection(incoming);
  });

  peer.on("call",call=>{
    if(call.metadata && call.metadata.kind==="screen"){
      receiveScreenCall(call);
    }else{
      receiveMediaCall(call);
    }
  });

  peer.on("disconnected",()=>{
    status("Menyambungkan kembali...");
    if(!isHost) scheduleReconnect();
    else{
      try{peer.reconnect();}catch(e){}
    }
  });

  peer.on("error",err=>{
    console.error("PeerJS error:",err.type,err);
    if(err.type==="unavailable-id" && isHost){
      status("ID room masih aktif, mencoba lagi...");
      setTimeout(()=>{
        if(peer && !peer.destroyed){
          try{peer.destroy();}catch(e){}
        }
        createPeer();
      },2500);
    }else if(err.type==="peer-unavailable" && !isHost){
      status("Host belum tersedia...");
      scheduleReconnect();
    }else{
      status("Koneksi bermasalah");
    }
  });
}

function connectHost(){
  if(isHost || !peer || peer.destroyed) return;
  if(conn && conn.open) return;
  status("Menghubungkan ke Host...");
  try{
    const c = peer.connect(hostId,{reliable:true});
    conn = c;
    setupDataConnection(c);
  }catch(e){
    console.error(e);
    scheduleReconnect();
  }
}
function scheduleReconnect(){
  if(isHost) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(()=>{
    if(!conn || !conn.open) connectHost();
  },2200);
}

function setupDataConnection(c){
  c.on("open",()=>{
    status(isHost ? "Peserta terhubung" : "Terhubung ke Host");
    if(isHost) guestId = c.peer;
    sendHello();
    updateHostUI();
    maybeStartMediaCall();
    if(isHost && screenStream) sendScreen();
  });
  c.on("data",data=>handleData(data));
  c.on("close",()=>{
    if(conn===c) conn=null;
    if(isHost){
      guestId=null;
      remoteName="Peserta";
      if(mediaCall){try{mediaCall.close()}catch(e){} mediaCall=null;}
      if(screenCall){try{screenCall.close()}catch(e){} screenCall=null;}
      updateHostUI();
      status("Menunggu peserta...");
    }else{
      status("Host terputus; mencoba kembali...");
      scheduleReconnect();
    }
  });
  c.on("error",e=>console.error("Data connection:",e));
}

function handleData(d){
  if(!d || !d.type) return;
  switch(d.type){
    case "hello":
      remoteName=d.name||"Peserta";
      if(isHost) guestId=d.id;
      updateHostUI();
      maybeStartMediaCall();
      if(isHost && screenStream) sendScreen();
      break;
    case "chat":
      addMessage(d.name||"Peserta",d.text||"",false);
      if(isFullscreenStage()){
        chatUnread++;
        showChatPanel();
        $("chatToggle").textContent="💬 Chat";
      }
      break;
    case "name":
      remoteName=d.name||"Peserta";
      updateHostUI();
      break;
    case "permission":
      permission=!!d.allowed;
      updatePermissionUI();
      if(!permission && screenStream && !isHost) stopScreen(false);
      break;
    case "command":
      if(d.kind==="mic"){
        const t=localMedia?.getAudioTracks()[0];
        if(t) t.enabled=!!d.enabled;
        micOn=!!d.enabled;
        micLocked=!!d.locked;
        setMediaButtons();
        sendHello();
      }
      if(d.kind==="camera"){
        const t=localMedia?.getVideoTracks()[0];
        if(t) t.enabled=!!d.enabled;
        camOn=!!d.enabled;
        camLocked=!!d.locked;
        setMediaButtons();
        sendHello();
      }
      if(d.kind==="revoke-screen"){
        permission=false;
        if(screenStream) stopScreen(false);
        updatePermissionUI();
      }
      break;
    case "kick":
      toast(d.reason||"Anda dikeluarkan dari room.");
      setTimeout(()=>location.href=location.pathname,1200);
      break;
    case "screen-start":
      break;
    case "screen-stop":
      clearRemoteScreen();
      break;
  }
}

/* Webcam + microphone: one bidirectional WebRTC call.
   Host initiates it to avoid simultaneous duplicate calls. */
async function ensureMedia(){
  if(localMedia) return;
  if(!navigator.mediaDevices?.getUserMedia){
    toast("Kamera/mikrofon memerlukan HTTPS dan browser yang mendukung.");
    return;
  }
  try{
    localMedia = await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
  }catch(e){
    console.warn("Camera and mic unavailable:",e);
    try{
      localMedia = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e2){
      toast("Izin kamera/mikrofon belum diberikan.");
      return;
    }
  }
  camOn = localMedia.getVideoTracks().some(t=>t.enabled);
  micOn = localMedia.getAudioTracks().some(t=>t.enabled);
  createBubble("local",name,localMedia,true);
  setMediaButtons();
  sendHello();
  maybeStartMediaCall();
}
function maybeStartMediaCall(){
  if(!isHost || !guestId || !conn?.open || !localMedia || mediaCall) return;
  try{
    const c=peer.call(guestId,localMedia,{metadata:{kind:"media"}});
    if(!c) return;
    mediaCall=c;
    c.on("stream",stream=>createBubble("remote",remoteName,stream,false));
    c.on("close",()=>{if(mediaCall===c) mediaCall=null;});
    c.on("error",e=>{console.error("Media call:",e);if(mediaCall===c)mediaCall=null;});
  }catch(e){console.error(e);}
}
function receiveMediaCall(call){
  ensureMedia().then(()=>{
    call.answer(localMedia||undefined);
    call.on("stream",stream=>createBubble("remote",remoteName,stream,false));
    call.on("close",()=>{if(mediaCall===call)mediaCall=null;});
    mediaCall=call;
  });
}

function createBubble(key,label,stream,muted){
  let b=bubbles.get(key);
  if(!b){
    b=document.createElement("div");
    b.className="bubble";
    b.innerHTML='<video autoplay playsinline></video><label></label><div class="resize"></div>';
    $("bubbles").appendChild(b);
    bubbles.set(key,b);
    makeDraggable(b);
    makeResizable(b);
    arrangeBubbles();
  }
  b.querySelector("label").textContent=label;
  const v=b.querySelector("video");
  if(v.srcObject!==stream) v.srcObject=stream;
  v.muted=!!muted;
  v.play().catch(()=>{});
  return b;
}
function arrangeBubbles(){
  const list=[...bubbles.values()];
  const stage=$("stage");
  const w=stage.clientWidth;
  const h=stage.clientHeight;
  const bw=Math.min(160,Math.max(100,(w-30)/2));
  const bh=bw*.69;
  list.forEach((b,i)=>{
    if(b.dataset.moved==="1") return;
    b.style.width=bw+"px";
    b.style.height=bh+"px";
    b.style.left=(12+i*(bw+8))+"px";
    b.style.top=Math.max(12,h-bh-16)+"px";
  });
}
function makeDraggable(b){
  let active=false,dx=0,dy=0;
  b.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("resize")) return;
    active=true;
    const r=b.getBoundingClientRect();
    const p=$("bubbles").getBoundingClientRect();
    dx=e.clientX-r.left;dy=e.clientY-r.top;
    b.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  b.addEventListener("pointermove",e=>{
    if(!active)return;
    const p=$("bubbles").getBoundingClientRect();
    b.style.left=Math.max(0,Math.min($("stage").clientWidth-b.offsetWidth,e.clientX-p.left-dx))+"px";
    b.style.top=Math.max(0,Math.min($("stage").clientHeight-b.offsetHeight,e.clientY-p.top-dy))+"px";
    b.dataset.moved="1";
  });
  b.addEventListener("pointerup",()=>active=false);
  b.addEventListener("pointercancel",()=>active=false);
}
function makeResizable(b){
  const h=b.querySelector(".resize");
  let active=false,sx=0,sy=0,sw=0,sh=0,pointerId=null;
  h.style.touchAction="none";
  h.addEventListener("pointerdown",e=>{
    e.preventDefault(); e.stopPropagation();
    active=true; pointerId=e.pointerId;
    sx=e.clientX; sy=e.clientY;
    sw=b.getBoundingClientRect().width; sh=b.getBoundingClientRect().height;
    try{h.setPointerCapture(pointerId)}catch(_){}
    h.style.backgroundColor="#1769e0";
  });
  function move(e){
    if(!active || (pointerId!==null && e.pointerId!==pointerId))return;
    e.preventDefault();
    const stage=$("stage").getBoundingClientRect();
    const r=b.getBoundingClientRect();
    const maxW=Math.max(100,stage.right-r.left);
    const maxH=Math.max(70,stage.bottom-r.top);
    b.style.width=Math.max(90,Math.min(maxW,sw+e.clientX-sx))+"px";
    b.style.height=Math.max(65,Math.min(maxH,sh+e.clientY-sy))+"px";
    b.dataset.moved="1";
  }
  function end(e){
    if(pointerId!==null && e.pointerId!==pointerId)return;
    active=false; pointerId=null; h.style.backgroundColor="";
  }
  h.addEventListener("pointermove",move);
  h.addEventListener("pointerup",end);
  h.addEventListener("pointercancel",end);
  window.addEventListener("pointermove",move,{passive:false});
  window.addEventListener("pointerup",end);
  window.addEventListener("pointercancel",end);
}

$("mic").onclick=async()=>{
  if(micLocked)return;
  if(!localMedia){await ensureMedia();return;}
  const t=localMedia.getAudioTracks()[0];
  if(!t){toast("Mikrofon tidak tersedia.");return;}
  t.enabled=!t.enabled;micOn=t.enabled;setMediaButtons();sendHello();
};
$("camera").onclick=async()=>{
  if(camLocked)return;
  if(!localMedia){await ensureMedia();return;}
  const t=localMedia.getVideoTracks()[0];
  if(!t){toast("Kamera tidak tersedia.");return;}
  t.enabled=!t.enabled;camOn=t.enabled;setMediaButtons();sendHello();
};

/* Screen share uses its own call, separate from webcam call. */
$("share").onclick=startScreen;
async function startScreen(){
  if(!isHost && permission!==true){
    toast("Tunggu Host memberikan izin screen share.");
    return;
  }
  if(screenStream)return;
  const q=getQuality();
  try{
    screenStream=await navigator.mediaDevices.getDisplayMedia({
      video:{width:{ideal:q.w,max:q.w},height:{ideal:q.h,max:q.h},frameRate:{ideal:q.fps,max:q.fps}},
      audio:true,
      systemAudio:"include",
      selfBrowserSurface:"exclude",
      surfaceSwitching:"include"
    });
    const vt=screenStream.getVideoTracks()[0];
    if(vt){
      try{vt.contentHint=q.fps>=60 ? "motion" : "detail"}catch(e){}
      try{
        await vt.applyConstraints({
          width:{ideal:q.w,max:q.w},
          height:{ideal:q.h,max:q.h},
          frameRate:{ideal:q.fps,max:q.fps}
        });
      }catch(e){console.warn("Capture constraints could not be applied; using browser-selected capture size.",e);}
      vt.addEventListener("ended",()=>{if(screenStream)stopScreen(true)});
    }
    $("screen").srcObject=screenStream;
    $("screen").muted=true;
    $("screen").volume=0;
    $("empty").style.display="none";
    $("share").style.display="none";
    $("stop").style.display="inline-block";
    $("screen").play().catch(()=>{});
    send({type:"screen-start"});
    sendScreen();
    toast(screenStream.getAudioTracks().length?"Screen share dan audio dimulai.":"Screen share dimulai; audio tidak tersedia dari sumber yang dipilih.");
  }catch(e){
    console.error("getDisplayMedia:",e);
    screenStream=null;
    toast(e.name==="NotAllowedError"?"Screen share dibatalkan.":"Gagal memulai screen share.");
  }
}
function sendScreen(){
  if(!screenStream || !guestId || !conn?.open || !peer)return;
  if(screenCall){
    try{screenCall.close()}catch(e){}
    screenCall=null;
  }
  try{
    const c=peer.call(guestId,screenStream,{metadata:{kind:"screen"}});
    if(!c){toast("Koneksi screen share gagal dibuat.");return;}
    screenCall=c;
    c.on("error",e=>console.error("Screen call error:",e));
    c.on("close",()=>{if(screenCall===c)screenCall=null;});
    c.on("stream",()=>{});
    c.on("error",()=>{if(screenCall===c)screenCall=null;});
    setTimeout(()=>setVideoBitrate(c),250);
    setTimeout(()=>setVideoBitrate(c),900);
    setTimeout(()=>setVideoBitrate(c),1800);
  }catch(e){console.error("sendScreen:",e);}
}
async function setVideoBitrate(call,attempt=0){
  try{
    const sender=call?.peerConnection?.getSenders().find(s=>s.track?.kind==="video");
    if(!sender){
      if(attempt<12)setTimeout(()=>setVideoBitrate(call,attempt+1),350);
      return;
    }
    const q=getQuality(), p=sender.getParameters()||{};
    if(!p.encodings || !p.encodings.length)p.encodings=[{}];
    p.encodings[0].maxBitrate=q.bitrate;
    p.encodings[0].maxFramerate=q.fps;
    if("degradationPreference" in p)p.degradationPreference="maintain-framerate";
    await sender.setParameters(p);
    console.log("Screen share sender profile applied:",q);
  }catch(e){
    console.warn("Could not apply sender bitrate yet:",e);
    if(attempt<12)setTimeout(()=>setVideoBitrate(call,attempt+1),350);
  }
}
async function applyScreenQuality(){
  const q=getQuality();
  if(!screenStream){
    toast("Profil kualitas akan digunakan saat screen share dimulai.");
    return;
  }
  const track=screenStream.getVideoTracks()[0];
  if(track){
    try{
      await track.applyConstraints({
        width:{ideal:q.w,max:q.w},
        height:{ideal:q.h,max:q.h},
        frameRate:{ideal:q.fps,max:q.fps}
      });
    }catch(e){
      console.warn("Selected share source cannot change to requested profile:",e);
      toast("Browser/sumber layar membatasi resolusi; bitrate tetap disesuaikan.");
    }
  }
  if(screenCall)await setVideoBitrate(screenCall);
  toast("Profil kualitas diterapkan. Hasil bergantung pada sumber layar dan upload Host.");
}
function receiveScreenCall(call){
  if(remoteScreenCall){
    try{remoteScreenCall.close()}catch(e){}
  }
  remoteScreenCall=call;
  call.answer();
  call.on("stream",stream=>{
    if(remoteScreenCall!==call)return;
    const v=$("screen");
    v.srcObject=stream;
    v.muted=false;
    v.volume=1;
    $("empty").style.display="none";
    $("share").style.display="none";
    $("stop").style.display="none";
    v.play().then(()=>$("sound").style.display="none").catch(()=>$("sound").style.display="block");
    toast("Screen share Host diterima.");
  });
  call.on("close",()=>{
    if(remoteScreenCall===call){
      remoteScreenCall=null;
      clearRemoteScreen();
    }
  });
  call.on("error",e=>{
    console.error("Receive screen error:",e);
    if(remoteScreenCall===call)remoteScreenCall=null;
  });
}
$("sound").onclick=()=>{
  $("screen").muted=false;
  $("screen").volume=1;
  $("screen").play().then(()=>$("sound").style.display="none").catch(()=>toast("Klik video lalu coba aktifkan suara lagi."));
};
function stopScreen(notify=true){
  if(screenStream){
    screenStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});
  }
  screenStream=null;
  if(screenCall){try{screenCall.close()}catch(e){}screenCall=null;}
  $("screen").srcObject=null;
  $("empty").style.display="grid";
  $("share").style.display="inline-block";
  $("stop").style.display="none";
  $("sound").style.display="none";
  if(notify)send({type:"screen-stop"});
}
$("stop").onclick=()=>stopScreen(true);
function clearRemoteScreen(){
  if(screenStream)return;
  $("screen").srcObject=null;
  $("screen").muted=false;
  $("empty").style.display="grid";
  $("share").style.display="inline-block";
  $("stop").style.display="none";
  $("sound").style.display="none";
}
$("quality").onchange=()=>{ applyScreenQuality(); };
let fullscreenHideTimer = null;
let chatOriginalParent = null;
let chatOriginalNextSibling = null;
let chatUnread = 0;
let chatWasManuallyHidden = false;

function isFullscreenStage(){
  return document.fullscreenElement === $("stage");
}
function showFullscreenControlsTemporarily(){
  clearTimeout(fullscreenHideTimer);
  $("controls").classList.remove("fullscreen-controls-hidden");
  if(isFullscreenStage()){
    fullscreenHideTimer=setTimeout(()=>{
      // Keep controls available while typing in chat.
      if(document.activeElement !== $("chatInput")){
        $("controls").classList.add("fullscreen-controls-hidden");
      }
    },3000);
  }
}
function enterFullscreenChat(){
  if(!chatOriginalParent){
    chatOriginalParent=$("chat").parentNode;
    chatOriginalNextSibling=$("chat").nextSibling;
  }
  $("stage").appendChild($("chat"));
  $("chat").classList.add("chat-fullscreen-panel");
  $("chat").classList.remove("chat-hidden");
  $("chatToggle").style.display="inline-block";
  $("chatClose").style.display="inline-block";
  chatWasManuallyHidden=false;
}
function exitFullscreenChat(){
  if(chatOriginalParent){
    if(chatOriginalNextSibling && chatOriginalNextSibling.parentNode===chatOriginalParent){
      chatOriginalParent.insertBefore($("chat"),chatOriginalNextSibling);
    }else{
      chatOriginalParent.appendChild($("chat"));
    }
  }
  $("chat").classList.remove("chat-fullscreen-panel","chat-hidden");
  $("chatToggle").style.display="none";
  $("chatClose").style.display="none";
  chatOriginalParent=null;
  chatOriginalNextSibling=null;
}
function showChatPanel(){
  if(!isFullscreenStage())return;
  $("chat").classList.remove("chat-hidden");
  $("chatToggle").textContent=chatUnread ? "💬 Chat ("+chatUnread+")" : "💬 Chat";
  chatWasManuallyHidden=false;
  chatUnread=0;
}
function hideChatPanel(){
  $("chat").classList.add("chat-hidden");
  $("chatToggle").textContent=chatUnread ? "💬 Chat ("+chatUnread+")" : "💬 Chat";
  chatWasManuallyHidden=true;
}
function updateFullscreenQualityVisibility(){
  const inStageFullscreen=isFullscreenStage();
  $("qualityWrap").style.display=(!isHost && inStageFullscreen) ? "none" : "";
  if(inStageFullscreen){
    enterFullscreenChat();
    showFullscreenControlsTemporarily();
  }else{
    clearTimeout(fullscreenHideTimer);
    $("controls").classList.remove("fullscreen-controls-hidden");
    exitFullscreenChat();
  }
}
$("full").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await $("stage").requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){toast("Fullscreen tidak didukung pada kondisi ini.");}
};
$("chatToggle").onclick=()=>{
  if($("chat").classList.contains("chat-hidden"))showChatPanel();
  else hideChatPanel();
};
$("chatClose").onclick=hideChatPanel;

// On mouse movement or touch, show fullscreen controls briefly on desktop and mobile.
$("stage").addEventListener("pointermove",()=>{
  if(isFullscreenStage())showFullscreenControlsTemporarily();
},{passive:true});
$("stage").addEventListener("pointerdown",()=>{
  if(isFullscreenStage())showFullscreenControlsTemporarily();
},{passive:true});
$("chatInput").addEventListener("focus",()=>{
  if(isFullscreenStage()){
    clearTimeout(fullscreenHideTimer);
    $("controls").classList.remove("fullscreen-controls-hidden");
  }
});
$("chatInput").addEventListener("blur",()=>{
  if(isFullscreenStage())showFullscreenControlsTemporarily();
});
document.addEventListener("fullscreenchange",updateFullscreenQualityVisibility);
window.addEventListener("resize",updateFullscreenQualityVisibility);
updateFullscreenQualityVisibility();
window.addEventListener("resize",arrangeBubbles);

/* Chat */
$("chatForm").onsubmit=e=>{
  e.preventDefault();
  const text=$("chatInput").value.trim();
  if(!text)return;
  addMessage(name,text,true);
  send({type:"chat",name,text});
  $("chatInput").value="";
  if(isFullscreenStage())showChatPanel();
};

/* Name */
$("rename").onclick=()=>{
  const n=prompt("Nama Anda:",name);
  if(!n || !n.trim())return;
  name=n.trim().slice(0,24);
  localStorage.setItem("wp_name",name);
  $("myName").textContent=name;
  const local=bubbles.get("local");
  if(local)local.querySelector("label").textContent=name;
  send({type:"name",name});
  sendHello();
};

/* Host controls */
$("muteGuest").onclick=()=>send({type:"command",kind:"mic",enabled:false,locked:false});
$("lockMic").onclick=()=>{
  micLocked=!micLocked;
  send({type:"command",kind:"mic",enabled:false,locked:micLocked});
  $("lockMic").textContent=micLocked?"Buka Kunci Mic":"Kunci Mic";
};
$("camGuest").onclick=()=>send({type:"command",kind:"camera",enabled:false,locked:false});
$("lockCam").onclick=()=>{
  camLocked=!camLocked;
  send({type:"command",kind:"camera",enabled:false,locked:camLocked});
  $("lockCam").textContent=camLocked?"Buka Kunci Kamera":"Kunci Kamera";
};
$("grant").onclick=()=>{
  send({type:"permission",allowed:true});
  toast("Izin screen share diberikan.");
};
$("revoke").onclick=()=>{
  send({type:"permission",allowed:false});
  send({type:"command",kind:"revoke-screen"});
  toast("Izin screen share dicabut.");
};
$("kick").onclick=()=>{
  if(!guestId){toast("Belum ada peserta.");return;}
  send({type:"kick",reason:"Anda dikeluarkan oleh Host."});
  setTimeout(()=>{
    if(conn){try{conn.close()}catch(e){}}
    guestId=null;updateHostUI();
  },300);
};

/* Host link stays private to Host; copy the participant link. */
$("copyLink").onclick=async()=>{
  const link=location.origin+location.pathname+"?room="+encodeURIComponent(room);
  try{await navigator.clipboard.writeText(link);toast("Link peserta disalin.");}
  catch(e){prompt("Salin link peserta ini:",link);}
};
$("copyHostLink").onclick=async()=>{
  const link=location.origin+location.pathname+"?room="+encodeURIComponent(room)+"&host=1";
  try{await navigator.clipboard.writeText(link);toast("Link Host disalin. Gunakan link ini untuk membuka room sebagai Host.");}
  catch(e){prompt("Simpan link Host ini:",link);}
};
$("copyCode").onclick=async()=>{
  try{await navigator.clipboard.writeText(room);toast("Kode room disalin.");}
  catch(e){prompt("Kode room:",room);}
};

updatePermissionUI();
updateHostUI();
setMediaButtons();
createPeer();
