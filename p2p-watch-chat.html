<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Watch Party P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090b0f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 11px;
    background:#252a32;
    color:white;
    cursor:pointer;
    font-size:12px;
}

button:hover{
    background:#353c48;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

input{
    border:1px solid #353b45;
    background:#171a20;
    color:white;
    border-radius:8px;
    padding:9px;
    outline:none;
}

/* ==================================================
   APP
================================================== */

.app{
    width:100%;
    height:100%;
    display:flex;
}

/* ==================================================
   STAGE
================================================== */

.stage{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
    background:#000;
    overflow:hidden;
}

#screenVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.no-screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#858c96;
    text-align:center;
    pointer-events:none;
}

.no-screen.hidden{
    display:none;
}

/* ==================================================
   STAGE CONTROLS
================================================== */

.stage-controls{
    position:absolute;
    top:12px;
    left:12px;
    z-index:1000;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.stage-button{
    background:rgba(20,24,30,.86);
    backdrop-filter:blur(10px);
}

.screen-status{
    position:absolute;
    top:12px;
    right:12px;
    z-index:1000;
    padding:8px 10px;
    border-radius:8px;
    background:rgba(20,24,30,.86);
    color:#b8bec8;
    font-size:11px;
}

/* ==================================================
   CAMERA BUBBLES
================================================== */

.bubbles{
    position:absolute;
    inset:0;
    z-index:900;
    pointer-events:none;
}

.bubble{
    position:absolute;
    left:15px;
    top:15px;

    width:145px;
    height:105px;

    background:#11151a;

    border:2px solid #454d59;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 6px 25px rgba(0,0,0,.55);

    pointer-events:auto;

    touch-action:none;

    user-select:none;
}

.bubble video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.bubble-name{
    position:absolute;
    left:5px;
    bottom:5px;

    max-width:82%;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    padding:4px 6px;

    background:rgba(0,0,0,.65);

    border-radius:5px;

    font-size:10px;
}

.bubble-mic{
    position:absolute;
    right:5px;
    top:5px;

    padding:4px 5px;

    border-radius:5px;

    background:rgba(0,0,0,.7);

    font-size:10px;
}

.bubble-off{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#15181d;

    font-size:28px;
}

.bubble-resize{
    position:absolute;
    right:0;
    bottom:0;

    width:24px;
    height:24px;

    background:rgba(255,255,255,.2);

    border-radius:8px 0 0 0;

    cursor:nwse-resize;
}

/* ==================================================
   SIDEBAR
================================================== */

.sidebar{
    width:360px;
    height:100%;

    display:flex;
    flex-direction:column;

    background:#15181e;

    border-left:1px solid #292e36;
}

.header{
    padding:12px;
    border-bottom:1px solid #292e36;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.connection{
    margin-top:4px;
    color:#858d98;
    font-size:11px;
}

/* ==================================================
   CHAT
================================================== */

.chat{
    height:37%;
    min-height:210px;

    display:flex;
    flex-direction:column;

    border-bottom:1px solid #292e36;
}

.section-title{
    padding:9px 12px;

    border-bottom:1px solid #292e36;

    color:#adb4be;

    font-size:12px;
    font-weight:bold;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:10px;
}

.message{
    margin-bottom:8px;
}

.message-name{
    margin-bottom:3px;

    color:#858e9b;

    font-size:10px;
}

.message-text{
    display:inline-block;

    max-width:92%;

    padding:7px 9px;

    background:#252a32;

    border-radius:8px;

    font-size:12px;

    word-break:break-word;
}

.chat-input{
    display:flex;

    gap:6px;

    padding:8px;

    border-top:1px solid #292e36;
}

.chat-input input{
    flex:1;
    min-width:0;
}

/* ==================================================
   SIDEBAR SCROLL
================================================== */

.sidebar-scroll{
    flex:1;
    min-height:0;

    overflow-y:auto;
}

.panel{
    padding:11px 12px;

    border-bottom:1px solid #292e36;
}

.panel-title{
    margin-bottom:7px;

    color:#adb4be;

    font-size:12px;
    font-weight:bold;
}

/* ==================================================
   IDENTITY
================================================== */

.name-row{
    display:flex;
    gap:6px;
}

.name-row input{
    flex:1;
    min-width:0;
}

/* ==================================================
   CONTROLS
================================================== */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

/* ==================================================
   ROOM
================================================== */

.room-row{
    display:flex;
    gap:6px;
}

.room-row input{
    flex:1;
    min-width:0;

    font-size:10px;
}

/* ==================================================
   HOST
================================================== */

.host-user{
    padding:8px;
    margin-bottom:6px;

    background:#1e2229;

    border-radius:8px;
}

.host-user-name{
    font-size:12px;
    font-weight:bold;
}

.host-user-state{
    margin-top:3px;

    color:#858e9b;

    font-size:10px;
}

.host-actions{
    display:flex;
    gap:4px;

    margin-top:7px;

    flex-wrap:wrap;
}

.host-actions button{
    padding:5px 7px;
    font-size:10px;
}

.kick{
    background:#78262e;
}

.kick:hover{
    background:#a3323c;
}

/* ==================================================
   FULLSCREEN
================================================== */

.stage.fullscreen{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    z-index:999999;
}

.stage.fullscreen .bubble{
    width:130px;
    height:92px;
}

/* ==================================================
   MOBILE
================================================== */

@media(max-width:850px){

    .app{
        display:block;
        overflow:auto;
    }

    .stage{
        height:58vh;
    }

    .sidebar{
        width:100%;
        height:42vh;

        border-left:0;
        border-top:1px solid #292e36;
    }

    .chat{
        height:42%;
        min-height:180px;
    }

    .bubble{
        width:115px;
        height:84px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ==================================================
     STAGE
================================================== -->

<main class="stage" id="stage">

    <video
        id="screenVideo"
        autoplay
        playsinline>
    </video>

    <div
        class="no-screen"
        id="noScreen">

        <div>
            <div style="font-size:42px">
                🎬
            </div>

            <div>
                Belum ada screen share
            </div>
        </div>

    </div>


    <div class="stage-controls">

        <button
            class="stage-button"
            id="fullscreenBtn">

            ⛶ Fullscreen

        </button>


        <button
            class="stage-button"
            id="shareBtn">

            🖥️ Share Screen

        </button>


        <button
            class="stage-button"
            id="stopShareBtn"
            style="display:none">

            ⛔ Stop Share

        </button>

    </div>


    <div
        class="screen-status"
        id="screenStatus">

        Tidak ada screen share

    </div>


    <div
        class="bubbles"
        id="bubbles">
    </div>

</main>


<!-- ==================================================
     SIDEBAR
================================================== -->

<aside class="sidebar">

    <div class="header">

        <div class="title">
            🎬 Watch Party
        </div>

        <div
            class="connection"
            id="connectionStatus">

            Menghubungkan...

        </div>

    </div>


    <!-- ================= CHAT ================= -->

    <div class="chat">

        <div class="section-title">
            💬 Chat
        </div>

        <div
            class="messages"
            id="messages">
        </div>

        <div class="chat-input">

            <input
                id="chatInput"
                maxlength="300"
                placeholder="Tulis pesan...">

            <button id="sendBtn">
                Kirim
            </button>

        </div>

    </div>


    <div class="sidebar-scroll">


        <!-- ================= IDENTITY ================= -->

        <div class="panel">

            <div class="panel-title">
                👤 Identitas
            </div>

            <div class="name-row">

                <input
                    id="nameInput"
                    maxlength="25">

                <button id="saveNameBtn">
                    Simpan
                </button>

            </div>

        </div>


        <!-- ================= CAMERA ================= -->

        <div class="panel">

            <div class="panel-title">
                🎤 Kamera & Mic
            </div>

            <div class="controls">

                <button id="cameraBtn">
                    📷 Kamera ON
                </button>

                <button id="micBtn">
                    🎤 Mic ON
                </button>

                <button id="switchCameraBtn">
                    🔄 Kamera
                </button>

                <button id="leaveBtn">
                    🚪 Keluar
                </button>

            </div>

        </div>


        <!-- ================= ROOM ================= -->

        <div class="panel">

            <div class="panel-title">
                🔗 Link Room
            </div>

            <div class="room-row">

                <input
                    id="roomUrl"
                    readonly>

                <button id="copyRoomBtn">
                    Salin
                </button>

            </div>

        </div>


        <!-- ================= HOST ================= -->

        <div
            class="panel"
            id="hostPanel"
            style="display:none">

            <div class="panel-title">
                👑 Kontrol Host
            </div>

            <div
                style="
                color:#858e9b;
                font-size:10px;
                margin-bottom:8px">

                Host dapat mengontrol peserta.

            </div>

            <div id="hostUsers"></div>

        </div>


    </div>

</aside>

</div>


<script>

/* =========================================================
   ROOM
========================================================= */

const urlParams =
    new URLSearchParams(
        location.search
    );

let roomId =
    urlParams.get("room");


let isHost = false;


if(!roomId){

    roomId =
        "room-" +
        Math.random()
        .toString(36)
        .substring(2,9);

    isHost = true;


    history.replaceState(
        {},
        "",
        location.pathname +
        "?room=" +
        roomId
    );

}else{

    isHost = false;

}


/* =========================================================
   PEER
========================================================= */

let peer;


if(isHost){

    peer =
        new Peer(roomId);

}else{

    peer =
        new Peer();

}


/* =========================================================
   STATE
========================================================= */

let myName =
    localStorage.getItem(
        "watchparty_name"
    ) ||
    "User-" +
    Math.floor(
        Math.random()*9999
    );


let cameraEnabled = false;
let micEnabled = false;

let cameraFacing = "user";

let localCameraStream = null;
let localScreenStream = null;

let screenOwner = null;

let screenPermission =
    null;


const participants = {};
const connections = {};

const cameraCalls = {};
const screenCalls = {};


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const screenVideo =
    document.getElementById(
        "screenVideo"
    );

const noScreen =
    document.getElementById(
        "noScreen"
    );

const bubbles =
    document.getElementById(
        "bubbles"
    );

const messages =
    document.getElementById(
        "messages"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const roomUrl =
    document.getElementById(
        "roomUrl"
    );

const hostPanel =
    document.getElementById(
        "hostPanel"
    );

const hostUsers =
    document.getElementById(
        "hostUsers"
    );

const shareBtn =
    document.getElementById(
        "shareBtn"
    );

const stopShareBtn =
    document.getElementById(
        "stopShareBtn"
    );

const cameraBtn =
    document.getElementById(
        "cameraBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const switchCameraBtn =
    document.getElementById(
        "switchCameraBtn"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


nameInput.value =
    myName;

roomUrl.value =
    location.href;


/* =========================================================
   LOCAL PARTICIPANT
========================================================= */

function updateSelf(){

    if(!peer || !peer.id)
        return;


    participants[peer.id] = {

        ...(participants[peer.id] || {}),

        id:peer.id,

        name:myName,

        camera:cameraEnabled,

        mic:micEnabled,

        cameraLocked:
            participants[peer.id]
            ?.cameraLocked || false,

        micLocked:
            participants[peer.id]
            ?.micLocked || false,

        connected:true,

        self:true

    };


    cameraBtn.textContent =
        cameraEnabled
        ? "📷 Kamera OFF"
        : "📷 Kamera ON";


    micBtn.textContent =
        micEnabled
        ? "🎤 Mic OFF"
        : "🔇 Mic ON";


    renderBubbles();

    updateHostUsers();

}


/* =========================================================
   PEER OPEN
========================================================= */

peer.on("open", id => {

    console.log(
        "Peer connected:",
        id
    );


    connectionStatus.textContent =
        isHost
        ? "👑 Host • Online"
        : "🟢 Online";


    updateSelf();


    if(isHost){

        /*
           Host mempunyai izin share
           secara default.
        */

        screenPermission =
            peer.id;


        hostPanel.style.display =
            "block";


        /*
           Tidak langsung menyembunyikan host panel.
        */

        updateHostUsers();

    }else{

        /*
           Peserta connect ke host.
        */

        connectToPeer(
            roomId
        );

    }

});


/* =========================================================
   PEER ERROR
========================================================= */

peer.on("error", error => {

    console.error(
        "PeerJS error:",
        error
    );


    connectionStatus.textContent =
        "⚠️ " +
        error.type;


    if(
        error.type ===
        "unavailable-id"
    ){

        if(isHost){

            alert(
                "Room ID sedang digunakan. Refresh untuk membuat room baru."
            );

        }

    }

});


/* =========================================================
   CONNECT
========================================================= */

function connectToPeer(id){

    if(!peer)
        return;

    if(id === peer.id)
        return;

    if(connections[id])
        return;


    console.log(
        "Connecting to:",
        id
    );


    const conn =
        peer.connect(
            id,
            {
                reliable:true
            }
        );


    setupConnection(
        conn
    );

}


/* =========================================================
   INCOMING CONNECTION
========================================================= */

peer.on(
    "connection",
    conn => {

        console.log(
            "Incoming connection:",
            conn.peer
        );


        setupConnection(
            conn
        );

    }
);


/* =========================================================
   SETUP CONNECTION
========================================================= */

function setupConnection(conn){

    if(!conn)
        return;


    /*
       Jangan menolak connection yang sedang
       berbeda instance secara tidak sengaja.
    */

    connections[
        conn.peer
    ] = conn;


    conn.on(
        "open",
        () => {

            console.log(
                "Connection open:",
                conn.peer
            );


            /*
               KIRIM HELLO KE DUA ARAH
            */

            sendTo(
                conn,
                {
                    type:"hello",

                    id:peer.id,

                    name:myName,

                    camera:cameraEnabled,

                    mic:micEnabled,

                    isHost:isHost
                }
            );


            /*
               Host kirim status permission.
            */

            if(isHost){

                sendTo(
                    conn,
                    {
                        type:"permission",

                        permission:
                            screenPermission,

                        owner:
                            screenOwner
                    }
                );

            }


            /*
               Kalau kita sudah menyalakan kamera,
               kirim ke peer baru.
            */

            if(
                cameraEnabled &&
                localCameraStream
            ){

                startCameraCall(
                    conn.peer
                );

            }

        }
    );


    conn.on(
        "data",
        data => {

            handleData(
                conn.peer,
                data
            );

        }
    );


    conn.on(
        "close",
        () => {

            console.log(
                "Connection closed:",
                conn.peer
            );


            removeParticipant(
                conn.peer
            );

        }
    );


    conn.on(
        "error",
        error => {

            console.warn(
                "Connection error:",
                error
            );

        }
    );

}


/* =========================================================
   DATA HANDLER
========================================================= */

function handleData(
    from,
    data
){

    if(
        !data ||
        !data.type
    )
        return;


    /* ================= HELLO ================= */

    if(
        data.type ===
        "hello"
    ){

        participants[from] = {

            ...(participants[from] || {}),

            id:from,

            name:
                data.name ||
                "User",

            camera:
                !!data.camera,

            mic:
                !!data.mic,

            connected:true,

            isHost:
                !!data.isHost,

            cameraLocked:
                participants[from]
                ?.cameraLocked || false,

            micLocked:
                participants[from]
                ?.micLocked || false

        };


        renderBubbles();

        updateHostUsers();


        /*
           Kirim balik informasi host.
        */

        if(isHost){

            sendTo(
                connections[from],
                {
                    type:"hello",

                    id:peer.id,

                    name:myName,

                    camera:cameraEnabled,

                    mic:micEnabled,

                    isHost:true
                }
            );

        }


        return;
    }


    /* ================= NAME ================= */

    if(
        data.type ===
        "name"
    ){

        if(
            participants[from]
        ){

            participants[from].name =
                data.name;

        }


        renderBubbles();

        updateHostUsers();

        return;
    }


    /* ================= CAMERA ================= */

    if(
        data.type ===
        "cameraState"
    ){

        if(
            !participants[from]
        ){

            participants[from] = {};

        }


        participants[from].camera =
            !!data.enabled;


        renderBubbles();

        updateHostUsers();

        return;
    }


    /* ================= MIC ================= */

    if(
        data.type ===
        "micState"
    ){

        if(
            !participants[from]
        ){

            participants[from] = {};

        }


        participants[from].mic =
            !!data.enabled;


        renderBubbles();

        updateHostUsers();

        return;
    }


    /* ================= CHAT ================= */

    if(
        data.type ===
        "chat"
    ){

        addMessage(
            data.name ||
            "User",

            data.text
        );


        /*
           Forward ke peserta lain.
        */

        broadcast(
            data,
            from
        );


        return;
    }


    /* ================= PERMISSION ================= */

    if(
        data.type ===
        "permission"
    ){

        screenPermission =
            data.permission ||
            null;

        screenOwner =
            data.owner ||
            null;


        updateScreenUI();

        return;
    }


    /* ================= SCREEN START ================= */

    if(
        data.type ===
        "screenStarted"
    ){

        screenOwner =
            data.owner;


        updateScreenUI();

        return;
    }


    /* ================= SCREEN STOP ================= */

    if(
        data.type ===
        "screenStopped"
    ){

        if(
            screenOwner ===
            data.owner
        ){

            screenOwner =
                null;


            screenVideo.srcObject =
                null;


            noScreen.classList.remove(
                "hidden"
            );


            document.getElementById(
                "screenStatus"
            ).textContent =
                "Tidak ada screen share";


            updateScreenUI();

        }


        return;
    }


    /* ================= HOST COMMAND ================= */

    if(
        data.type ===
        "hostCommand"
    ){

        handleHostCommand(
            data.command
        );

        return;
    }


    /* ================= KICK ================= */

    if(
        data.type ===
        "kick"
    ){

        if(
            data.target ===
            peer.id
        ){

            kickedOut();

            return;
        }


        /*
           Peserta lain menghapus user.
        */

        removeParticipant(
            data.target
        );

        return;
    }

}


/* =========================================================
   SEND
========================================================= */

function sendTo(
    conn,
    data
){

    try{

        if(
            conn &&
            conn.open
        ){

            conn.send(
                data
            );

        }

    }catch(error){

        console.warn(
            error
        );

    }

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(
    data,
    exclude=null
){

    Object.keys(
        connections
    ).forEach(
        id => {

            if(
                id === exclude
            )
                return;


            sendTo(
                connections[id],
                data
            );

        }
    );

}


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

    if(
        !isHost &&
        participants[peer.id]
        ?.cameraLocked
    ){

        alert(
            "Host sedang memblokir kamera kamu."
        );

        return;
    }


    if(cameraEnabled)
        return;


    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:
                        cameraFacing,

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:
                    micEnabled

            });


        localCameraStream =
            stream;


        cameraEnabled =
            true;


        stream
        .getVideoTracks()
        .forEach(
            track => {

                try{

                    track.contentHint =
                        "motion";

                }catch(e){}

            }
        );


        stream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    micEnabled;

            }
        );


        updateSelf();


        broadcast({
            type:"cameraState",
            enabled:true
        });


        Object.keys(
            connections
        ).forEach(
            id => {

                startCameraCall(
                    id
                );

            }
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "Tidak bisa mengakses kamera.\n\n" +
            "Pastikan izin kamera sudah diberikan."
        );

    }

}


/* =========================================================
   CAMERA STOP
========================================================= */

function stopCamera(){

    if(
        !localCameraStream
    )
        return;


    localCameraStream
    .getVideoTracks()
    .forEach(
        track => {

            track.stop();

        }
    );


    localCameraStream =
        null;


    cameraEnabled =
        false;


    /*
       Tutup camera calls supaya
       remote benar-benar berhenti menerima.
    */

    Object.keys(
        cameraCalls
    ).forEach(
        id => {

            try{

                cameraCalls[id]
                    .close();

            }catch(e){}

        }
    );


    updateSelf();


    broadcast({
        type:"cameraState",
        enabled:false
    });

}


/* =========================================================
   CAMERA CALL
========================================================= */

function startCameraCall(
    id
){

    if(
        !localCameraStream
    )
        return;


    if(
        !connections[id]
    )
        return;


    /*
       Tutup call sebelumnya.
    */

    if(
        cameraCalls[id]
    ){

        try{

            cameraCalls[id]
                .close();

        }catch(e){}

    }


    try{

        const call =
            peer.call(
                id,

                localCameraStream,

                {
                    metadata:{
                        kind:"camera",

                        name:
                            myName
                    }
                }
            );


        cameraCalls[id] =
            call;


        call.on(
            "stream",
            stream => {

                attachRemoteCamera(
                    id,
                    stream
                );

            }
        );


        call.on(
            "error",
            error => {

                console.warn(
                    "Camera call:",
                    error
                );

            }
        );


    }catch(error){

        console.warn(
            error
        );

    }

}


/* =========================================================
   INCOMING MEDIA CALL
========================================================= */

peer.on(
    "call",
    call => {

        const kind =
            call.metadata
            ?.kind;


        /* ================= CAMERA ================= */

        if(
            kind ===
            "camera"
        ){

            /*
               Jawab dengan kamera sendiri
               jika tersedia.
            */

            call.answer(
                localCameraStream ||
                undefined
            );


            cameraCalls[
                call.peer
            ] = call;


            call.on(
                "stream",
                stream => {

                    attachRemoteCamera(
                        call.peer,
                        stream
                    );

                }
            );


            return;
        }


        /* ================= SCREEN ================= */

        if(
            kind ===
            "screen"
        ){

            /*
               Hanya izinkan pemilik permission.
            */

            if(
                screenPermission &&
                call.peer !==
                    screenPermission
            ){

                call.close();

                return;
            }


            call.answer();


            screenCalls[
                call.peer
            ] = call;


            call.on(
                "stream",
                stream => {

                    screenOwner =
                        call.peer;


                    screenVideo
                        .srcObject =
                        stream;


                    noScreen
                        .classList
                        .add(
                            "hidden"
                        );


                    const sharerName =
                        participants[
                            call.peer
                        ]?.name ||
                        "Peserta";


                    document.getElementById(
                        "screenStatus"
                    ).textContent =
                        "🖥️ " +
                        sharerName +
                        " sedang share screen";


                    updateScreenUI();

                }
            );


            call.on(
                "close",
                () => {

                    if(
                        screenOwner ===
                        call.peer
                    ){

                        screenOwner =
                            null;


                        screenVideo
                            .srcObject =
                            null;


                        noScreen
                            .classList
                            .remove(
                                "hidden"
                            );


                        document.getElementById(
                            "screenStatus"
                        ).textContent =
                            "Tidak ada screen share";


                        updateScreenUI();

                    }

                }
            );

        }

    }
);


/* =========================================================
   REMOTE CAMERA
========================================================= */

function attachRemoteCamera(
    id,
    stream
){

    let bubble =
        document.getElementById(
            "bubble-" +
            id
        );


    if(!bubble){

        bubble =
            createBubble(
                id
            );


        bubbles.appendChild(
            bubble
        );


        enableBubbleDrag(
            bubble
        );


        enableBubbleResize(
            bubble
        );

    }


    const video =
        bubble.querySelector(
            "video"
        );


    video.srcObject =
        stream;


    video.play()
        .catch(
            () => {}
        );


    bubble
        .querySelector(
            ".bubble-off"
        )
        .style.display =
        "none";

}

        );

    off.textContent =

            "div"
        );


    name.className =

        );

/* =========================================================
   RENDER BUBBLES
========================================================= */

function renderBubbles(){

    Object.keys(
        participants
    ).forEach(
        id => {

            const user =
                participants[id];


            let bubble =
                document.getElementById(
                    "bubble-" +
                    id
                );


            if(!bubble){

                bubble =
                    createBubble(
                        id
                    );


                bubbles.appendChild(
                    bubble
                );


                enableBubbleDrag(
                    bubble
                );


                enableBubbleResize(
                    bubble
                );

            }


            const video =
                bubble.querySelector(
                    "video"
                );


            const off =
                bubble.querySelector(
                    ".bubble-off"
                );


            const name =
                bubble.querySelector(
                    ".bubble-name"
                );


            const mic =
                bubble.querySelector(
                    ".bubble-mic"
                );


            name.textContent =
                user.name ||
                "User";


            mic.textContent =
                user.mic
                ? "🎤"
                : "🔇";


            /*
               SELF
            */

            if(
                id ===
                peer.id
            ){

                if(
                    localCameraStream &&
                    cameraEnabled
                ){

                    video.srcObject =
                        localCameraStream;


                    video.muted =
                        true;


                    off.style.display =
                        "none";

                }else{

                    video.srcObject =
                        null;


                    off.style.display =
                        "flex";

                }


            }else{

                off.style.display =
                    user.camera
                    ? "none"
                    : "flex";

            }

        }

    /*
       Hapus bubble yang tidak punya participant.
    */

    [
        ...bubbles.children
    ].forEach(
        bubble => {

            const id =
                bubble.id.replace(
                    "bubble-",
                    ""
                );


            if(
                !participants[id]
            ){

                bubble.remove();

            }

        }
    );

}


/* =========================================================
   DRAG BUBBLE
========================================================= */

function enableBubbleDrag(
    bubble
){

    let dragging =
        false;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;


    bubble.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.classList
                .contains(
                    "bubble-resize"
                )
            ){

                return;
            }


            dragging =
                true;


            bubble.setPointerCapture(
                e.pointerId
            );


            const rect =
                bubble
                .getBoundingClientRect();


            const stageRect =
                stage
                .getBoundingClientRect();


            startX =
                e.clientX;


            startY =
                e.clientY;


            startLeft =
                rect.left -
                stageRect.left;


            startTop =
                rect.top -
                stageRect.top;


            bubble.style.bottom =
                "auto";

        }
    );


    bubble.addEventListener(
        "pointermove",
        e => {

            if(!dragging)
                return;


            const stageRect =
                stage
                .getBoundingClientRect();


            const width =
                bubble.offsetWidth;


            const height =
                bubble.offsetHeight;


            let left =
                startLeft +
                e.clientX -
                startX;


            let top =
                startTop +
                e.clientY -
                startY;


            left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        stageRect.width -
                        width
                    )
                );


            top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        stageRect.height -
                        height
                    )
                );


            bubble.style.left =
                left +
                "px";


            bubble.style.top =
                top +
                "px";

        }
    );


    bubble.addEventListener(
        "pointerup",
        e => {

            dragging =
                false;

            try{

                bubble.releasePointerCapture(
                    e.pointerId
                );

            }catch(error){}

        }
    );

}


/* =========================================================
   RESIZE BUBBLE
========================================================= */

function enableBubbleResize(
    bubble
){

    const handle =
        bubble.querySelector(
            ".bubble-resize"
        );


    let resizing =
        false;


    let startX;
    let startY;

    let startW;
    let startH;


    handle.addEventListener(
        "pointerdown",
        e => {

            e.stopPropagation();


            resizing =
                true;


            handle.setPointerCapture(
                e.pointerId
            );


            startX =
                e.clientX;


            startY =
                e.clientY;


            startW =
                bubble.offsetWidth;


            startH =
                bubble.offsetHeight;

        }
    );


    handle.addEventListener(
        "pointermove",
        e => {

            if(!resizing)
                return;


            const diff =
                e.clientX -
                startX;


            let width =
                startW +
                diff;


            let height =
                width *
                .72;


            width =
                Math.max(
                    80,
                    Math.min(
                        400,
                        width
                    )
                );


            height =
                Math.max(
                    60,
                    Math.min(
                        300,
                        height
                    )
                );


            bubble.style.width =
                width +
                "px";


            bubble.style.height =
                height +
                "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        e => {

            resizing =
                false;


            try{

                handle.releasePointerCapture(
                    e.pointerId
                );

            }catch(error){}

        }
    );

}


/* =========================================================
   MIC
========================================================= */

async function toggleMic(){

    if(
        !isHost &&
        participants[peer.id]
        ?.micLocked
    ){

        alert(
            "Host sedang memblokir microphone kamu."
        );

        return;
    }


    /*
       Jika belum punya stream,
       ambil audio.
    */

    if(
        !localCameraStream
    ){

        try{

            localCameraStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video:false,

                    audio:true

                });


            micEnabled =
                true;


            updateSelf();


            broadcast({
                type:"micState",
                enabled:true
            });


            Object.keys(
                connections
            ).forEach(
                id => {

                    startCameraCall(
                        id
                    );

                }
            );


            return;

        }catch(error){

            alert(
                "Tidak bisa mengakses microphone."
            );

            return;
        }

    }


    const audioTracks =
        localCameraStream
        .getAudioTracks();


    /*
       Kalau stream tidak punya audio,
       tambahkan audio track.
    */

    if(
        audioTracks.length === 0
    ){

        try{

            const audioStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true

                });


            const track =
                audioStream
                .getAudioTracks()[0];


            localCameraStream
                .addTrack(
                    track
                );


            micEnabled =
                true;


            updateSelf();


            broadcast({
                type:"micState",
                enabled:true
            });


            Object.keys(
                connections
            ).forEach(
                id => {

                    startCameraCall(
                        id
                    );

                }
            );


            return;

        }catch(error){

            alert(
                "Microphone tidak tersedia."
            );

            return;

        }

    }


    micEnabled =
        !micEnabled;


    audioTracks.forEach(
        track => {

            track.enabled =
                micEnabled;

        }
    );


    updateSelf();


    broadcast({
        type:"micState",
        enabled:micEnabled
    });

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera(){

    if(
        !cameraEnabled ||
        !localCameraStream
    )
        return;


    cameraFacing =
        cameraFacing ===
        "user"
        ? "environment"
        : "user";


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:
                        cameraFacing,

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        const newTrack =
            stream
            .getVideoTracks()[0];


        const oldTrack =
            localCameraStream
            .getVideoTracks()[0];


        if(oldTrack){

            oldTrack.stop();

            localCameraStream
                .removeTrack(
                    oldTrack
                );

        }


        localCameraStream
            .addTrack(
                newTrack
            );


        Object.keys(
            connections
        ).forEach(
            id => {

                startCameraCall(
                    id
                );

            }
        );


        renderBubbles();

    }catch(error){

        alert(
            "Kamera depan/belakang tidak tersedia."
        );

    }

}


/* =========================================================
   SCREEN SHARE
========================================================= */

async function startScreenShare(){

    /*
       Host selalu punya akses.
    */

    if(
        !isHost &&
        screenPermission !==
            peer.id
    ){

        alert(
            "Host belum memberikan izin screen share."
        );

        return;

    }


    /*
       Satu orang saja.
    */

    if(
        screenOwner &&
        screenOwner !==
            peer.id
    ){

        alert(
            "Saat ini peserta lain sedang share screen."
        );

        return;

    }


    if(
        localScreenStream
    )
        return;


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices
        .getDisplayMedia
    ){

        alert(
            "Browser/perangkat ini tidak mendukung screen sharing.\n\n" +
            "Coba gunakan Chrome/Edge/Firefox di PC atau laptop."
        );

        return;

    }


    try{

        /*
           Audio sengaja dibuat false
           agar kompatibilitas lebih baik.
        */

        const stream =
            await navigator
            .mediaDevices
            .getDisplayMedia({

                video:{
                    frameRate:{
                        ideal:60,
                        max:60
                    },

                    width:{
                        ideal:1920,
                        max:1920
                    },

                    height:{
                        ideal:1080,
                        max:1080
                    }
                },

                audio:false

            });


        localScreenStream =
            stream;


        const track =
            stream
            .getVideoTracks()[0];


        /*
           Prioritas untuk video bergerak.
        */

        try{

            track.contentHint =
                "motion";

        }catch(error){}


        /*
           Coba 60 FPS.
        */

        try{

            await track.applyConstraints({

                frameRate:{
                    ideal:60,
                    max:60
                }

            });

        }catch(error){}


        screenOwner =
            peer.id;


        screenVideo.srcObject =
            stream;


        noScreen.classList.add(
            "hidden"
        );


        document.getElementById(
            "screenStatus"
        ).textContent =
            "🖥️ Kamu sedang share screen";


        shareBtn.style.display =
            "none";


        stopShareBtn.style.display =
            "inline-block";


        /*
           Kirim screen ke semua peserta.
        */

        Object.keys(
            connections
        ).forEach(
            id => {

                startScreenCall(
                    id
                );

            }
        );


        broadcast({
            type:"screenStarted",
            owner:peer.id
        });


        /*
           Jika user menekan
           Stop Sharing dari browser.
        */

        track.onended =
            () => {

                stopScreenShare();

            };


    }catch(error){

        console.error(
            "Screen share error:",
            error
        );


        alert(
            "Screen share dibatalkan atau browser tidak mendukung fitur ini."
        );

    }

}


/* =========================================================
   SCREEN CALL
========================================================= */

function startScreenCall(
    id
){

    if(
        !localScreenStream
    )
        return;


    if(
        !connections[id]
    )
        return;


    if(
        screenCalls[id]
    ){

        try{

            screenCalls[id]
                .close();

        }catch(error){}

    }


    try{

        const call =
            peer.call(

                id,

                localScreenStream,

                {
                    metadata:{
                        kind:
                            "screen",

                        name:
                            myName
                    }
                }

            );


        screenCalls[id] =
            call;


        /*
           Coba optimasi bitrate.
        */

        setTimeout(
            () => {

                optimizeScreenCall(
                    call
                );

            },
            1000
        );


    }catch(error){

        console.warn(
            error
        );

    }

}


/* =========================================================
   WEBRTC OPTIMIZATION
========================================================= */

async function optimizeScreenCall(
    call
){

    try{

        const pc =
            call.peerConnection ||
            call._pc;


        if(!pc)
            return;


        const senders =
            pc.getSenders();


        for(
            const sender
            of senders
        ){

            if(
                sender.track &&
                sender.track.kind ===
                "video"
            ){

                const params =
                    sender.getParameters();


                if(
                    !params.encodings
                ){

                    params.encodings =
                        [{}];

                }


                params.encodings[0]
                    .maxBitrate =
                    8000000;


                params.encodings[0]
                    .maxFramerate =
                    60;


                try{

                    await sender
                        .setParameters(
                            params
                        );

                }catch(error){

                    console.warn(
                        "Bitrate optimization:",
                        error
                    );

                }

            }

        }

    }catch(error){

        console.warn(
            "WebRTC optimization:",
            error
        );

    }

}

/* =========================================================
   HOST COMMAND
========================================================= */

function sendHostCommand(
    id,
    command
){

    if(
        !connections[id]
    )
        return;


    sendTo(
        connections[id],
        {
            type:
                "hostCommand",

            command:
                command
        }
    );

}


function handleHostCommand(
    command
){

    /* MIC OFF */

    if(
        command ===
        "micOff"
    ){

        if(
            localCameraStream
        ){

            localCameraStream
            .getAudioTracks()
            .forEach(
                track => {

                    track.enabled =
                        false;

                }
            );

        }


        micEnabled =
            false;


        participants[peer.id]
            .micLocked =
            true;


        updateSelf();


        broadcast({
            type:"micState",
            enabled:false
        });


        return;
    }


    /* MIC UNLOCK */

    if(
        command ===
        "micUnlock"
    ){

        participants[peer.id]
            .micLocked =
            false;


        return;
    }


    /* CAMERA OFF */

    if(
        command ===
        "cameraOff"
    ){

        if(
            localCameraStream
        ){

            localCameraStream
            .getVideoTracks()
            .forEach(
                track => {

                    track.enabled =
                        false;

                }
            );

        }


        cameraEnabled =
            false;


        participants[peer.id]
            .cameraLocked =
            true;


        updateSelf();


        broadcast({
            type:"cameraState",
            enabled:false
        });


        return;
    }


    /* CAMERA UNLOCK */

    if(
        command ===
        "cameraUnlock"
    ){

        participants[peer.id]
            .cameraLocked =
            false;


        return;
    }

}

            name.className =
                "host-user-name";


            name.textContent =
                user.name ||
                "User";


            const state =
                document.createElement(
                    "div"
                );


            state.className =
                "host-user-state";


            state.textContent =
                "Mic " +
                (
                    user.mic
                    ? "ON"
                    : "OFF"
                ) +
                " • Kamera " +
                (
                    user.camera
                    ? "ON"
                    : "OFF"
                );


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "host-actions";


            /*
               MIC
            */

            const mic =
                document.createElement(
                    "button"
                );


            mic.textContent =
                user.micLocked
                ? "🔓 Buka Mic"
                : "🔇 Matikan Mic";


            mic.onclick =
                () => {

                    if(
                        user.micLocked
                    ){

                        user.micLocked =
                            false;


                        sendHostCommand(
                            id,
                            "micUnlock"
                        );

                    }else{

                        user.micLocked =
                            true;


                        sendHostCommand(
                            id,
                            "micOff"
                        );

                    }


                    updateHostUsers();

                };


            /*
               CAMERA
            */

            const cam =
                document.createElement(
                    "button"
                );


            cam.textContent =
                user.cameraLocked
                ? "🔓 Buka Cam"
                : "📷 Matikan Cam";


            cam.onclick =
                () => {

                    if(
                        user.cameraLocked
                    ){

                        user.cameraLocked =
                            false;


                        sendHostCommand(
                            id,
                            "cameraUnlock"
                        );

                    }else{

                        user.cameraLocked =
                            true;


                        sendHostCommand(
                            id,
                            "cameraOff"
                        );

                    }


                    updateHostUsers();

                };


            /*
               SCREEN
            */

            const screen =
                document.createElement(
                    "button"
                );


            screen.textContent =
                screenPermission ===
                id
                ? "🖥️ Izin ✓"
                : "🖥️ Beri Izin";


            screen.onclick =
                () => {

                    /*
                       Jangan transfer permission
                       ketika orang lain sedang share.
                    */

                    if(
                        screenOwner &&
                        screenOwner !==
                            id
                    ){

                        alert(
                            "Hentikan screen share yang sedang aktif terlebih dahulu."
                        );

                        return;

                    }


                    screenPermission =
                        id;


                    broadcast({
                        type:
                            "permission",

                        permission:
                            id,

                        owner:
                            screenOwner
                    });


                    updateScreenUI();
                    updateHostUsers();

                };


            /*
               KICK
            */

            const kick =
                document.createElement(
                    "button"
                );


            kick.className =
                "kick";


            kick.textContent =
                "🚫 Kick";


            kick.onclick =
                () => {

                    const ok =
                        confirm(
                            "Keluarkan " +
                            (
                                user.name ||
                                "peserta"
                            ) +
                            " dari room?"
                        );


                    if(!ok)
                        return;


                    /*
                       Kirim kick.
                    */

                    sendTo(
                        connections[id],
                        {
                            type:
                                "kick",

                            target:
                                id
                        }
                    );


                    /*
                       Hapus lokal.
                    */

                    setTimeout(
                        () => {

                            removeParticipant(
                                id
                            );

                        },
                        250
                    );

                };


            actions.appendChild(
                mic
            );

            actions.appendChild(
                cam
            );

            actions.appendChild(
                screen
            );

            actions.appendChild(
                kick
            );


            box.appendChild(
                name
            );

            box.appendChild(
                state
            );

            box.appendChild(
                actions
            );


            hostUsers.appendChild(
                box
            );

        }
    );

}


/* =========================================================
   KICKED
========================================================= */

function kickedOut(){

    /*
       Matikan media.
    */

    if(
        localCameraStream
    ){

        localCameraStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    if(
        localScreenStream
    ){

        localScreenStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    try{

        peer.destroy();

    }catch(error){}


    document.body.innerHTML = `

        <div style="
            width:100vw;
            height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#090b0f;

            color:white;

            font-family:Arial;

            text-align:center;
        ">

            <div>

                <div style="
                    font-size:55px;
                    margin-bottom:15px">

                    🚫

                </div>

                <h2>
                    Kamu dikeluarkan dari room
                </h2>

                <p style="
                    color:#858d98">

                    Host telah mengeluarkan kamu dari room.

                </p>

            </div>

        </div>

    `;

}


/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const text =
        chatInput.value.trim();


    if(!text)
        return;


    const data = {

        type:"chat",

        name:
            myName,

        text:
            text

    };


    addMessage(
        myName,
        text
    );


    broadcast(
        data
    );


    chatInput.value =
        "";

}


function addMessage(
    name,
    text
){

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "message";


    const nameEl =
        document.createElement(
            "div"
        );


    nameEl.className =
        "message-name";


    nameEl.textContent =
        name ||
        "User";


    const textEl =
        document.createElement(
            "div"
        );


    textEl.className =
        "message-text";


    textEl.textContent =
        text;


    item.appendChild(
        nameEl
    );


    item.appendChild(
        textEl
    );


    messages.appendChild(
        item
    );


    messages.scrollTop =
        messages.scrollHeight;

}


document
.getElementById(
    "sendBtn"
)
.onclick =
sendChat;


chatInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            sendChat();

        }

    }
);


/* =========================================================
   SAVE NAME
========================================================= */

document
.getElementById(
    "saveNameBtn"
)
.onclick =
() => {

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    myName =
        name;


    localStorage.setItem(
        "watchparty_name",
        myName
    );


    if(
        participants[peer.id]
    ){

        participants[
            peer.id
        ].name =
            myName;

    }


    broadcast({
        type:"name",
        name:myName
    });


    renderBubbles();
    updateHostUsers();

};


/* =========================================================
   CAMERA BUTTON
========================================================= */

cameraBtn.onclick =
async () => {

    if(
        !isHost &&
        participants[peer.id]
        ?.cameraLocked
    ){

        alert(
            "Host sedang memblokir kamera kamu."
        );

        return;

    }


    if(
        cameraEnabled
    ){

        stopCamera();

    }else{

        await startCamera();

    }

};


/* =========================================================
   MIC BUTTON
========================================================= */

micBtn.onclick =
async () => {

    await toggleMic();

};


/* =========================================================
   SWITCH CAMERA
========================================================= */

switchCameraBtn.onclick =
switchCamera;


/* =========================================================
   SCREEN
========================================================= */

shareBtn.onclick =
startScreenShare;


stopShareBtn.onclick =
stopScreenShare;


/* =========================================================
   FULLSCREEN
========================================================= */

document
.getElementById(
    "fullscreenBtn"
)
.onclick =
async () => {

    try{

        if(
            !document.fullscreenElement
        ){

            if(
                stage.requestFullscreen
            ){

                await stage.requestFullscreen();

            }else{

                stage.classList.add(
                    "fullscreen"
                );

            }

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        stage.classList.toggle(
            "fullscreen"
        );

    }

};


document.addEventListener(
    "fullscreenchange",
    () => {

        if(
            document.fullscreenElement
        ){

            stage.classList.add(
                "fullscreen"
            );

        }else{

            stage.classList.remove(
                "fullscreen"
            );

        }

    }
);


/* =========================================================
   COPY ROOM
========================================================= */

document
.getElementById(
    "copyRoomBtn"
)
.onclick =
async () => {

    try{

        await navigator
            .clipboard
            .writeText(
                location.href
            );


        alert(
            "Link room berhasil disalin."
        );

    }catch(error){

        roomUrl.select();

        document.execCommand(
            "copy"
        );

        alert(
            "Link room berhasil disalin."
        );

    }

};


/* =========================================================
   LEAVE
========================================================= */

document
.getElementById(
    "leaveBtn"
)
.onclick =
() => {

    if(
        !confirm(
            "Keluar dari room?"
        )
    )
        return;


    if(
        localCameraStream
    ){

        localCameraStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    if(
        localScreenStream
    ){

        localScreenStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    try{

        peer.destroy();

    }catch(error){}


    location.href =
        location.pathname;

};


/* =========================================================
   REMOVE PARTICIPANT
========================================================= */

function removeParticipant(
    id
){

    delete participants[
        id
    ];


    if(
        cameraCalls[id]
    ){

        try{

            cameraCalls[id]
                .close();

        }catch(error){}


        delete cameraCalls[id];

    }


    if(
        screenCalls[id]
    ){

        try{

            screenCalls[id]
                .close();

        }catch(error){}


        delete screenCalls[id];

    }


    if(
        connections[id]
    ){

        try{

            connections[id]
                .close();

        }catch(error){}


        delete connections[id];

    }


    const bubble =
        document.getElementById(
            "bubble-" +
            id
        );


    if(bubble)
        bubble.remove();


    /*
       Kalau orang yang share screen keluar,
       host mengambil kembali permission.
    */

    if(
        isHost &&
        screenOwner === id
    ){

        screenOwner =
            null;


        screenPermission =
            peer.id;


        broadcast({
            type:
                "screenStopped",

            owner:
                id
        });


        broadcast({
            type:
                "permission",

            permission:
                peer.id,

            owner:
                null
        });

    }


    renderBubbles();

    updateHostUsers();

    updateScreenUI();

}


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(
            localCameraStream
        ){

            localCameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }


        if(
            localScreenStream
        ){

            localScreenStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

updateSelf();

updateScreenUI();

</script>
