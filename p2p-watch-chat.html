/* =========================================================
   SWITCH CAMERA
========================================================= */

document
    .getElementById(
        "switchCameraBtn"
    )
    .onclick =
    async () => {

        if(
            !cameraEnabled ||
            !mediaStream
        ){

            alert(
                "Aktifkan kamera terlebih dahulu."
            );

            return;

        }


        cameraFacing =
            cameraFacing ===
            "user"
            ? "environment"
            : "user";


        try{

            const newStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:
                                cameraFacing,

                            width:{
                                ideal:1280
                            },

                            height:{
                                ideal:720
                            }

                        },

                        audio:false

                    });


            const newTrack =
                newStream
                    .getVideoTracks()[0];


            const oldTrack =
                mediaStream
                    .getVideoTracks()[0];


            /*
               Ganti track di stream.
            */

            if(oldTrack){

                oldTrack.stop();

                mediaStream
                    .removeTrack(
                        oldTrack
                    );

            }


            mediaStream.addTrack(
                newTrack
            );


            /*
               Karena PeerJS membungkus
               RTCPeerConnection, gunakan
               replaceTrack jika tersedia.
            */

            Object.values(
                mediaCalls
            ).forEach(
                call => {

                    try{

                        const pc =
                            call.peerConnection ||
                            call._pc;


                        if(!pc)
                            return;


                        const sender =
                            pc.getSenders()
                            .find(
                                s =>
                                    s.track &&
                                    s.track.kind ===
                                        "video"
                            );


                        if(
                            sender &&
                            sender.replaceTrack
                        ){

                            sender.replaceTrack(
                                newTrack
                            );

                        }

                    }catch(error){

                        console.warn(
                            "replaceTrack:",
                            error
                        );

                    }

                }
            );


            renderBubbles();


        }catch(error){

            console.error(
                error
            );


            alert(
                "Tidak bisa mengganti kamera."
            );

        }

    };


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById(
        "fullscreenBtn"
    )
    .onclick =
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                if(
                    stage.requestFullscreen
                ){

                    await stage.requestFullscreen();

                }else{

                    stage.classList.add(
                        "fullscreen"
                    );

                }

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            stage.classList.toggle(
                "fullscreen"
            );

        }

    };


document.addEventListener(
    "fullscreenchange",
    () => {

        stage.classList.toggle(
            "fullscreen",
            !!document.fullscreenElement
        );

    }
);


/* =========================================================
   SCREEN BUTTONS
========================================================= */

shareBtn.onclick =
startScreenShare;


stopShareBtn.onclick =
stopScreenShare;


/* =========================================================
   COPY ROOM
========================================================= */

document
    .getElementById(
        "copyRoomBtn"
    )
    .onclick =
    async () => {

        try{

            await navigator
                .clipboard
                .writeText(
                    roomUrl.value
                );


            alert(
                "Link room berhasil disalin."
            );

        }catch(error){

            roomUrl.select();

            document.execCommand(
                "copy"
            );


            alert(
                "Link room berhasil disalin."
            );

        }

    };


/* =========================================================
   LEAVE
========================================================= */

document
    .getElementById(
        "leaveBtn"
    )
    .onclick =
    () => {

        if(
            !confirm(
                "Keluar dari room?"
            )
        )
            return;


        stopMediaStream();


        if(screenStream){

            stopLocalScreenStream();

        }


        try{

            peer.destroy();

        }catch(error){}


        /*
           Kalau host keluar,
           room akan ikut mati.
        */

        location.href =
            location.pathname;

    };


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(mediaStream){

            mediaStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(screenStream){

            screenStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

if(isHost){

    hostPanel.style.display =
        "block";

}


updateLocalUI();

updateScreenUI();

renderBubbles();

</script>

</body>
</html>
