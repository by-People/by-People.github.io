<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Watch Party P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0b0d10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button,
select,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:58px;
    min-height:58px;
    background:#14171c;
    border-bottom:1px solid #252a31;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    gap:12px;
    z-index:100;
}

.logo{
    font-weight:700;
    font-size:17px;
    white-space:nowrap;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#b7bec8;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.status-dot.online{
    background:#2ecc71;
    box-shadow:0 0 8px rgba(46,204,113,.7);
}

.status-dot.waiting{
    background:#f1c40f;
}

.status-dot.error{
    background:#e74c3c;
}

.top-actions{
    display:flex;
    gap:6px;
}

.small-btn{
    background:#242a32;
    color:#fff;
    padding:7px 10px;
    border-radius:7px;
    font-size:12px;
}

.small-btn:hover{
    background:#303740;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
}

/* =========================
   WATCH STAGE
========================= */

.stage{
    position:relative;
    flex:1;
    min-width:0;
    min-height:0;
    background:#050607;
    overflow:hidden;
}

#screenVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#050607;
}

.empty-screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#69717c;
    text-align:center;
    padding:20px;
    pointer-events:none;
}

.empty-screen .icon{
    font-size:48px;
    opacity:.55;
}

.empty-screen h2{
    margin:0;
    font-size:20px;
    color:#9ba3ad;
}

.empty-screen p{
    margin:0;
    font-size:13px;
    max-width:420px;
}

/* =========================
   CAMERA LAYER
========================= */

#cameraLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:20;
}

/*
  Camera bubble:
  position absolute supaya tetap berada
  di atas screen share bahkan fullscreen.
*/

.camera-bubble{
    position:absolute;
    width:160px;
    height:110px;
    min-width:90px;
    min-height:70px;
    background:#15191f;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
    pointer-events:auto;
    touch-action:none;
    user-select:none;
}

.camera-bubble video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#111;
}

.camera-label{
    position:absolute;
    left:7px;
    bottom:6px;
    padding:3px 6px;
    border-radius:5px;
    background:rgba(0,0,0,.65);
    font-size:11px;
    pointer-events:none;
}

.camera-resize{
    position:absolute;
    right:0;
    bottom:0;
    width:22px;
    height:22px;
    cursor:nwse-resize;
    background:linear-gradient(
        135deg,
        transparent 0 45%,
        rgba(255,255,255,.8) 46% 52%,
        transparent 53%
    );
}

/* =========================
   SCREEN CONTROLS
========================= */

.screen-controls{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    z-index:50;
    pointer-events:none;
}

.screen-controls > *{
    pointer-events:auto;
}

.control-btn{
    background:rgba(20,24,29,.9);
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
    padding:9px 12px;
    border-radius:8px;
    font-size:12px;
    backdrop-filter:blur(8px);
}

.control-btn:hover{
    background:rgba(38,44,51,.95);
}

.control-btn.primary{
    background:#1769e0;
}

.control-btn.primary:hover{
    background:#2879ee;
}

.control-btn.danger{
    background:#b83232;
}

.control-btn.success{
    background:#167d49;
}

.quality-box{
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(20,24,29,.9);
    border:1px solid rgba(255,255,255,.12);
    padding:6px 9px;
    border-radius:8px;
    backdrop-filter:blur(8px);
    font-size:12px;
}

.quality-box select{
    background:#252b33;
    color:#fff;
    border:1px solid #3a424c;
    border-radius:5px;
    padding:4px 6px;
}

/* =========================
   SOUND BUTTON
========================= */

#soundButton{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:80;
    background:#1769e0;
    color:#fff;
    padding:12px 18px;
    border-radius:9px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:310px;
    min-width:310px;
    background:#111419;
    border-left:1px solid #252a31;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.sidebar-section{
    border-bottom:1px solid #252a31;
    padding:12px;
}

.section-title{
    font-size:12px;
    font-weight:700;
    color:#9ca5b0;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:9px;
}

/* =========================
   ROOM
========================= */

.room-row{
    display:flex;
    gap:6px;
}

.room-code{
    flex:1;
    min-width:0;
    background:#1b2027;
    border:1px solid #303740;
    color:#fff;
    padding:8px;
    border-radius:7px;
    font-size:13px;
    text-align:center;
    font-weight:700;
    letter-spacing:1px;
}

/* =========================
   CHAT
========================= */

.chat-section{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:12px;
}

.chat-messages{
    flex:1;
    min-height:100px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:7px;
    padding-right:3px;
}

.chat-message{
    background:#1b2027;
    border-radius:8px;
    padding:7px 9px;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.chat-message.me{
    background:#173b69;
}

.chat-name{
    color:#72a9ff;
    font-size:10px;
    margin-bottom:2px;
    font-weight:700;
}

.chat-input-row{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.chat-input{
    flex:1;
    min-width:0;
    background:#1b2027;
    color:#fff;
    border:1px solid #303740;
    border-radius:7px;
    padding:9px;
    outline:none;
}

.send-btn{
    width:42px;
    border-radius:7px;
    background:#1769e0;
    color:#fff;
}

/* =========================
   USER / PARTICIPANT
========================= */

.user-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#27313c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.user-info{
    min-width:0;
    flex:1;
}

.user-name{
    font-size:13px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.user-role{
    font-size:10px;
    color:#7f8995;
}

/* =========================
   MEDIA CONTROLS
========================= */

.media-buttons{
    display:flex;
    gap:6px;
    margin-top:9px;
}

.media-btn{
    flex:1;
    background:#252b33;
    color:#fff;
    border-radius:7px;
    padding:8px 5px;
    font-size:11px;
}

.media-btn.active{
    background:#1769e0;
}

.media-btn.off{
    background:#8f2e2e;
}

/* =========================
   HOST PANEL
========================= */

.host-panel{
    display:none;
}

.host-panel.visible{
    display:block;
}

.host-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.host-action{
    background:#252b33;
    color:#fff;
    padding:8px 5px;
    border-radius:7px;
    font-size:10px;
}

.host-action:hover{
    background:#303740;
}

.host-action.danger{
    background:#8f2e2e;
}

.host-action.green{
    background:#176c46;
}

.host-action.blue{
    background:#245b99;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#20262d;
    color:#fff;
    border:1px solid #343b44;
    padding:10px 14px;
    border-radius:8px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:9999;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        width:260px;
        min-width:260px;
    }

    .camera-bubble{
        width:130px;
        height:90px;
    }

    .topbar{
        padding:0 8px;
    }

    .logo{
        font-size:14px;
    }

}

@media(max-width:650px){

    .main{
        flex-direction:column;
    }

    .stage{
        flex:1;
        min-height:55vh;
    }

    .sidebar{
        width:100%;
        min-width:0;
        height:45vh;
        border-left:0;
        border-top:1px solid #252a31;
    }

    .chat-section{
        min-height:100px;
    }

    .status{
        display:none;
    }

}
</style>
</head>

<body>

<div id="app">

    <!-- TOP BAR -->
    <div class="topbar">

        <div class="logo">
            🎬 Watch Party
        </div>

        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Menghubungkan...</span>
        </div>

        <div class="top-actions">
            <button class="small-btn" id="copyRoomBtn">
                🔗 Salin Link
            </button>

            <button class="small-btn" id="nameBtn">
                ✏️ Nama
            </button>
        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- WATCH STAGE -->
        <div class="stage" id="stage">

            <video
                id="screenVideo"
                autoplay
                playsinline
            ></video>

            <div class="empty-screen" id="emptyScreen">

                <div class="icon">📺</div>

                <h2>Belum ada screen share</h2>

                <p>
                    Mulai berbagi layar untuk menonton bersama.
                </p>

            </div>

            <!-- CAMERA BUBBLES -->
            <div id="cameraLayer"></div>

            <!-- SCREEN CONTROLS -->
            <div class="screen-controls">

                <div class="quality-box">
                    <span>Quality</span>

                    <select id="qualitySelect">
                        <option value="auto">Auto</option>
                        <option value="720p">720p 30 FPS</option>
                        <option value="1080p">1080p 30 FPS</option>
                        <option value="1080p60">1080p 60 FPS</option>
                    </select>
                </div>

                <button
                    class="control-btn primary"
                    id="startScreenBtn"
                >
                    🖥️ Share Screen
                </button>

                <button
                    class="control-btn danger"
                    id="stopScreenBtn"
                    style="display:none"
                >
                    ⏹ Stop Share
                </button>

                <button
                    class="control-btn"
                    id="fullscreenBtn"
                >
                    ⛶ Fullscreen
                </button>

            </div>

            <button id="soundButton">
                🔊 Aktifkan Suara
            </button>

        </div>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- ROOM -->
            <div class="sidebar-section">

                <div class="section-title">
                    Room
                </div>

                <div class="room-row">

                    <div
                        class="room-code"
                        id="roomCodeDisplay"
                    >
                        ----
                    </div>

                    <button
                        class="small-btn"
                        id="copyCodeBtn"
                    >
                        Salin
                    </button>

                </div>

            </div>

            <!-- CHAT -->
            <div class="chat-section">

                <div class="section-title">
                    Chat
                </div>

                <div
                    class="chat-messages"
                    id="chatMessages"
                ></div>

                <div class="chat-input-row">

                    <input
                        id="chatInput"
                        class="chat-input"
                        placeholder="Tulis pesan..."
                    >

                    <button
                        id="sendChatBtn"
                        class="send-btn"
                    >
                        ➤
                    </button>

                </div>

            </div>

            <!-- USER -->
            <div class="sidebar-section">

                <div class="section-title">
                    Anda
                </div>

                <div class="user-box">

                    <div
                        class="avatar"
                        id="myAvatar"
                    >
                        ?
                    </div>

                    <div class="user-info">

                        <div
                            class="user-name"
                            id="myNameDisplay"
                        >
                            Guest
                        </div>

                        <div
                            class="user-role"
                            id="myRoleDisplay"
                        >
                            Menghubungkan...
                        </div>

                    </div>

                </div>

                <div class="media-buttons">

                    <button
                        class="media-btn"
                        id="micBtn"
                    >
                        🎤 Mic
                    </button>

                    <button
                        class="media-btn"
                        id="cameraBtn"
                    >
                        📷 Kamera
                    </button>

                </div>

            </div>

            <!-- HOST PANEL -->
            <div
                class="sidebar-section host-panel"
                id="hostPanel"
            >

                <div class="section-title">
                    Kontrol Peserta
                </div>

                <div id="participantStatus"
                     style="font-size:11px;color:#8d97a3;margin-bottom:8px;">
                    Menunggu peserta...
                </div>

                <div class="host-grid">

                    <button
                        class="host-action danger"
                        id="hostMicOffBtn"
                    >
                        🔇 Matikan Mic
                    </button>

                    <button
                        class="host-action"
                        id="hostMicLockBtn"
                    >
                        🔒 Kunci Mic
                    </button>

                    <button
                        class="host-action danger"
                        id="hostCamOffBtn"
                    >
                        📷 Matikan Kamera
                    </button>

                    <button
                        class="host-action"
                        id="hostCamLockBtn"
                    >
                        🔒 Kunci Kamera
                    </button>

                    <button
                        class="host-action blue"
                        id="grantScreenBtn"
                    >
                        🖥️ Izinkan Screen
                    </button>

                    <button
                        class="host-action"
                        id="revokeScreenBtn"
                    >
                        🚫 Cabut Screen
                    </button>

                    <button
                        class="host-action danger"
                        id="kickBtn"
                        style="grid-column:1/3"
                    >
                        🚪 Kick Peserta
                    </button>

                </div>

            </div>

        </aside>

    </div>

</div>

<div id="toast"></div>


<script>
/* ============================================================
   WATCH PARTY P2P
   ============================================================ */

/* =========================
   URL / ROOM
========================= */

const params = new URLSearchParams(location.search);

let roomCode = params.get("room");
let hostMode = params.get("host") === "1";

function randomRoomCode(length = 8){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<length;i++){
        result += chars[Math.floor(Math.random()*chars.length)];
    }

    return result;
}

/*
  Jika belum ada room, browser menjadi Host.
*/
if(!roomCode){

    roomCode = randomRoomCode();

    hostMode = true;

    const newUrl =
        location.origin +
        location.pathname +
        "?room=" +
        encodeURIComponent(roomCode) +
        "&host=1";

    history.replaceState({}, "", newUrl);
}

/*
  PeerJS ID stabil berdasarkan room.
  Jadi ketika Host refresh, ia mencoba menggunakan
  ID yang sama lagi.
*/
const peerId =
    "watchparty-" +
    roomCode.toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,32);


/* =========================
   ELEMENTS
========================= */

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");

const emptyScreen =
    document.getElementById("emptyScreen");

const screenVideo =
    document.getElementById("screenVideo");

const soundButton =
    document.getElementById("soundButton");

const cameraLayer =
    document.getElementById("cameraLayer");

const startScreenBtn =
    document.getElementById("startScreenBtn");

const stopScreenBtn =
    document.getElementById("stopScreenBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const qualitySelect =
    document.getElementById("qualitySelect");

const micBtn =
    document.getElementById("micBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const hostPanel =
    document.getElementById("hostPanel");

const participantStatus =
    document.getElementById("participantStatus");

const hostMicOffBtn =
    document.getElementById("hostMicOffBtn");

const hostMicLockBtn =
    document.getElementById("hostMicLockBtn");

const hostCamOffBtn =
    document.getElementById("hostCamOffBtn");

const hostCamLockBtn =
    document.getElementById("hostCamLockBtn");

const grantScreenBtn =
    document.getElementById("grantScreenBtn");

const revokeScreenBtn =
    document.getElementById("revokeScreenBtn");

const kickBtn =
    document.getElementById("kickBtn");

const chatMessages =
    document.getElementById("chatMessages");

const chatInput =
    document.getElementById("chatInput");

const sendChatBtn =
    document.getElementById("sendChatBtn");

const myNameDisplay =
    document.getElementById("myNameDisplay");

const myRoleDisplay =
    document.getElementById("myRoleDisplay");

const myAvatar =
    document.getElementById("myAvatar");


roomCodeDisplay.textContent = roomCode;


/* =========================
   NAME
========================= */

let myName =
    localStorage.getItem("watchparty_name");

if(!myName){

    myName =
        hostMode
            ? "Host"
            : "Guest";

}

function updateMyNameUI(){

    myNameDisplay.textContent = myName;

    myAvatar.textContent =
        myName.charAt(0).toUpperCase();

    myRoleDisplay.textContent =
        hostMode
            ? "Host"
            : "Peserta";

}

updateMyNameUI();


/* =========================
   STATE
========================= */

let peer = null;

let hostConnection = null;

let mediaStream = null;

let screenStream = null;

let screenOwner = null;

let screenPermission = null;

let screenCalls = {};

let mediaCalls = {};

let participantId = null;

let remoteParticipant = null;

let reconnectTimer = null;

let micLocked = false;

let cameraLocked = false;

let micEnabled = false;

let cameraEnabled = false;


/* =========================
   PARTICIPANTS
========================= */

const participants = {};


/* =========================
   TOAST
========================= */

let toastTimer = null;

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{
            el.classList.remove("show");
        },2500);

}


/* =========================
   STATUS
========================= */

function setStatus(
    text,
    type = "waiting"
){

    statusText.textContent = text;

    statusDot.className =
        "status-dot " + type;

}


/* =========================
   PEER INITIALIZATION
========================= */

function createPeer(){

    setStatus(
        hostMode
            ? "Membuat room..."
            : "Menghubungkan ke Host...",
        "waiting"
    );

    peer = new Peer(
        peerId,
        {
            debug:1
        }
    );

    peer.on(
        "open",
        handlePeerOpen
    );

    peer.on(
        "connection",
        handleIncomingConnection
    );

    peer.on(
        "call",
        handleIncomingCall
    );

    peer.on(
        "disconnected",
        ()=>{

            setStatus(
                "Koneksi signaling terputus",
                "error"
            );

            if(!hostMode){

                scheduleGuestReconnect();

            }

        }
    );

    peer.on(
        "close",
        ()=>{

            setStatus(
                "Peer ditutup",
                "error"
            );

        }
    );

    peer.on(
        "error",
        handlePeerError
    );
}


/* =========================
   PEER OPEN
========================= */

function handlePeerOpen(id){

    console.log(
        "Peer opened:",
        id
    );

    if(hostMode){

        setStatus(
            "Room siap",
            "online"
        );

        myRoleDisplay.textContent =
            "Host • Room aktif";

        hostPanel.classList.add(
            "visible"
        );

        /*
          Host tidak perlu connect ke dirinya sendiri.
        */

        ensureLocalMedia();

    }else{

        setStatus(
            "Terhubung ke jaringan",
            "online"
        );

        connectToHost();

        ensureLocalMedia();

    }

}


/* =========================
   PEER ERROR
========================= */

function handlePeerError(error){

    console.error(
        "Peer error:",
        error
    );

    if(
        error &&
        error.type === "unavailable-id"
    ){

        /*
          Biasanya terjadi ketika Host refresh terlalu cepat.
          Peer lama masih dianggap aktif.
        */

        setStatus(
            "Room sedang reconnect...",
            "waiting"
        );

        if(hostMode){

            setTimeout(
                ()=>{
                    try{
                        if(peer){
                            peer.destroy();
                        }
                    }catch(e){}

                    createPeer();

                },
                1800
            );

        }

        return;
    }

    if(
        error &&
        error.type === "peer-unavailable"
    ){

        setStatus(
            "Host belum tersedia...",
            "waiting"
        );

        scheduleGuestReconnect();

        return;
    }

    setStatus(
        "Koneksi error",
        "error"
    );

}


/* =========================
   GUEST CONNECT
========================= */

function connectToHost(){

    if(
        hostMode ||
        !peer ||
        peer.destroyed
    ){
        return;
    }

    try{

        if(
            hostConnection &&
            hostConnection.open
        ){
            return;
        }

        setStatus(
            "Mencari Host...",
            "waiting"
        );

        const conn =
            peer.connect(
                peerId,
                {
                    reliable:true,
                    metadata:{
                        type:"watchparty"
                    }
                }
            );

        hostConnection = conn;

        setupConnection(
            conn,
            true
        );

    }catch(error){

        console.error(error);

        scheduleGuestReconnect();

    }

}


/* =========================
   RECONNECT GUEST
========================= */

function scheduleGuestReconnect(){

    if(hostMode){
        return;
    }

    clearTimeout(
        reconnectTimer
    );

    reconnectTimer =
        setTimeout(
            ()=>{
                if(
                    peer &&
                    !peer.destroyed
                ){
                    connectToHost();
                }
            },
            1800
        );

}


/* =========================
   INCOMING DATA CONNECTION
========================= */

function handleIncomingConnection(
    conn
){

    if(!hostMode){

        return;

    }

    /*
      Hanya 1 peserta.
    */

    if(
        participantId &&
        participantId !== conn.peer
    ){

        conn.on(
            "open",
            ()=>{
                conn.send({
                    type:"kick",
                    reason:"Room hanya mendukung 2 orang."
                });

                setTimeout(
                    ()=>{
                        try{
                            conn.close();
                        }catch(e){}
                    },
                    300
                );

            }
        );

        return;
    }

    participantId =
        conn.peer;

    hostConnection =
        conn;

    setupConnection(
        conn,
        false
    );

}


/* =========================
   DATA CONNECTION SETUP
========================= */

function setupConnection(
    conn,
    isGuestConnection
){

    conn.on(
        "open",
        ()=>{

            console.log(
                "Data connection open:",
                conn.peer
            );

            if(isGuestConnection){

                setStatus(
                    "Terhubung ke Host",
                    "online"
                );

            }else{

                setStatus(
                    "Peserta terhubung",
                    "online"
                );

            }

            sendHello(conn);

            updateParticipantUI();

            /*
              Jika local media sudah siap,
              cek apakah perlu membuat media call.
            */

            setTimeout(
                maybeStartMediaCall,
                500
            );

        }
    );

    conn.on(
        "data",
        data=>{
            handleDataMessage(
                data,
                conn
            );
        }
    );

    conn.on(
        "close",
        ()=>{

            console.log(
                "Data connection closed"
            );

            if(
                conn === hostConnection
            ){

                hostConnection = null;

            }

            if(hostMode){

                participantId = null;

                remoteParticipant = null;

                updateParticipantUI();

                setStatus(
                    "Menunggu peserta...",
                    "waiting"
                );

            }else{

                setStatus(
                    "Host terputus, reconnect...",
                    "waiting"
                );

                scheduleGuestReconnect();

            }

        }
    );

    conn.on(
        "error",
        error=>{
            console.error(
                "Data connection error:",
                error
            );
        }
    );

}

   HELLO
========================= */

function sendHello(conn){

    try{

        conn.send({
            type:"hello",
            id:peer.id,
            name:myName,
            host:hostMode,
            mic:micEnabled,
            camera:cameraEnabled
        });

    }catch(e){}

}


/* =========================
   DATA MESSAGE
========================= */

function handleDataMessage(
    data,
    conn
){

    if(!data || !data.type){
        return;
    }

    switch(data.type){

        case "hello":

            handleHello(data);

            break;


        case "chat":

            addChatMessage(
                data.name,
                data.message,
                false
            );

            break;


        case "hostCommand":

            handleHostCommand(data);

            break;


        case "screenPermission":

            screenPermission =
                data.allowed;

            updateScreenPermissionUI();

            break;


        case "screenStart":

            screenOwner =
                data.owner;

            break;


        case "screenStop":

            if(
                screenOwner === data.owner
            ){

                screenOwner = null;

                clearRemoteScreen();

            }

            break;


        case "kick":

            toast(
                data.reason ||
                "Anda dikeluarkan dari room."
            );

            setTimeout(
                ()=>{
                    location.href =
                        location.origin +
                        location.pathname;
                },
                1500
            );

            break;


        case "name":

            if(remoteParticipant){

                remoteParticipant.name =
                    data.name;

            }

            updateParticipantUI();

            break;

    }

}


/* =========================
   HELLO HANDLER
========================= */

function handleHello(data){

    if(
        data.id === peer.id
    ){
        return;
    }

    remoteParticipant = {

        id:data.id,

        name:data.name ||
            "Guest",

        mic:!!data.mic,

        camera:!!data.camera

    };

    participantId =
        data.id;

    /*
      Host menjadi pemilik kontrol.
    */

    if(hostMode){

        screenPermission =
            data.id;

        sendData({
            type:"screenPermission",
            allowed:false
        });

    }

    updateParticipantUI();

    /*
      Host bisa menginisiasi media.
    */

    setTimeout(
        maybeStartMediaCall,
        300
    );

}


/* =========================
   SEND DATA
========================= */

function sendData(data){

    if(
        hostConnection &&
        hostConnection.open
    ){

        try{

            hostConnection.send(
                data
            );

            return true;

        }catch(e){}

    }

    return false;
}


/* =========================
   LOCAL MEDIA
========================= */

async function ensureLocalMedia(){

    if(mediaStream){
        return;
    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        toast(
            "Browser tidak mendukung kamera/mic."
        );

        return;

    }

    try{

        mediaStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    width:{
                        ideal:1280,
                        max:1920
                    },
                    height:{
                        ideal:720,
                        max:1080
                    },
                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }

            });

    }catch(error){

        console.warn(
            "Combined media failed:",
            error
        );

        /*
          Coba kamera saja.
        */

        try{

            const video =
                await navigator.mediaDevices.getUserMedia({
                    video:true
                });

            const audio =
                await navigator.mediaDevices.getUserMedia({
                    audio:true
                });

            mediaStream =
                new MediaStream([
                    ...video.getVideoTracks(),
                    ...audio.getAudioTracks()
                ]);

        }catch(error2){

            console.error(
                error2
            );

            toast(
                "Kamera/mic tidak dapat diakses."
            );

            return;

        }

    }

    const videoTrack =
        mediaStream.getVideoTracks()[0];

    const audioTrack =
        mediaStream.getAudioTracks()[0];

    cameraEnabled =
        !!videoTrack;

    micEnabled =
        !!audioTrack;

    if(videoTrack){

        videoTrack.enabled =
            cameraEnabled;

    }

    if(audioTrack){

        audioTrack.enabled =
            micEnabled;

    }

    createOrUpdateLocalBubble();

    updateMediaButtons();

    sendHelloIfPossible();

    setTimeout(
        maybeStartMediaCall,
        300
    );

}

   SEND HELLO IF CONNECTED

    }

}


/* =========================
   MEDIA CALL
========================= */

function shouldInitiateMediaCall(){

    if(
        !mediaStream ||
        !participantId
    ){
        return false;
    }

    /*
      Jika belum ada call:
      gunakan ID lebih kecil sebagai initiator.
    */

    if(
        !mediaCalls[participantId]
    ){

        return String(peer.id) <
               String(participantId);

    }

    return false;
}


function maybeStartMediaCall(){

    if(
        !mediaStream ||
        !participantId ||
        !hostConnection ||
        !hostConnection.open
    ){

        return;

    }

    if(
        mediaCalls[participantId]
    ){

        return;

    }

    /*
      Jika salah satu peer belum memiliki stream,
      peer yang punya stream boleh menginisiasi.
    */

    const remoteHasMedia =
        remoteParticipant &&
        (
            remoteParticipant.camera ||
            remoteParticipant.mic
        );

    if(
        remoteHasMedia
    ){

        if(
            !shouldInitiateMediaCall()
        ){
            return;
        }

    }

    startMediaCall(
        participantId
    );

}


function startMediaCall(targetId){

    if(
        !mediaStream ||
        !peer ||
        !targetId
    ){
        return;
    }

    try{

        const call =
            peer.call(
                targetId,
                mediaStream,
                {
                    metadata:{
                        kind:"media",
                        from:peer.id
                    }
                }
            );

        mediaCalls[targetId] =
            call;

        call.on(
            "stream",
            stream=>{
                attachRemoteMedia(
                    targetId,
                    stream
                );
            }
        );

        call.on(
            "close",
            ()=>{
                delete mediaCalls[targetId];
            }
        );

        call.on(
            "error",
            error=>{
                console.error(
                    "Media call error:",
                    error
                );

                delete mediaCalls[targetId];
            }
        );

    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   INCOMING CALL
========================= */

function handleIncomingCall(
    call
){

    const kind =
        call.metadata &&
        call.metadata.kind;

    if(kind === "screen"){

        handleIncomingScreenCall(
            call
        );

        return;
    }

    /*
      Default = media camera/mic
    */

    if(mediaStream){

        call.answer(
            mediaStream
        );

    }else{

        call.answer();

    }

    if(
        call.peer
    ){

        mediaCalls[call.peer] =
            call;

    }

    call.on(
        "stream",
        stream=>{

            attachRemoteMedia(
                call.peer,
                stream
            );

        }
    );

    call.on(
        "close",
        ()=>{
            delete mediaCalls[
                call.peer
            ];
        }
    );

}


/* =========================
   REMOTE MEDIA
========================= */

function attachRemoteMedia(
    id,
    stream
){

    let bubble =
        document.querySelector(
            `[data-peer-id="${CSS.escape(id)}"]`
        );

    if(!bubble){

        bubble =
            createCameraBubble(
                id,
                remoteParticipant
                    ? remoteParticipant.name
                    : "Peserta"
            );

        placeBubble(
            bubble
        );

    }

    const video =
        bubble.querySelector(
            "video"
        );

    if(video.srcObject !== stream){

        video.srcObject =
            stream;

    }

    video.autoplay = true;
    video.playsInline = true;

    video.play().catch(
        ()=>{}
    );

    /*
      Update label.
    */

    const label =
        bubble.querySelector(
            ".camera-label"
        );

    if(label){

        label.textContent =
            remoteParticipant
                ? remoteParticipant.name
                : "Peserta";

    }

}

   LOCAL CAMERA BUBBLE
========================= */

function createOrUpdateLocalBubble(){

    if(!mediaStream){
        return;
    }

    let bubble =
        document.querySelector(

        );

    if(!bubble){

    }

    video.muted = true;

    video.autoplay = true;
    video.playsInline = true;

    video.play().catch(
        ()=>{}
    );

}

========================= */

function createCameraBubble(

    name
){

    const bubble =
        document.createElement("div");

    bubble.className =
        "camera-bubble";

    bubble.dataset.peerId =
        id;

    );

    makeBubbleResizable(
        bubble
    );

/* =========================
   AUTO POSITION BUBBLES
========================= */

function placeBubble(
    bubble
){

    const existing =
        [...cameraLayer.querySelectorAll(
            ".camera-bubble"
        )]
        .filter(
            b => b !== bubble
        );

    const bubbleWidth =
        160;

    const bubbleHeight =
        110;

    const gap =
        10;

    const padding =
        16;

    /*
      Cari posisi horizontal pertama
      yang tidak menindih bubble sebelumnya.
    */

    let x =
        padding;

    let y =
        cameraLayer.clientHeight -
        bubbleHeight -
        padding;

    /*
      Untuk target 2 orang:
      bubble kedua otomatis di sebelah.
    */

    for(
        let i=0;
        i<existing.length;
        i++
    ){

        const candidateX =
            padding +
            (bubbleWidth + gap) * i;

        if(
            candidateX +
            bubbleWidth +
            padding
            <= cameraLayer.clientWidth
        ){

            x =
                candidateX;

            break;

        }

        /*
          Jika baris penuh,
          turun ke baris berikutnya.
        */

        const columns =
            Math.max(
                1,
                Math.floor(
                    (
                        cameraLayer.clientWidth -
                        padding * 2 +
                        gap
                    ) /
                    (
                        bubbleWidth +
                        gap
                    )
                )
            );

        const row =
            Math.floor(
                i / columns
            );

        const column =
            i % columns;

        x =
            padding +
            column *
            (
                bubbleWidth +
                gap
            );

        y =
            cameraLayer.clientHeight -
            bubbleHeight -
            padding -
            row *
            (
                bubbleHeight +
                gap
            );

    }

    bubble.style.width =
        bubbleWidth + "px";

    bubble.style.height =
        bubbleHeight + "px";

    bubble.style.left =
        Math.max(
            0,
            x
        ) + "px";

    bubble.style.top =
        Math.max(
            0,
            y
        ) + "px";

}


/* =========================
   DRAG BUBBLE
========================= */

function makeBubbleDraggable(
    bubble
){

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;

    bubble.addEventListener(
        "pointerdown",
        e=>{

            if(
                e.target.classList.contains(
                    "camera-resize"
                )
            ){
                return;
            }

            dragging = true;

            const rect =
                bubble.getBoundingClientRect();

            const parentRect =
                cameraLayer.getBoundingClientRect();

            offsetX =
                e.clientX -
                rect.left;

            offsetY =
                e.clientY -
                rect.top;

            bubble.setPointerCapture(
                e.pointerId
            );

            e.preventDefault();

        }
    );

    bubble.addEventListener(
        "pointermove",
        e=>{

            if(!dragging){
                return;
            }

            const parentRect =
                cameraLayer.getBoundingClientRect();

            const rect =
                bubble.getBoundingClientRect();

            let x =
                e.clientX -
                parentRect.left -
                offsetX;

            let y =
                e.clientY -
                parentRect.top -
                offsetY;

            const maxX =
                cameraLayer.clientWidth -
                rect.width;

            const maxY =
                cameraLayer.clientHeight -
                rect.height;

            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        maxX
                    )
                );

            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        maxY
                    )
                );

            bubble.style.left =
                x + "px";

            bubble.style.top =
                y + "px";

        }
    );

    bubble.addEventListener(
        "pointerup",
        e=>{
            dragging = false;

            try{
                bubble.releasePointerCapture(
                    e.pointerId
                );
            }catch(err){}
        }
    );

    bubble.addEventListener(
        "pointercancel",
        ()=>{
            dragging = false;
        }
    );

}


/* =========================
   RESIZE BUBBLE
========================= */

function makeBubbleResizable(
    bubble
){

    const handle =
        bubble.querySelector(
            ".camera-resize"
        );

    let resizing = false;

    let startX = 0;

    let startY = 0;

    let startW = 0;

    let startH = 0;

    handle.addEventListener(
        "pointerdown",
        e=>{

            resizing = true;

            startX =
                e.clientX;

            startY =
                e.clientY;

            startW =
                bubble.offsetWidth;

            startH =
                bubble.offsetHeight;

            handle.setPointerCapture(
                e.pointerId
            );

            e.stopPropagation();

            e.preventDefault();

        }
    );

    handle.addEventListener(
        "pointermove",
        e=>{

            if(!resizing){
                return;
            }

            const newW =
                Math.max(
                    90,
                    startW +
                    (
                        e.clientX -
                        startX
                    )
                );

            const newH =
                Math.max(
                    70,
                    startH +
                    (
                        e.clientY -
                        startY
                    )
                );

            bubble.style.width =
                newW + "px";

            bubble.style.height =
                newH + "px";

        }
    );

    handle.addEventListener(
        "pointerup",
        e=>{

            resizing = false;

            try{
                handle.releasePointerCapture(
                    e.pointerId
                );
            }catch(err){}

        }
    );

}

/* =========================
   HOST COMMAND HANDLER
========================= */

function handleHostCommand(data){

    if(data.command === "revokeScreen"){

        if(
            screenOwner === peer.id
        ){

            stopLocalScreenShare(
                false
            );

        }

        screenPermission =
            false;

        updateScreenPermissionUI();

        return;
    }

    if(
        data.target &&
        data.target !== peer.id
    ){

        return;

    }

    if(data.kind === "mic"){

        const track =
            mediaStream &&
            mediaStream.getAudioTracks()[0];

        if(track){

            track.enabled =
                !!data.enabled;

            micEnabled =
                !!data.enabled;

        }

        micLocked =
            !!data.locked;

        updateMediaButtons();

    }


    if(data.kind === "camera"){

        const track =
            mediaStream &&
            mediaStream.getVideoTracks()[0];

        if(track){

            track.enabled =
                !!data.enabled;

            cameraEnabled =
                !!data.enabled;

        }

        cameraLocked =
            !!data.locked;

        updateMediaButtons();

    }

}

/* =========================
   QUALITY
========================= */

function getQualitySettings(){

    const value =
        qualitySelect.value;

    switch(value){

        case "720p":

            return {

                width:1280,

                height:720,

                fps:30,

                bitrate:4000000

            };


        case "1080p":

            return {

                width:1920,

                height:1080,

                fps:30,

                bitrate:7000000

            };


        case "1080p60":

            return {

                width:1920,

                height:1080,

                fps:60,

                bitrate:12000000

            };


        case "auto":

        default:

            return {

                width:1920,

                height:1080,

                fps:60,

                bitrate:10000000

            };

    }

}


/* =========================
   SCREEN SHARE
========================= */

startScreenBtn.addEventListener(
    "click",
    startScreenShare
);


async function startScreenShare(){

    if(screenStream){

        return;

    }

    if(
        !hostMode &&
        screenPermission !== true
    ){

        toast(
            "Host belum memberikan izin screen share."
        );

        return;

    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        toast(
            "Browser tidak mendukung screen sharing."
        );

        return;

    }

    const quality =
        getQualitySettings();

    try{

        /*
          audio:true + systemAudio include
          memungkinkan browser menyediakan
          audio dari tab/window/screen.

          Dukungan tergantung browser/OS.
        */

        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video:{
                    width:{
                        ideal:quality.width,
                        max:quality.width
                    },

                    height:{
                        ideal:quality.height,
                        max:quality.height
                    },

                    frameRate:{
                        ideal:quality.fps,
                        max:quality.fps
                    }
                },

                audio:{
                    suppressLocalAudioPlayback:false
                },

                systemAudio:"include",

                selfBrowserSurface:"exclude",

                surfaceSwitching:"include"

            });

        const videoTrack =
            screenStream.getVideoTracks()[0];

        const audioTrack =
            screenStream.getAudioTracks()[0];

        if(videoTrack){

            /*
              Meminta browser memprioritaskan
              motion/video playback.
            */

            try{
                videoTrack.contentHint =
                    "motion";
            }catch(e){}

            videoTrack.addEventListener(
                "ended",
                ()=>{
                    if(screenStream){
                        stopLocalScreenShare(
                            true
                        );
                    }
                }
            );

        }

        screenOwner =
            peer.id;

        screenVideo.srcObject =
            screenStream;

        /*
          Jangan memutar audio screen lokal
          ke speaker sendiri agar tidak echo.
        */

        screenVideo.muted = true;

        screenVideo.volume = 0;

        emptyScreen.style.display =
            "none";

        stopScreenBtn.style.display =
            "inline-block";

        startScreenBtn.style.display =
            "none";

        screenVideo.play().catch(
            ()=>{}
        );

        if(audioTrack){

            toast(
                "Screen share + audio aktif."
            );

        }else{

            toast(
                "Screen share aktif, tetapi audio tidak tersedia."
            );

        }

        sendData({
            type:"screenStart",
            owner:peer.id,
            hasAudio:!!audioTrack
        });

        await sendScreenToParticipant();

    }catch(error){

        console.error(
            "getDisplayMedia:",
            error
        );

        screenStream = null;

        screenOwner = null;

        if(
            error.name ===
            "NotAllowedError"
        ){

            toast(
                "Screen share dibatalkan."
            );

        }else{

            toast(
                "Gagal memulai screen share."
            );

        }

    }

}


/* =========================
   SEND SCREEN
========================= */

async function sendScreenToParticipant(){

    if(
        !screenStream ||
        !participantId
    ){

        return;

    }

    /*
      Tunggu sebentar supaya data connection
      benar-benar siap.
    */

    if(
        !hostConnection ||
        !hostConnection.open
    ){

        return;

    }

    try{

        const call =
            peer.call(
                participantId,
                screenStream,
                {
                    metadata:{
                        kind:"screen",
                        owner:peer.id,
                        quality:qualitySelect.value
                    }
                }
            );

        screenCalls[participantId] =
            call;

        optimizeScreenCall(
            call
        );

        call.on(
            "close",
            ()=>{
                delete screenCalls[
                    participantId
                ];
            }
        );

        call.on(
            "error",
            error=>{
                console.error(
                    "Screen call error:",
                    error
                );

                delete screenCalls[
                    participantId
                ];

            }
        );

    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   SCREEN CALL OPTIMIZATION
========================= */

function optimizeScreenCall(
    call
){

    try{

        const connection =
            call.peerConnection;

        if(!connection){
            return;
        }

        const senders =
            connection.getSenders();

        const videoSender =
            senders.find(
                sender =>
                    sender.track &&
                    sender.track.kind === "video"
            );

        if(!videoSender){
            return;
        }

        const parameters =
            videoSender.getParameters();

        if(
            !parameters.encodings ||
            !parameters.encodings.length
        ){

            parameters.encodings =
                [{}];

        }

        const quality =
            getQualitySettings();

        parameters.encodings[0]
            .maxBitrate =
            quality.bitrate;

        parameters.encodings[0]
            .maxFramerate =
            quality.fps;

        try{

            parameters.degradationPreference =
                "maintain-framerate";

        }catch(e){}

        videoSender
            .setParameters(
                parameters
            )
            .catch(
                error=>{
                    console.warn(
                        "setParameters:",
                        error
                    );
                }
            );

    }catch(error){

        console.warn(
            "optimizeScreenCall:",
            error
        );

    }

}


/* =========================
   INCOMING SCREEN CALL
========================= */

function handleIncomingScreenCall(
    call
){

    call.answer();

    call.on(
        "stream",
        stream=>{

            showRemoteScreen(
                stream,
                call
            );

        }
    );

    call.on(
        "close",
        ()=>{
            clearRemoteScreen();
        }
    );

    call.on(
        "error",
        error=>{
            console.error(
                "Incoming screen error:",
                error
            );
        }
    );

}


/* =========================
   SHOW REMOTE SCREEN
========================= */

function showRemoteScreen(
    stream,
    call
){

    screenOwner =
        call.metadata &&
        call.metadata.owner
            ? call.metadata.owner
            : call.peer;

    screenVideo.srcObject =
        stream;

    /*
      Remote audio harus ON.
    */

    screenVideo.muted = false;

    screenVideo.volume = 1;

    emptyScreen.style.display =
        "none";

    startScreenBtn.style.display =
        "none";

    stopScreenBtn.style.display =
        "none";

    screenVideo.play()
        .then(
            ()=>{
                soundButton.style.display =
                    "none";
            }
        )
        .catch(
            ()=>{
                /*
                  Autoplay audio mungkin diblokir.
                */

                soundButton.style.display =
                    "block";
            }
        );

}


/* =========================
   SOUND BUTTON
========================= */

soundButton.addEventListener(
    "click",
    ()=>{
        screenVideo.muted =
            false;

        screenVideo.volume =
            1;

        screenVideo.play()
            .then(

            )

);


/* =========================
   STOP SCREEN
========================= */

stopScreenBtn.addEventListener(
    "click",
    ()=>{
        stopLocalScreenShare(
            true
        );
    }
);


function stopLocalScreenShare(
    notifyRemote = true
){

    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{
                    try{
                        track.stop();
                    }catch(e){}
                }
            );

    }

    screenStream = null;

    if(
        screenOwner === peer.id
    ){

        screenOwner =
            null;

    }

    Object.keys(
        screenCalls
    ).forEach(
        id=>{

            try{
                screenCalls[id].close();
            }catch(e){}

            delete screenCalls[id];

        }
    );

    screenVideo.srcObject =
        null;

    screenVideo.muted =
        false;

    screenVideo.volume =
        1;

    emptyScreen.style.display =
        "flex";

    stopScreenBtn.style.display =
        "none";

    startScreenBtn.style.display =
        "inline-block";

    soundButton.style.display =
        "none";

    if(notifyRemote){

        sendData({
            type:"screenStop",
            owner:peer.id
        });

    }

    updateScreenPermissionUI();

}


/* =========================
   CLEAR REMOTE SCREEN
========================= */

function clearRemoteScreen(){

    /*
      Jangan menghapus local screen
      jika kita sedang sharing.
    */

    if(
        screenOwner === peer.id &&
        screenStream
    ){

        return;

    }

    screenVideo.srcObject =
        null;

    screenVideo.muted =
        false;

    screenVideo.volume =
        1;

    emptyScreen.style.display =
        "flex";

    startScreenBtn.style.display =
        "inline-block";

    stopScreenBtn.style.display =
        "none";

    soundButton.style.display =
        "none";

    screenOwner =
        null;

    updateScreenPermissionUI();

}

function sendChat(){

    const message =
        chatInput.value.trim();

    if(!message){
        return;
    }

    addChatMessage(
        myName,
        message,
        true
    );

    sendData({
        type:"chat",
        name:myName,
        message:message
    });

    chatInput.value = "";

}


function addChatMessage(
    name,
    message,
    mine
){

    const item =
        document.createElement("div");

    item.className =
        "chat-message" +
        (
            mine
                ? " me"
                : ""
        );

    item.innerHTML = `

        <div class="chat-name">
            ${escapeHtml(name)}
        </div>

        <div>
            ${escapeHtml(message)}
        </div>

    `;

    chatMessages.appendChild(
        item
    );

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
