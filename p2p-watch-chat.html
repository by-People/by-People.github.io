<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Watch Party P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#080a0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 11px;
    background:#252b34;
    color:#fff;
    cursor:pointer;
    font-size:12px;
}

button:hover{
    background:#343b46;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

input{
    width:100%;
    border:1px solid #363c46;
    background:#171a20;
    color:#fff;
    border-radius:8px;
    padding:9px;
    outline:none;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100%;
    display:flex;
}

/* =====================================================
   STAGE
===================================================== */

.stage{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
    background:#000;
    overflow:hidden;
}

#screenVideo{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

.no-screen{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#858d98;
    text-align:center;

    pointer-events:none;
}

.no-screen.hidden{
    display:none;
}

/* =====================================================
   STAGE CONTROLS
===================================================== */

.stage-controls{
    position:absolute;

    top:12px;
    left:12px;

    z-index:10000;

    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.stage-button{
    background:rgba(20,24,30,.9);
    backdrop-filter:blur(10px);
}

.screen-status{
    position:absolute;

    top:12px;
    right:12px;

    z-index:10000;

    padding:8px 10px;

    border-radius:8px;

    background:rgba(20,24,30,.9);

    color:#b8bec8;

    font-size:11px;
}

/* =====================================================
   BUBBLES
===================================================== */

.bubbles{
    position:absolute;
    inset:0;

    z-index:9000;

    pointer-events:none;
}

.bubble{
    position:absolute;

    left:15px;
    top:15px;

    width:145px;
    height:105px;

    background:#11151a;

    border:2px solid #454d59;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 6px 25px rgba(0,0,0,.55);

    pointer-events:auto;

    touch-action:none;

    user-select:none;
}

.bubble video{
    width:100%;
    height:100%;

    object-fit:cover;

    background:#111;
}

.bubble-name{
    position:absolute;

    left:5px;
    bottom:5px;

    max-width:80%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    padding:4px 6px;

    background:rgba(0,0,0,.65);

    border-radius:5px;

    font-size:10px;
}

.bubble-mic{
    position:absolute;

    right:5px;
    top:5px;

    padding:4px 5px;

    border-radius:5px;

    background:rgba(0,0,0,.7);

    font-size:10px;
}

.bubble-off{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#15181d;

    font-size:28px;
}

.bubble-resize{
    position:absolute;

    right:0;
    bottom:0;

    width:24px;
    height:24px;

    background:rgba(255,255,255,.2);

    border-radius:8px 0 0 0;

    cursor:nwse-resize;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:360px;
    height:100%;

    display:flex;
    flex-direction:column;

    background:#15181e;

    border-left:1px solid #292e36;
}

.header{
    padding:12px;

    border-bottom:1px solid #292e36;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.connection{
    margin-top:4px;

    color:#858d98;

    font-size:11px;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    height:37%;

    min-height:210px;

    display:flex;
    flex-direction:column;

    border-bottom:1px solid #292e36;
}

.section-title{
    padding:9px 12px;

    border-bottom:1px solid #292e36;

    color:#adb4be;

    font-size:12px;

    font-weight:bold;
}

.messages{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:10px;
}

.message{
    margin-bottom:8px;
}

.message-name{
    margin-bottom:3px;

    color:#858e9b;

    font-size:10px;
}

.message-text{
    display:inline-block;

    max-width:92%;

    padding:7px 9px;

    background:#252a32;

    border-radius:8px;

    font-size:12px;

    word-break:break-word;
}

.chat-input{
    display:flex;

    gap:6px;

    padding:8px;

    border-top:1px solid #292e36;
}

.chat-input input{
    flex:1;
}

/* =====================================================
   SIDEBAR SCROLL
===================================================== */

.sidebar-scroll{
    flex:1;

    min-height:0;

    overflow-y:auto;
}

.panel{
    padding:11px 12px;

    border-bottom:1px solid #292e36;
}

.panel-title{
    margin-bottom:7px;

    color:#adb4be;

    font-size:12px;

    font-weight:bold;
}

.name-row,
.room-row{
    display:flex;

    gap:6px;
}

.name-row input,
.room-row input{
    flex:1;

    min-width:0;
}

.room-row input{
    font-size:10px;
}

.controls{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;
}

/* =====================================================
   HOST
===================================================== */

.host-user{
    padding:8px;

    margin-bottom:6px;

    background:#1e2229;

    border-radius:8px;
}

.host-user-name{
    font-size:12px;

    font-weight:bold;
}

.host-user-state{
    margin-top:3px;

    color:#858e9b;

    font-size:10px;
}

.host-actions{
    display:flex;

    gap:4px;

    margin-top:7px;

    flex-wrap:wrap;
}

.host-actions button{
    padding:5px 7px;

    font-size:10px;
}

.kick{
    background:#78262e;
}

.kick:hover{
    background:#a3323c;
}

/* =====================================================
   FULLSCREEN
===================================================== */

.stage.fullscreen{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    z-index:999999;
}

.stage.fullscreen .bubble{
    width:130px;
    height:92px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    html,
    body{
        overflow:auto;
    }

    .app{
        display:block;

        overflow:auto;
    }

    .stage{
        height:58vh;
    }

    .sidebar{
        width:100%;

        height:42vh;

        border-left:0;

        border-top:1px solid #292e36;
    }

    .chat{
        height:42%;

        min-height:180px;
    }

    .bubble{
        width:115px;
        height:84px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         STAGE
    ================================================== -->

    <main
        class="stage"
        id="stage">

        <video
            id="screenVideo"
            autoplay
            playsinline>
        </video>

        <div
            class="no-screen"
            id="noScreen">

            <div>

                <div style="font-size:42px">
                    🎬
                </div>

                <div>
                    Belum ada screen share
                </div>

            </div>

        </div>

        <div class="stage-controls">

            <button
                class="stage-button"
                id="fullscreenBtn">

                ⛶ Fullscreen

            </button>

            <button
                class="stage-button"
                id="shareBtn">

                🖥️ Share Screen

            </button>

            <button
                class="stage-button"
                id="stopShareBtn"
                style="display:none">

                ⛔ Stop Share

            </button>

        </div>

        <div
            class="screen-status"
            id="screenStatus">

            Tidak ada screen share

        </div>

        <div
            class="bubbles"
            id="bubbles">
        </div>

    </main>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="header">

            <div class="title">
                🎬 Watch Party
            </div>

            <div
                class="connection"
                id="connectionStatus">

                Memulai...

            </div>

        </div>


        <!-- CHAT -->

        <div class="chat">

            <div class="section-title">
                💬 Chat
            </div>

            <div
                class="messages"
                id="messages">
            </div>

            <div class="chat-input">

                <input
                    id="chatInput"
                    maxlength="300"
                    placeholder="Tulis pesan...">

                <button
                    id="sendBtn">

                    Kirim

                </button>

            </div>

        </div>


        <div class="sidebar-scroll">


            <!-- IDENTITAS -->

            <div class="panel">

                <div class="panel-title">
                    👤 Identitas
                </div>

                <div class="name-row">

                    <input
                        id="nameInput"
                        maxlength="25">

                    <button
                        id="saveNameBtn">

                        Simpan

                    </button>

                </div>

            </div>


            <!-- CAMERA -->

            <div class="panel">

                <div class="panel-title">
                    🎤 Kamera & Mic
                </div>

                <div class="controls">

                    <button
                        id="cameraBtn">

                        📷 Kamera ON

                    </button>

                    <button
                        id="micBtn">

                        🎤 Mic ON

                    </button>

                    <button
                        id="switchCameraBtn">

                        🔄 Kamera

                    </button>

                    <button
                        id="leaveBtn">

                        🚪 Keluar

                    </button>

                </div>

            </div>


            <!-- ROOM -->

            <div class="panel">

                <div class="panel-title">
                    🔗 Link Room
                </div>

                <div class="room-row">

                    <input
                        id="roomUrl"
                        readonly>

                    <button
                        id="copyRoomBtn">

                        Salin

                    </button>

                </div>

            </div>


            <!-- HOST -->

            <div
                class="panel"
                id="hostPanel"
                style="display:none">

                <div class="panel-title">
                    👑 Kontrol Host
                </div>

                <div
                    style="
                    color:#858e9b;
                    font-size:10px;
                    margin-bottom:8px">

                    Kelola peserta, mic,
                    kamera, screen share
                    dan kick.

                </div>

                <div id="hostUsers"></div>

            </div>

        </div>

    </aside>

</div>


<script>

/* =========================================================
   ROOM / HOST DETECTION
========================================================= */

const urlParams =
    new URLSearchParams(
        location.search
    );

const urlHostId =
    urlParams.get("host");

const savedHostId =
    localStorage.getItem(
        "watchparty_host_id"
    );


/*
   Jika:

   1. Tidak ada host di URL
      -> buat room baru.

   2. Ada host di URL dan
      ID tersebut sama dengan
      host yang tersimpan di browser
      -> browser ini adalah host.

   3. Selain itu
      -> peserta.
*/

let isHost =
    !urlHostId ||
    savedHostId === urlHostId;


let hostPeerId =
    urlHostId || null;


/* =========================================================
   PEER
========================================================= */

const peer =
    new Peer({
        debug:1
    });


/* =========================================================
   STATE
========================================================= */

let myName =
    localStorage.getItem(
        "watchparty_name"
    ) ||
    (
        "User-" +
        Math.floor(
            1000 +
            Math.random()*8999
        )
    );


let cameraEnabled =
    false;

let micEnabled =
    false;

let mediaStream =
    null;

let cameraFacing =
    "user";


let screenStream =
    null;

let screenOwner =
    null;

let screenPermission =
    null;


/*
   Data connection hanya ke host.
*/

let hostConnection =
    null;


/*
   Media connection:

   1 koneksi webcam/mic
   per pasangan.
*/

const mediaCalls =
    {};


/*
   Screen calls.
*/

const screenCalls =
    {};


/*
   Peserta.
*/

const participants =
    {};


/*
   Menyimpan ID call yang
   sedang dibuat supaya tidak
   double-call.
*/

const mediaCallPending =
    {};


/* =========================================================
   ELEMENTS
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const screenVideo =
    document.getElementById(
        "screenVideo"
    );

const noScreen =
    document.getElementById(
        "noScreen"
    );

const bubbles =
    document.getElementById(
        "bubbles"
    );

const messages =
    document.getElementById(
        "messages"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const roomUrl =
    document.getElementById(
        "roomUrl"
    );

const hostPanel =
    document.getElementById(
        "hostPanel"
    );

const hostUsers =
    document.getElementById(
        "hostUsers"
    );

const shareBtn =
    document.getElementById(
        "shareBtn"
    );

const stopShareBtn =
    document.getElementById(
        "stopShareBtn"
    );

const cameraBtn =
    document.getElementById(
        "cameraBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


nameInput.value =
    myName;


/* =========================================================
   SELF PARTICIPANT
========================================================= */

function createSelf(){

    participants[
        peer.id
    ] = {

        id:
            peer.id,

        name:
            myName,

        camera:
            cameraEnabled,

        mic:
            micEnabled,

        media:
            cameraEnabled ||
            micEnabled,

        cameraLocked:
            false,

        micLocked:
            false,

        isHost:
            isHost,

        connected:
            true

    };

}


/* =========================================================
   PEER OPEN
========================================================= */

peer.on(
    "open",
    id => {

        console.log(
            "Peer ID:",
            id
        );


        createSelf();


        /*
           HOST
        */

        if(isHost){

            hostPeerId =
                id;


            screenPermission =
                id;


            localStorage.setItem(
                "watchparty_host_id",
                id
            );


            const newUrl =
                location.origin +
                location.pathname +
                "?host=" +
                encodeURIComponent(
                    id
                );


            history.replaceState(
                {},
                "",
                newUrl
            );


            roomUrl.value =
                newUrl;


            hostPanel.style.display =
                "block";


            connectionStatus.textContent =
                "👑 Host • Online";


            updateScreenUI();


            updateHostUsers();


        }else{

            roomUrl.value =
                location.href;


            connectionStatus.textContent =
                "🔄 Menghubungkan ke host...";


            connectToHost();

        }


        renderBubbles();

    }
);


/* =========================================================
   PEER ERROR
========================================================= */

peer.on(
    "error",
    error => {

        console.error(
            "PeerJS error:",
            error
        );


        if(
            error.type ===
            "peer-unavailable"
        ){

            connectionStatus.textContent =
                "🔴 Host tidak ditemukan";


            alert(
                "Host tidak ditemukan.\n\n" +
                "Pastikan host masih membuka room dan gunakan link terbaru."
            );


            return;

        }


        if(
            error.type ===
            "browser-incompatible"
        ){

            connectionStatus.textContent =
                "❌ Browser tidak mendukung WebRTC";


            return;

        }


        connectionStatus.textContent =
            "⚠️ " +
            error.type;

    }
);


/* =========================================================
   PEER DISCONNECTED
========================================================= */

peer.on(
    "disconnected",
    () => {

        connectionStatus.textContent =
            "🟠 Terputus dari PeerServer";

    }
);


/* =========================================================
   CONNECT TO HOST
========================================================= */

function connectToHost(){

    if(
        !hostPeerId
    ){

        connectionStatus.textContent =
            "❌ Host ID tidak ada";

        return;

    }


    hostConnection =
        peer.connect(
            hostPeerId,
            {
                reliable:true,

                metadata:{
                    type:"hostConnection"
                }
            }
        );


    setupHostConnection(
        hostConnection
    );

}


/* =========================================================
   INCOMING DATA CONNECTION
========================================================= */

peer.on(
    "connection",
    conn => {

        /*
           Hanya host yang menerima
           koneksi peserta.
        */

        if(!isHost){

            conn.close();

            return;

        }


        setupGuestConnection(
            conn
        );

    }
);


/* =========================================================
   HOST CONNECTION
========================================================= */

function setupHostConnection(
    conn
){

    conn.on(
        "open",
        () => {

            connectionStatus.textContent =
                "🟢 Terhubung ke host";


            sendHello(
                conn
            );

        }
    );


    conn.on(
        "data",
        data => {

            handleData(
                conn.peer,
                data
            );

        }
    );


    conn.on(
        "close",
        () => {

            if(
                !isHost &&
                conn ===
                    hostConnection
            ){

                connectionStatus.textContent =
                    "🔴 Host terputus";

            }

        }
    );


    conn.on(
        "error",
        error => {

            console.warn(
                "Host connection:",
                error
            );

        }
    );

}


/* =========================================================
   GUEST CONNECTION AT HOST
========================================================= */

function setupGuestConnection(
    conn
){

    hostConnection =
        conn;


    conn.on(
        "open",
        () => {

            console.log(
                "Guest connected:",
                conn.peer
            );


            /*
               Host menunggu hello.
            */

        }
    );


    conn.on(
        "data",
        data => {

            handleData(
                conn.peer,
                data
            );

        }
    );


    conn.on(
        "close",
        () => {

            removeParticipant(
                conn.peer
            );

        }
    );


    conn.on(
        "error",
        error => {

            console.warn(
                "Guest connection:",
                error
            );

        }
    );

}


/* =========================================================
   HELLO
========================================================= */

function sendHello(
    conn
){

    sendData(
        conn,
        {

            type:"hello",

            id:
                peer.id,

            name:
                myName,

            camera:
                cameraEnabled,

            mic:
                micEnabled,

            media:
                cameraEnabled ||
                micEnabled,

            isHost:
                isHost

        }
    );

}


/* =========================================================
   DATA SEND
========================================================= */

function sendData(
    conn,
    data
){

    if(
        !conn ||
        !conn.open
    ){

        return false;

    }


    try{

        conn.send(
            data
        );

        return true;

    }catch(error){

        console.warn(
            "Send failed:",
            error
        );

        return false;

    }

}


/* =========================================================
   BROADCAST TO ALL GUESTS
========================================================= */

function broadcastGuests(
    data,
    exclude=null
){

    if(!isHost)
        return;


    Object.keys(
        participants
    ).forEach(
        id => {

            if(
                id ===
                peer.id
            )
                return;


            if(
                id ===
                exclude
            )
                return;


            const user =
                participants[id];


            if(
                !user.connected
            )
                return;


            /*
               Host connection disimpan
               secara sederhana di
               peer.connections.
            */

            const list =
                peer.connections[id] ||
                [];


            const conn =
                list[0];


            if(conn){

                sendData(
                    conn,
                    data
                );

            }

        }
    );

}


/* =========================================================
   GET HOST CONNECTION TO USER
========================================================= */

function getConnection(
    id
){

    if(
        id ===
        peer.id
    )
        return null;


    const list =
        peer.connections[id];


    if(
        list &&
        list.length
    ){

        for(
            const conn
            of list
        ){

            if(
                conn.open
            ){

                return conn;

            }

        }

    }


    return null;

}


/* =========================================================
   HANDLE DATA
========================================================= */

function handleData(
    from,
    data
){

    if(
        !data ||
        !data.type
    )
        return;


    /* ==============================================
       HELLO
    ============================================== */

    if(
        data.type ===
        "hello"
    ){

        if(!isHost)
            return;


        participants[from] = {

            id:
                from,

            name:
                data.name ||
                "User",

            camera:
                !!data.camera,

            mic:
                !!data.mic,

            media:
                !!data.media,

            cameraLocked:
                false,

            micLocked:
                false,

            isHost:
                false,

            connected:
                true

        };


        /*
           Kirim roster lengkap
           ke peserta baru.
        */

        sendRoster(
            from
        );


        /*
           Update semua peserta lain.
        */

        broadcastRoster(
            from
        );


        updateHostUsers();

        renderBubbles();

        return;

    }


    /* ==============================================
       ROSTER
    ============================================== */

    if(
        data.type ===
        "roster"
    ){

        if(isHost)
            return;


        Object.keys(
            participants
        ).forEach(
            id => {

                if(
                    id !==
                    peer.id
                ){

                    delete participants[id];

                }

            }
        );


        data.users.forEach(
            user => {

                participants[
                    user.id
                ] = {

                    ...user,

                    connected:true

                };

            }
        );


        renderBubbles();

        updateScreenUI();


        /*
           Setelah roster diterima,
           coba membuat koneksi media
           yang diperlukan.
        */

        setTimeout(
            () => {

                maybeStartAllMediaCalls();

            },
            300
        );


        return;

    }


    /* ==============================================
       MEDIA STATE
    ============================================== */

    if(
        data.type ===
        "mediaState"
    ){

        if(
            !participants[from]
        ){

            participants[from] = {

                id:
                    from,

                name:
                    "User",

                camera:false,

                mic:false,

                media:false,

                connected:true

            };

        }


        participants[from].camera =
            !!data.camera;


        participants[from].mic =
            !!data.mic;


        participants[from].media =
            !!data.media;


        renderBubbles();


        /*
           Kalau host menerima
           update peserta,
           teruskan ke semua.
        */

        if(isHost){

            broadcastGuests(
                data,
                from
            );

        }


        /*
           Coba membentuk media
           connection jika diperlukan.
        */

        setTimeout(
            () => {

                maybeStartMediaCall(
                    from
                );

            },
            100
        );


        return;

    }


    /* ==============================================
       NAME
    ============================================== */

    if(
        data.type ===
        "name"
    ){

        if(
            participants[from]
        ){

            participants[from].name =
                data.name;

        }


        if(isHost){

            broadcastGuests(
                data,
                from
            );

        }


        renderBubbles();

        updateHostUsers();

        return;

    }


    /* ==============================================
       CHAT
    ============================================== */

    if(
        data.type ===
        "chat"
    ){

        addMessage(
            data.name ||
            "User",

            data.text ||
            ""
        );


        if(isHost){

            broadcastGuests(
                data,
                from
            );

        }


        return;

    }


    /* ==============================================
       PERMISSION
    ============================================== */

    if(
        data.type ===
        "screenPermission"
    ){

        screenPermission =
            data.permission ||
            null;


        updateScreenUI();

        updateHostUsers();

        return;

    }


    /* ==============================================
       SCREEN START
    ============================================== */

    if(
        data.type ===
        "screenStart"
    ){

        if(isHost){

            /*
               Hanya pemegang izin
               yang boleh mulai.
            */

            if(
                from !==
                screenPermission
            ){

                return;

            }


            if(
                screenOwner &&
                screenOwner !==
                    from
            ){

                return;

            }


            screenOwner =
                from;


            broadcastGuests({

                type:
                    "screenOwner",

                owner:
                    screenOwner

            });

        }else{

            screenOwner =
                data.owner ||
                from;

        }


        updateScreenUI();

        return;

    }


    /* ==============================================
       SCREEN OWNER
    ============================================== */

    if(
        data.type ===
        "screenOwner"
    ){

        screenOwner =
            data.owner ||
            null;


        updateScreenUI();

        return;

    }


    /* ==============================================
       SCREEN STOP
    ============================================== */

    if(
        data.type ===
        "screenStop"
    ){

        if(isHost){

            if(
                from !==
                screenOwner
            ){

                return;

            }


            screenOwner =
                null;


            broadcastGuests({

                type:
                    "screenOwner",

                owner:
                    null

            });

        }else{

            if(
                screenOwner ===
                from
            ){

                screenOwner =
                    null;

            }

        }


        clearRemoteScreen();

        return;

    }


    /* ==============================================
       HOST COMMAND
    ============================================== */

    if(
        data.type ===
        "hostCommand"
    ){

        handleHostCommand(
            data
        );

        return;

    }


    /* ==============================================
       KICK
    ============================================== */

    if(
        data.type ===
        "kick"
    ){

        if(
            data.target ===
            peer.id
        ){

            kickedOut();

            return;

        }


        removeParticipant(
            data.target
        );


        return;

    }

}


/* =========================================================
   SEND ROSTER
========================================================= */

function sendRoster(
    targetId
){

    const conn =
        getConnection(
            targetId
        );


    if(!conn)
        return;


    const users =
        Object.values(
            participants
        )
        .map(
            user => ({

                id:
                    user.id,

                name:
                    user.name,

                camera:
                    !!user.camera,

                mic:
                    !!user.mic,

                media:
                    !!user.media,

                cameraLocked:
                    !!user.cameraLocked,

                micLocked:
                    !!user.micLocked,

                isHost:
                    !!user.isHost

            })
        );


    sendData(
        conn,
        {

            type:"roster",

            users:users,

            screenPermission:
                screenPermission,

            screenOwner:
                screenOwner

        }
    );


    /*
       permission juga dikirim
       terpisah supaya state
       langsung diproses.
    */

    sendData(
        conn,
        {

            type:
                "screenPermission",

            permission:
                screenPermission

        }
    );


    sendData(
        conn,
        {

            type:
                "screenOwner",

            owner:
                screenOwner

        }
    );

}


/* =========================================================
   BROADCAST ROSTER
========================================================= */

function broadcastRoster(
    exclude
){

    if(!isHost)
        return;


    Object.keys(
        participants
    ).forEach(
        id => {

            if(
                id ===
                peer.id
            )
                return;


            if(
                id ===
                exclude
            )
                return;


            sendRoster(
                id
            );

        }
    );

}


/* =========================================================
   MEDIA STREAM
========================================================= */

/*
   Kita sengaja menggunakan satu stream
   yang berisi video + audio.

   Track video/audio bisa diaktifkan
   secara independen.

   Ini membuat koneksi media tetap
   satu per pasangan dan tidak
   membuat peer.call berulang-ulang.
*/

async function createMediaStream(){

    if(mediaStream){

        return mediaStream;

    }


    try{

        mediaStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:{
                    echoCancellation:true,

                    noiseSuppression:true,

                    autoGainControl:true
                }

            });


        /*
           Sesuaikan track dengan
           state saat ini.
        */

        const videoTrack =
            mediaStream
            .getVideoTracks()[0];


        const audioTrack =
            mediaStream
            .getAudioTracks()[0];


        if(videoTrack){

            videoTrack.enabled =
                cameraEnabled;

        }


        if(audioTrack){

            audioTrack.enabled =
                micEnabled;

        }


        return mediaStream;

    }catch(error){

        console.error(
            "getUserMedia:",
            error
        );


        mediaStream =
            null;


        let message =
            "Tidak bisa mengakses kamera/microphone.";


        if(
            error.name ===
            "NotAllowedError"
        ){

            message =
                "Izin kamera/microphone ditolak.\n\n" +
                "Izinkan Camera dan Microphone untuk website ini.";

        }else if(
            error.name ===
            "NotFoundError"
        ){

            message =
                "Kamera atau microphone tidak ditemukan.";

        }else if(
            error.name ===
            "NotReadableError"
        ){

            message =
                "Kamera/microphone sedang digunakan aplikasi lain.";

        }else if(
            error.name ===
            "OverconstrainedError"
        ){

            message =
                "Kamera tidak cocok dengan pengaturan yang diminta.";

        }


        alert(
            message
        );


        return null;

    }

}


/* =========================================================
   ENABLE CAMERA
========================================================= */

async function enableCamera(){

    if(
        !isHost &&
        participants[peer.id]
        ?.cameraLocked
    ){

        alert(
            "Host sedang memblokir kamera kamu."
        );

        return;

    }


    cameraEnabled =
        true;


    /*
       Pastikan stream tersedia.
    */

    const stream =
        await createMediaStream();


    if(!stream){

        cameraEnabled =
            false;

        updateLocalUI();

        return;

    }


    const videoTrack =
        stream
        .getVideoTracks()[0];


    if(videoTrack){

        videoTrack.enabled =
            true;

    }


    updateLocalState();

    updateLocalUI();

    announceMediaState();

    maybeStartAllMediaCalls();

}


/* =========================================================
   DISABLE CAMERA
========================================================= */

function disableCamera(){

    cameraEnabled =
        false;


    if(mediaStream){

        const videoTrack =
            mediaStream
            .getVideoTracks()[0];


        if(videoTrack){

            videoTrack.enabled =
                false;

        }

    }


    updateLocalState();

    updateLocalUI();

    announceMediaState();

    /*
       Jika mic juga OFF,
       stream tidak dibutuhkan lagi.
    */

    if(
        !cameraEnabled &&
        !micEnabled
    ){

        stopMediaStream();

    }

}


/* =========================================================
   ENABLE MIC
========================================================= */

async function enableMic(){

    if(
        !isHost &&
        participants[peer.id]
        ?.micLocked
    ){

        alert(
            "Host sedang memblokir microphone kamu."
        );

        return;

    }


    micEnabled =
        true;


    const stream =
        await createMediaStream();


    if(!stream){

        micEnabled =
            false;

        updateLocalUI();

        return;

    }


    const audioTrack =
        stream
        .getAudioTracks()[0];


    if(audioTrack){

        audioTrack.enabled =
            true;

    }


    updateLocalState();

    updateLocalUI();

    announceMediaState();

    maybeStartAllMediaCalls();

}


/* =========================================================
   DISABLE MIC
========================================================= */

function disableMic(){

    micEnabled =
        false;


    if(mediaStream){

        const audioTrack =
            mediaStream
            .getAudioTracks()[0];


        if(audioTrack){

            audioTrack.enabled =
                false;

        }

    }


    updateLocalState();

    updateLocalUI();

    announceMediaState();


    if(
        !cameraEnabled &&
        !micEnabled
    ){

        stopMediaStream();

    }

}


/* =========================================================
   STOP MEDIA STREAM
========================================================= */

function stopMediaStream(){

    if(mediaStream){

        mediaStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    mediaStream =
        null;


    /*
       Tutup koneksi media
       yang kita buat.
    */

    Object.keys(
        mediaCalls
    ).forEach(
        id => {

            try{

                mediaCalls[id]
                    .close();

            }catch(error){}


            delete mediaCalls[id];

            delete mediaCallPending[id];

        }
    );


    renderBubbles();

}


/* =========================================================
   UPDATE LOCAL STATE
========================================================= */

function updateLocalState(){

    if(
        !participants[peer.id]
    ){

        createSelf();

    }


    participants[
        peer.id
    ].camera =
        cameraEnabled;


    participants[
        peer.id
    ].mic =
        micEnabled;


    participants[
        peer.id
    ].media =
        cameraEnabled ||
        micEnabled;


    renderBubbles();

    updateHostUsers();

}


/* =========================================================
   ANNOUNCE MEDIA STATE
========================================================= */

function announceMediaState(){

    updateLocalState();


    const data = {

        type:
            "mediaState",

        camera:
            cameraEnabled,

        mic:
            micEnabled,

        media:
            cameraEnabled ||
            micEnabled

    };


    if(isHost){

        broadcastGuests(
            data
        );

    }else{

        sendData(
            hostConnection,
            data
        );

    }

}


/* =========================================================
   MEDIA CALL DECISION
========================================================= */

function shouldInitiateMedia(
    targetId
){

    if(
        !mediaStream
    ){

        return false;

    }


    const target =
        participants[
            targetId
        ];


    if(!target)
        return false;


    /*
       Jika target tidak memiliki
       media aktif, siapa pun yang
       punya stream boleh mengirim
       one-way media.

       Jika keduanya aktif,
       ID yang lebih kecil menjadi
       initiator.

       Ini mencegah dua peer
       melakukan peer.call()
       bersamaan.
    */

    if(
        !target.media
    ){

        return true;

    }


    return (
        String(peer.id) <
        String(targetId)
    );

}


/* =========================================================
   START MEDIA CALL
========================================================= */

function maybeStartMediaCall(
    targetId
){

    if(
        !mediaStream
    )
        return;


    if(
        targetId ===
        peer.id
    )
        return;


    if(
        !participants[targetId]
    )
        return;


    /*
       Sudah ada call aktif.
    */

    if(
        mediaCalls[targetId]
    ){

        if(
            mediaCalls[targetId].open
        ){

            return;

        }

    }


    /*
       Sedang membuat call.
    */

    if(
        mediaCallPending[targetId]
    ){

        return;

    }


    if(
        !shouldInitiateMedia(
            targetId
        )
    ){

        return;

    }


    mediaCallPending[targetId] =
        true;


    console.log(
        "Starting media call:",
        targetId
    );


    try{

        const call =
            peer.call(
                targetId,
                mediaStream,
                {

                    metadata:{
                        kind:
                            "media",

                        from:
                            peer.id
                    }

                }
            );


        mediaCalls[targetId] =
            call;


        call.on(
            "stream",
            stream => {

                attachRemoteMedia(
                    targetId,
                    stream
                );

            }
        );


        call.on(
            "close",
            () => {

                if(
                    mediaCalls[targetId] ===
                    call
                ){

                    delete mediaCalls[
                        targetId
                    ];

                }


                mediaCallPending[
                    targetId
                ] = false;


                /*
                   Coba lagi kalau
                   kita memang initiator.
                */

                setTimeout(
                    () => {

                        maybeStartMediaCall(
                            targetId
                        );

                    },
                    1000
                );

            }
        );


        call.on(
            "error",
            error => {

                console.warn(
                    "Media call:",
                    error
                );


                if(
                    mediaCalls[targetId] ===
                    call
                ){

                    delete mediaCalls[
                        targetId
                    ];

                }


                mediaCallPending[
                    targetId
                ] = false;

            }
        );


        setTimeout(
            () => {

                mediaCallPending[
                    targetId
                ] = false;

            },
            5000
        );


    }catch(error){

        console.error(
            "peer.call:",
            error
        );


        mediaCallPending[
            targetId
        ] = false;

    }

}


/* =========================================================
   START ALL MEDIA CALLS
========================================================= */

function maybeStartAllMediaCalls(){

    if(
        !mediaStream
    )
        return;


    Object.keys(
        participants
    ).forEach(
        id => {

            if(
                id ===
                peer.id
            )
                return;


            maybeStartMediaCall(
                id
            );

        }
    );

}


/* =========================================================
   INCOMING MEDIA / SCREEN CALL
========================================================= */

peer.on(
    "call",
    call => {

        const kind =
            call.metadata
            ?.kind;


        /* ==============================================
           MEDIA
        ============================================== */

        if(
            kind ===
            "media"
        ){

            handleIncomingMediaCall(
                call
            );

            return;

        }


        /* ==============================================
           SCREEN
        ============================================== */

        if(
            kind ===
            "screen"
        ){

            handleIncomingScreenCall(
                call
            );

            return;

        }

    }
);


/* =========================================================
   INCOMING MEDIA CALL
========================================================= */

function handleIncomingMediaCall(
    call
){

    const id =
        call.peer;


    const remote =
        participants[
            id
        ];


    /*
       Jika dua-duanya aktif,
       hanya ID lebih kecil yang
       boleh menjadi caller.
    */

    if(
        remote &&
        remote.media &&
        mediaStream &&
        String(id) >
        String(peer.id)
    ){

        /*
           Caller seharusnya peer
           dengan ID lebih kecil.

           Tolak call dari ID lebih
           besar untuk mencegah
           duplicate.
        */

        try{

            call.close();

        }catch(error){}


        return;

    }


    /*
       Kalau sudah punya call,
       jangan membuat duplicate.
    */

    if(
        mediaCalls[id]
    ){

        try{

            call.close();

        }catch(error){}


        return;

    }


    mediaCalls[id] =
        call;


    /*
       Jawab dengan stream kita
       jika ada.

       Kalau tidak ada,
       menjadi one-way call.
    */

    try{

        call.answer(
            mediaStream ||
            undefined
        );

    }catch(error){

        console.error(
            "answer media:",
            error
        );

        return;

    }


    call.on(
        "stream",
        stream => {

            attachRemoteMedia(
                id,
                stream
            );

        }
    );


    call.on(
        "close",
        () => {

            if(
                mediaCalls[id] ===
                call
            ){

                delete mediaCalls[id];

            }


            const bubble =
                document.getElementById(
                    "bubble-" +
                    id
                );


            if(bubble){

                const video =
                    bubble.querySelector(
                        "video"
                    );


                if(video){

                    video.srcObject =
                        null;

                }

            }


            setTimeout(
                () => {

                    maybeStartMediaCall(
                        id
                    );

                },
                1000
            );

        }
    );


    call.on(
        "error",
        error => {

            console.warn(
                "Incoming media:",
                error
            );

        }
    );

}


/* =========================================================
   ATTACH REMOTE MEDIA
========================================================= */

function attachRemoteMedia(
    id,
    stream
){

    let bubble =
        document.getElementById(
            "bubble-" +
            id
        );


    if(!bubble){

        bubble =
            createBubble(
                id
            );


        bubbles.appendChild(
            bubble
        );


        enableBubbleDrag(
            bubble
        );


        enableBubbleResize(
            bubble
        );

    }


    const video =
        bubble.querySelector(
            "video"
        );


    video.srcObject =
        stream;


    video.muted =
        false;


    video.play()
        .catch(
            error => {

                console.warn(
                    "Autoplay:",
                    error
                );

            }
        );


    const off =
        bubble.querySelector(
            ".bubble-off"
        );


    off.style.display =
        "none";

}


/* =========================================================
   CREATE BUBBLE
========================================================= */

function createBubble(
    id
){

    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.id =
        "bubble-" +
        id;


    const index =
        Math.max(
            0,
            Object.keys(
                participants
            ).indexOf(id)
        );


    bubble.style.left =
        (
            15 +
            (index % 4) * 155
        ) +
        "px";


    bubble.style.top =
        (
            15 +
            Math.floor(
                index / 4
            ) * 115
        ) +
        "px";


    const video =
        document.createElement(
            "video"
        );


    video.autoplay =
        true;

    video.playsInline =
        true;


    const off =
        document.createElement(
            "div"
        );


    off.className =
        "bubble-off";


    off.textContent =
        "📷";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "bubble-name";


    const mic =
        document.createElement(
            "div"
        );


    mic.className =
        "bubble-mic";


    const resize =
        document.createElement(
            "div"
        );


    resize.className =
        "bubble-resize";


    bubble.appendChild(
        video
    );

    bubble.appendChild(
        off
    );

    bubble.appendChild(
        name
    );

    bubble.appendChild(
        mic
    );

    bubble.appendChild(
        resize
    );


    return bubble;

}


/* =========================================================
   RENDER BUBBLES
========================================================= */

function renderBubbles(){

    Object.keys(
        participants
    ).forEach(
        id => {

            const user =
                participants[id];


            let bubble =
                document.getElementById(
                    "bubble-" +
                    id
                );


            if(!bubble){

                bubble =
                    createBubble(
                        id
                    );


                bubbles.appendChild(
                    bubble
                );


                enableBubbleDrag(
                    bubble
                );


                enableBubbleResize(
                    bubble
                );

            }


            const video =
                bubble.querySelector(
                    "video"
                );


            const off =
                bubble.querySelector(
                    ".bubble-off"
                );


            const name =
                bubble.querySelector(
                    ".bubble-name"
                );


            const mic =
                bubble.querySelector(
                    ".bubble-mic"
                );


            name.textContent =
                user.name ||
                "User";


            mic.textContent =
                user.mic
                ? "🎤"
                : "🔇";


            /*
               SELF
            */

            if(
                id ===
                peer.id
            ){

                if(
                    mediaStream &&
                    cameraEnabled
                ){

                    video.srcObject =
                        mediaStream;


                    video.muted =
                        true;


                    off.style.display =
                        "none";

                }else{

                    video.srcObject =
                        null;


                    off.style.display =
                        "flex";

                }


                return;

            }


            /*
               REMOTE
            */

            if(
                user.camera
            ){

                /*
                   Jangan menimpa
                   remote stream yang
                   sudah terpasang.

                   Hanya tampilkan
                   placeholder jika
                   belum ada stream.
                */

                if(
                    !video.srcObject
                ){

                    off.style.display =
                        "flex";

                }

            }else{

                /*
                   Kamera remote OFF.
                */

                off.style.display =
                    "flex";

            }

        }
    );


    /*
       Hapus bubble peserta
       yang sudah keluar.
    */

    [
        ...bubbles.children
    ].forEach(
        bubble => {

            const id =
                bubble.id.replace(
                    "bubble-",
                    ""
                );


            if(
                !participants[id]
            ){

                bubble.remove();

            }

        }
    );

}


/* =========================================================
   DRAG BUBBLE
========================================================= */

function enableBubbleDrag(
    bubble
){

    let dragging =
        false;

    let startX =
        0;

    let startY =
        0;

    let startLeft =
        0;

    let startTop =
        0;


    bubble.addEventListener(
        "pointerdown",
        event => {

            if(
                event.target
                    .classList
                    .contains(
                        "bubble-resize"
                    )
            ){

                return;

            }


            dragging =
                true;


            bubble.setPointerCapture(
                event.pointerId
            );


            const rect =
                bubble.getBoundingClientRect();


            const stageRect =
                stage.getBoundingClientRect();


            startX =
                event.clientX;

            startY =
                event.clientY;


            startLeft =
                rect.left -
                stageRect.left;


            startTop =
                rect.top -
                stageRect.top;

        }
    );


    bubble.addEventListener(
        "pointermove",
        event => {

            if(!dragging)
                return;


            const stageRect =
                stage.getBoundingClientRect();


            let left =
                startLeft +
                event.clientX -
                startX;


            let top =
                startTop +
                event.clientY -
                startY;


            const maxLeft =
                Math.max(
                    0,
                    stageRect.width -
                    bubble.offsetWidth
                );


            const maxTop =
                Math.max(
                    0,
                    stageRect.height -
                    bubble.offsetHeight
                );


            left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        maxLeft
                    )
                );


            top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        maxTop
                    )
                );


            bubble.style.left =
                left +
                "px";


            bubble.style.top =
                top +
                "px";

        }
    );


    bubble.addEventListener(
        "pointerup",
        event => {

            dragging =
                false;


            try{

                bubble.releasePointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );

}


/* =========================================================
   RESIZE BUBBLE
========================================================= */

function enableBubbleResize(
    bubble
){

    const handle =
        bubble.querySelector(
            ".bubble-resize"
        );


    let resizing =
        false;

    let startX =
        0;

    let startWidth =
        0;


    handle.addEventListener(
        "pointerdown",
        event => {

            event.stopPropagation();


            resizing =
                true;


            handle.setPointerCapture(
                event.pointerId
            );


            startX =
                event.clientX;


            startWidth =
                bubble.offsetWidth;

        }
    );


    handle.addEventListener(
        "pointermove",
        event => {

            if(!resizing)
                return;


            let width =
                startWidth +
                event.clientX -
                startX;


            width =
                Math.max(
                    80,
                    Math.min(
                        400,
                        width
                    )
                );


            const height =
                Math.max(
                    60,
                    Math.min(
                        300,
                        width * .72
                    )
                );


            bubble.style.width =
                width +
                "px";


            bubble.style.height =
                height +
                "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        event => {

            resizing =
                false;


            try{

                handle.releasePointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );

}


/* =========================================================
   SCREEN SHARE
========================================================= */

async function startScreenShare(){

    /*
       Cek permission.
    */

    if(
        screenPermission !==
        peer.id
    ){

        alert(
            "Kamu belum mendapatkan izin screen share dari host."
        );

        return;

    }


    /*
       Jangan mulai kalau sudah
       ada sharer lain.
    */

    if(
        screenOwner &&
        screenOwner !==
            peer.id
    ){

        alert(
            "Peserta lain sedang share screen."
        );

        return;

    }


    if(screenStream){

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices
            .getDisplayMedia
    ){

        alert(
            "Browser/perangkat ini tidak mendukung screen sharing."
        );

        return;

    }


    /*
       JANGAN mengubah tombol
       sebelum getDisplayMedia
       benar-benar berhasil.
    */

    let stream;


    try{

        stream =
            await navigator
            .mediaDevices
            .getDisplayMedia({

                video:{
                    frameRate:{
                        ideal:60,
                        max:60
                    },

                    width:{
                        ideal:1920,
                        max:1920
                    },

                    height:{
                        ideal:1080,
                        max:1080
                    }
                },

                audio:false

            });

    }catch(error){

        console.warn(
            "Screen capture:",
            error
        );


        /*
           User cancel = jangan ubah UI.
        */

        return;

    }


    /*
       BARU SEKARANG dianggap
       benar-benar sharing.
    */

    screenStream =
        stream;


    const track =
        stream
            .getVideoTracks()[0];


    if(!track){

        stopLocalScreenStream();

        return;

    }


    try{

        track.contentHint =
            "motion";

    }catch(error){}


    /*
       Simpan owner.
    */

    screenOwner =
        peer.id;


    /*
       UI berubah hanya setelah
       stream berhasil.
    */

    screenVideo.srcObject =
        screenStream;


    noScreen.classList.add(
        "hidden"
    );


    document.getElementById(
        "screenStatus"
    ).textContent =
        "🖥️ Kamu sedang share screen";


    shareBtn.style.display =
        "none";


    stopShareBtn.style.display =
        "inline-block";


    /*
       Beritahu host.
    */

    if(isHost){

        broadcastGuests({

            type:
                "screenOwner",

            owner:
                peer.id

        });

    }else{

        sendData(
            hostConnection,
            {

                type:
                    "screenStart",

                owner:
                    peer.id

            }
        );

    }


    /*
       Kirim screen langsung
       ke semua peserta.
    */

    Object.keys(
        participants
    ).forEach(
        id => {

            if(
                id ===
                peer.id
            )
                return;


            startScreenCall(
                id
            );

        }
    );


    /*
       Jika user menekan
       "Stop sharing" dari UI browser,
       track akan berakhir.
    */

    track.onended =
        () => {

            if(screenStream){

                stopScreenShare();

            }

        };

}


/* =========================================================
   SCREEN CALL
========================================================= */

function startScreenCall(
    targetId
){

    if(
        !screenStream
    )
        return;


    if(
        targetId ===
        peer.id
    )
        return;


    /*
       Jangan membuat duplicate
       screen call.
    */

    if(
        screenCalls[targetId]
    ){

        return;

    }


    try{

        const call =
            peer.call(
                targetId,
                screenStream,
                {

                    metadata:{
                        kind:
                            "screen",

                        owner:
                            peer.id

                    }

                }
            );


        screenCalls[targetId] =
            call;


        call.on(
            "error",
            error => {

                console.warn(
                    "Screen call:",
                    error
                );

            }
        );


        call.on(
            "close",
            () => {

                if(
                    screenCalls[targetId] ===
                    call
                ){

                    delete screenCalls[
                        targetId
                    ];

                }

            }
        );

    }catch(error){

        console.error(
            "Screen peer.call:",
            error
        );

    }

}


/* =========================================================
   INCOMING SCREEN
========================================================= */

function handleIncomingScreenCall(
    call
){

    const owner =
        call.metadata
        ?.owner ||
        call.peer;


    /*
       Hanya pemegang permission
       yang diterima.
    */

    if(
        screenPermission !==
        owner
    ){

        try{

            call.close();

        }catch(error){}

        return;

    }


    /*
       Kalau screen owner belum
       diterima dari data channel,
       kita tetap bisa menetapkannya
       dari call yang valid.
    */

    screenOwner =
        owner;


    screenCalls[
        owner
    ] =
        call;


    try{

        /*
           Screen call hanya
           one-way.

           Kita tidak mengirim
           webcam di sini.
        */

        call.answer();

    }catch(error){

        console.error(
            "answer screen:",
            error
        );

        return;

    }


    call.on(
        "stream",
        stream => {

            /*
               Pastikan screen owner
               masih valid.
            */

            if(
                screenPermission !==
                owner
            ){

                return;

            }


            screenOwner =
                owner;


            screenVideo.srcObject =
                stream;


            noScreen.classList.add(
                "hidden"
            );


            const name =
                participants[
                    owner
                ]?.name ||
                "Peserta";


            document.getElementById(
                "screenStatus"
            ).textContent =
                "🖥️ " +
                name +
                " sedang share screen";

        }
    );


    call.on(
        "close",
        () => {

            if(
                screenCalls[owner] ===
                call
            ){

                delete screenCalls[
                    owner
                ];

            }


            if(
                screenOwner ===
                owner
            ){

                clearRemoteScreen();

            }

        }
    );


    call.on(
        "error",
        error => {

            console.warn(
                "Incoming screen:",
                error
            );

        }
    );

}


/* =========================================================
   STOP SCREEN SHARE
========================================================= */

function stopScreenShare(){

    /*
       Jika tidak ada stream,
       jangan ubah UI.
    */

    if(
        !screenStream
    ){

        return;

    }


    const owner =
        peer.id;


    stopLocalScreenStream();


    /*
       Beritahu host.
    */

    if(isHost){

        screenOwner =
            null;


        broadcastGuests({

            type:
                "screenOwner",

            owner:
                null

        });

    }else{

        sendData(
            hostConnection,
            {

                type:
                    "screenStop",

                owner:
                    owner

            }
        );

    }


    clearRemoteScreen();


    /*
       Tutup outgoing screen calls.
    */

    Object.keys(
        screenCalls
    ).forEach(
        id => {

            try{

                screenCalls[id]
                    .close();

            }catch(error){}


            delete screenCalls[id];

        }
    );

}


/* =========================================================
   STOP LOCAL SCREEN STREAM
========================================================= */

function stopLocalScreenStream(){

    if(
        screenStream
    ){

        screenStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    screenStream =
        null;


    shareBtn.style.display =
        "inline-block";


    stopShareBtn.style.display =
        "none";

}


/* =========================================================
   CLEAR REMOTE SCREEN
========================================================= */

function clearRemoteScreen(){

    screenOwner =
        null;


    /*
       Jangan menghapus local
       screen stream jika kita
       sendiri sedang share.
    */

    if(
        !screenStream
    ){

        screenVideo.srcObject =
            null;


        noScreen.classList.remove(
            "hidden"
        );


        document.getElementById(
            "screenStatus"
        ).textContent =
            "Tidak ada screen share";

    }


    updateScreenUI();

}


/* =========================================================
   SCREEN UI
========================================================= */

function updateScreenUI(){

    /*
       Tombol share disabled jika
       tidak punya permission atau
       orang lain sedang sharing.
    */

    const allowed =
        screenPermission ===
        peer.id;


    const anotherSharing =
        screenOwner &&
        screenOwner !==
            peer.id;


    if(screenStream){

        shareBtn.style.display =
            "none";

        stopShareBtn.style.display =
            "inline-block";

        shareBtn.disabled =
            true;

        return;

    }


    shareBtn.style.display =
        "inline-block";

    stopShareBtn.style.display =
        "none";


    shareBtn.disabled =
        !allowed ||
        !!anotherSharing;

}

/* =========================================================
   HANDLE HOST COMMAND
========================================================= */

function handleHostCommand(
    data
){

    const command =
        data.command;


    /*
       MIC OFF
    */

    if(
        command ===
        "micOff"
    ){

        micEnabled =
            false;


        if(mediaStream){

            const track =
                mediaStream
                    .getAudioTracks()[0];


            if(track){

                track.enabled =
                    false;

            }

        }


        participants[
            peer.id
        ].micLocked =
            true;


        updateLocalState();

        updateLocalUI();

        announceMediaState();

        return;

    }


    /*
       MIC UNLOCK
    */

    if(
        command ===
        "micUnlock"
    ){

        participants[
            peer.id
        ].micLocked =
            false;


        updateHostUsers();

        return;

    }


    /*
       CAMERA OFF
    */

    if(
        command ===
        "cameraOff"
    ){

        cameraEnabled =
            false;


        if(mediaStream){

            const track =
                mediaStream
                    .getVideoTracks()[0];


            if(track){

                track.enabled =
                    false;

            }

        }


        participants[
            peer.id
        ].cameraLocked =
            true;


        updateLocalState();

        updateLocalUI();

        announceMediaState();

        return;

    }


    /*
       CAMERA UNLOCK
    */

    if(
        command ===
        "cameraUnlock"
    ){

        participants[
            peer.id
        ].cameraLocked =
            false;


        updateHostUsers();

        return;

    }

}

                    if(

                    ){

                        user.micLocked =

                        sendHostCommand(

                        );

                    }else{

                        user.micLocked =
                            true;


                        sendHostCommand(
                            user.id,

                        );

                    updateHostUsers();

                        sendHostCommand(

                        );

                    }else{

                        user.cameraLocked =
                            true;


                        sendHostCommand(
                            user.id,
                            "cameraOff"
                        );

                    }


                    updateHostUsers();

                };


            /*
               SCREEN
            */

            const screen =
                document.createElement(
                    "button"
                );


            if(
                screenPermission ===
                user.id
            ){

                screen.textContent =
                    "🖥️ Izin ✓";

            }else{

                screen.textContent =
                    "🖥️ Beri Izin";

            }


            screen.onclick =
                () => {

                    if(
                        screenPermission ===
                        user.id

                        /*

                        */

                        setScreenPermission(

                        );

                    }else{

                        );

                    }


                    setTimeout(

            actions.appendChild(

            );

            );


            box.appendChild(

            box.appendChild(

            box.appendChild(
                actions
            );


            hostUsers.appendChild(
                box
            );

/* =========================================================
   REMOVE PARTICIPANT
========================================================= */

function removeParticipant(
    id
){

    if(
        id ===
        peer.id
    )
        return;


    delete participants[id];


    /*
       Media call.
    */

    if(
        mediaCalls[id]
    ){

        try{

            mediaCalls[id]
                .close();

        }catch(error){}


        delete mediaCalls[id];

    }


    delete mediaCallPending[id];


    /*
       Screen call.
    */

    if(
        screenCalls[id]
    ){

        try{

            screenCalls[id]
                .close();

        }catch(error){}


        delete screenCalls[id];

    }


    /*
       Jika dia pemilik screen.
    */

    if(
        screenOwner ===
        id
    ){

        screenOwner =
            null;


        if(isHost){

            screenPermission =
                peer.id;


            broadcastGuests({

                type:
                    "screenPermission",

                permission:
                    peer.id

            });


            broadcastGuests({

                type:
                    "screenOwner",

                owner:
                    null

            });

        }


        clearRemoteScreen();

    }


    const bubble =
        document.getElementById(
            "bubble-" +
            id
        );


    if(bubble){

        bubble.remove();

    }


    renderBubbles();

    updateHostUsers();

    updateScreenUI();

}
