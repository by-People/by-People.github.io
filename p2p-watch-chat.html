<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Watch Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
.wrap{max-width:650px;margin:auto;padding:20px;min-height:100vh}
h1{text-align:center;margin:10px 0 4px}.sub{text-align:center;color:#94a3b8;margin-bottom:20px}
.card{background:#1e293b;border-radius:14px;padding:16px;margin:12px 0}
label{display:block;color:#cbd5e1;margin:10px 0 6px}
input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;margin-top:10px}
.primary{background:#2563eb;color:white}.secondary{background:#475569;color:white}.success{background:#22c55e;color:#052e16}
.row{display:flex;gap:8px}.row>*{flex:1}
.status{padding:10px;border-radius:9px;background:#334155;text-align:center}
.link{font-size:12px;word-break:break-all;color:#93c5fd;margin-top:8px}
.chat{height:330px;overflow:auto;background:#0f172a;border-radius:10px;padding:10px}
.msg{background:#1e293b;padding:9px 11px;border-radius:10px;margin:7px 0}
.msg.me{background:#2563eb}.name{font-size:11px;color:#cbd5e1;margin-bottom:3px}
.system{text-align:center;color:#94a3b8;font-size:12px;margin:8px}
.small{font-size:12px;color:#94a3b8;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>💬 P2P Watch Chat</h1>
<div class="sub">Chat langsung antar-browser</div>

<div class="card">
<label>Nama</label>
<input id="name" placeholder="Nama kamu">
<div class="row">
<button class="primary" onclick="createRoom()">Buat Room</button>
<button class="secondary" onclick="joinRoom()">Gabung Room</button>
</div>
</div>

<div class="card">
<div id="status" class="status">Belum terhubung</div>
<div id="roomInfo" class="hidden">
<label>Link Room</label>
<div id="roomLink" class="link"></div>
<button class="secondary" onclick="copyRoomLink()">📋 Copy Link</button>
</div>
</div>

<div class="card">
<div id="chat" class="chat"></div>
<div class="row">
<input id="message" placeholder="Tulis pesan..." onkeydown="enterSend(event)">
<button class="primary" onclick="sendMessage()">Kirim</button>
</div>
</div>

<div class="card small">
<b>Catatan:</b> Versi ini memakai PeerJS Cloud untuk signaling.
Pesan dikirim melalui koneksi WebRTC setelah peer terhubung.
Room dibuat berdasarkan ID di URL.
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let peer=null;
let conn=null;
let roomId=null;
let myName="";
let isHost=false;

const $=id=>document.getElementById(id);

function cleanId(){
  return "watch-" + Math.random().toString(36).slice(2,10);
}

function getName(){
  const n=$("name").value.trim();
  if(!n){alert("Masukkan nama terlebih dahulu.");return null;}
  localStorage.setItem("watch_name",n);
  return n;
}

function setStatus(t){$("status").textContent=t;}

function addSystem(t){
  const d=document.createElement("div");
  d.className="system"; d.textContent=t;
  $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight;
}

function addMessage(name,msg,me=false){
  const d=document.createElement("div");
  d.className="msg"+(me?" me":"");
  const n=document.createElement("div");
  n.className="name"; n.textContent=name;
  const m=document.createElement("div");
  m.textContent=msg;
  d.append(n,m);
  $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight;
}

function showRoom(){
  const url=location.origin+location.pathname+"?room="+encodeURIComponent(roomId);
  $("roomInfo").classList.remove("hidden");
  $("roomLink").textContent=url;
  history.replaceState(null,"","?room="+encodeURIComponent(roomId));
}

async function copyRoomLink(){
  const url=location.origin+location.pathname+"?room="+encodeURIComponent(roomId);
  await navigator.clipboard.writeText(url);
  alert("Link room berhasil disalin.");
}

function setupConn(c){
  conn=c;
  c.on("open",()=>{
    setStatus("🟢 Terhubung P2P");
    addSystem("Terhubung langsung.");
    c.send(JSON.stringify({type:"join",name:myName}));
  });
  c.on("data",raw=>{
    try{
      const d=JSON.parse(raw);
      if(d.type==="join"){
        addSystem(d.name+" bergabung.");
      }else if(d.type==="message"){
        addMessage(d.name,d.message,false);
      }
    }catch(e){}
  });
  c.on("close",()=>{
    setStatus("🟠 Peer terputus");
    addSystem("Koneksi terputus.");
  });
  c.on("error",e=>{
    console.error(e);
    setStatus("🔴 Error koneksi");
  });
}

function createRoom(){
  myName=getName(); if(!myName)return;
  roomId=cleanId(); isHost=true; showRoom();
  setStatus("Membuat room...");
  peer=new Peer(roomId);
  peer.on("open",id=>{
    setStatus("🟢 Room siap — tunggu teman");
    addSystem("Room "+id+" dibuat.");
  });
  peer.on("connection",c=>setupConn(c));
  peer.on("error",e=>{
    console.error(e);
    setStatus("🔴 "+e.type);
  });
}

function joinRoom(){
  myName=getName(); if(!myName)return;
  const params=new URLSearchParams(location.search);
  roomId=params.get("room");
  if(!roomId){
    alert("Buka link room dari host terlebih dahulu.");
    return;
  }
  isHost=false; showRoom();
  setStatus("Menghubungkan ke host...");
  peer=new Peer();
  peer.on("open",()=>{
    const c=peer.connect(roomId,{reliable:true});
    setupConn(c);
  });
  peer.on("error",e=>{
    console.error(e);
    setStatus("🔴 Room tidak ditemukan / koneksi gagal");
  });
}

function sendMessage(){
  if(!conn||conn.open!==true){
    alert("Belum terhubung ke peer.");
    return;
  }
  const msg=$("message").value.trim();
  if(!msg)return;
  const data={type:"message",name:myName,message:msg};
  conn.send(JSON.stringify(data));
  addMessage(myName,msg,true);
  $("message").value="";
}

function enterSend(e){
  if(e.key==="Enter")sendMessage();
}

window.addEventListener("load",()=>{
  const saved=localStorage.getItem("watch_name");
  if(saved)$("name").value=saved;
  const params=new URLSearchParams(location.search);
  if(params.get("room")){
    roomId=params.get("room");
    $("roomInfo").classList.remove("hidden");
    $("roomLink").textContent=location.href;
    setStatus("Room ditemukan — masukkan nama lalu klik Gabung Room");
  }
});
</script>
</body>
</html>
